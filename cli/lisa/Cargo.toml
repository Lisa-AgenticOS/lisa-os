[package]
name = "lisa"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
# Attachment payloads for multimodal asks (`lisa ask --attach`): the
# same version remoted pins, so the workspace resolves one copy.
base64 = "0.22.1"
blake3 = "1.8.5"
# Walking the knowledge pack for sync-knowledge (#175); same version
# as contextd so the workspace resolves one copy.
walkdir = "2.5.0"
# RFC822/MIME parsing for the mail indexer (#170): headers + the best
# text body out of a Maildir message. Boring, pure-Rust, widely used.
mailparse = "0.16.1"
# `statvfs` for the /home disk guard (#130 phase 0): `lisa dev` must
# refuse loudly when the container store's filesystem is tight rather
# than filling it. Same version lisa-guard pins, so the workspace
# resolves one copy.
libc = "0.2.180"
clap = { version = "4.6.3", features = ["derive", "env"] }
lisa-guard = { path = "../../libs/lisa-guard" }
clap_complete = "4.6.7"
forge-harness = { version = "0.1.0", path = "../../libs/forge-harness" }
bus-tools = { version = "0.1.0", path = "../../libs/bus-tools" }
harness-core = { version = "0.1.0", path = "../../libs/harness-core" }
hex = "0.4.3"
liblisa = { version = "0.1.0", path = "../../libs/liblisa" }
# agentd's manifest parser, for `lisa dev check` (ADR-0050 §4.1): the
# checker calls the grammar the bus enforces rather than restating it,
# because a rule that exists twice is #218 with different nouns.
lisa-agentd = { version = "0.1.0", path = "../../daemons/agentd" }
lisa-contextd = { version = "0.1.0", path = "../../daemons/contextd" }
lisa-ledger = { version = "0.1.0", path = "../../libs/lisa-ledger" }
lisa-modeld = { version = "0.1.0", path = "../../daemons/modeld" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
ureq = { version = "3.3.0", features = ["json"] }
# Agent Bus client (dev.lisaos.Agent1). Same feature set as agentd — the
# tokio flavor, never async-io (feature unification would flip agentd's
# zbus too, and async-io runs interface methods off-runtime → panics).
# blocking-api gives the sync CLI a bus client without an async runtime
# of its own.
zbus = { version = "5.18.0", features = ["p2p", "tokio", "blocking-api"], default-features = false }
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3.27.0"
