[workspace]
resolver = "3"
members = [
    "libs/liblisa",
    "libs/lisa-guard",
    "libs/lisa-ledger",
    "libs/lisa-peer",
    "libs/forge-harness",
    "libs/mcp-bus",
    "libs/harness-core",
    "libs/bus-tools",
    "daemons/inferenced",
    "daemons/modeld",
    "daemons/contextd",
    "daemons/remoted",
    "daemons/agentd",
    "daemons/harnessd",
    "portals/xdg-desktop-portal-lisa",
    "shell/consent/daemon",
    "cli/lisa",
    "tests/acl-fuzz",
    "tests/coder-eval",
    "tests/injection-suite",
    "apps/notes",
]

[workspace.package]
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/Lisa-AgenticOS/lisa-os"

[workspace.dependencies]
liblisa = { path = "libs/liblisa" }
lisa-modeld = { path = "daemons/modeld" }
