# Hidden Notifications
#
# Installed to /etc/xdg/fcitx5/conf/notifications.conf: the system-wide
# default fcitx5 falls back to when the user has no
# ~/.config/fcitx5/conf/notifications.conf of their own.
#
# wayland-diagnose-gnome is the "install the Input Method Panel GNOME
# Shell Extension" tip fcitx5 posts once per boot on GNOME Wayland
# (#191). Lisa ships fcitx5 for the writing tools and the double-Shift
# summon — neither needs candidate windows, so the recommendation is
# noise on every fresh boot. Whether kimpanel (or the fork owning the
# IM panel) ships for real CJK input is the ADR-0038 step 3 decision;
# until then boots are quiet.
#
# The SECTION form is load-bearing (#201): fcitx-config marshals
# Option<std::vector<...>> as numbered subkeys, and its ini writer
# spells a subtree as a [Section] — a flat `HiddenNotifications=value`
# line (or a slash key) unmarshals to an EMPTY vector and the nag
# survives. Proven by execution on the device 2026-08-03 with both
# controls: no suppression → diagnose runs AND notifies (4 bus hits);
# this form → diagnose still runs, zero notifications.
[HiddenNotifications]
0=wayland-diagnose-gnome
