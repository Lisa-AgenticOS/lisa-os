# The A/B update gate, in one place (issue #47).
#
# This composite action IS the ab-sysupdate scenario. It used to live
# inline in nightly.yml and therefore only ever ran against the NIGHTLY
# image; devices run the RELEASE image, which carries a materially
# different package set (the lisa-* split packages, llama.cpp,
# the forked gnome-control-center, lisa-audio-cs8409). A
# packaging difference that breaks staging — exactly issue #45's failure
# class — passed every gate and reached the field. Both lanes now call
# this action: nightly.yml against the plain image, release.yml against
# the artifact that is about to be published.
#
# What it proves (M0 acceptance, PLAN §10, ADR-0001 + the issue #20
# regression): the update half of A/B in the THREE-version shape that
# erased the field iMac's running root (booted v1 = OLDEST, v2 staged in
# the other slot, v3 available on the server, InstancesMax=2). Mechanism,
# verified against systemd main (src/sysupdate/sysupdate-transfer.c,
# transfer_vacuum()) and sysupdate.d(5): sysupdate installs into an
# `_empty`-labeled slot; if none exists it vacuums down to InstancesMax-1
# by evicting the OLDEST installed version — it never checks which
# partition backs `/` (its resource code only uses /usr's backing device
# to LOCATE the disk). The only guard is opt-in: ProtectVersion=
# (sysupdate.d(5), since v251) — "Protected versions are never removed
# while making room for new, updated versions ... to ensure that the
# currently booted OS version ... is not replaced/overwritten during
# updates" — where %A expands to the running os-release IMAGE_VERSION. So
# the incident is documented-but-surprising behavior our config triggered
# (no ProtectVersion= in the transfer definitions), not an upstream bug
# (cf. systemd/systemd#33339, the adjacent incomplete-version case) and
# not the v22 device's root=PARTLABEL/fstab state, which sysupdate never
# consults. The shipped transfers now carry ProtectVersion=%A; this
# scenario proves it in the incident's shape: boot v1 (the OLDEST) with
# v2 staged in slot B and v3 on the server, assert v3 installs OVER v2,
# v1's partition survives untouched (PARTLABEL + fs UUID + canary hash),
# and the reboot lands in v3. A two-version flow never covered this: with
# one slot still _empty, vacuum has nothing to evict, so the erase path
# is unreachable.
#
# DESTRUCTIVE: the scenario rewrites the image's ESP, relabels partition
# 3 and lets the guest write a full root image over it. Callers must be
# done with the image — release.yml runs this only after every published
# artifact has been extracted from it.
#
# Cost on a GitHub-hosted ubuntu runner: ~9 min for the nightly image,
# ~13 min for the (fuller) release image. Needs ~12 GiB of scratch on top
# of the image: one uncompressed 10 GiB root-slot copy at a time, plus
# its .xz.

name: A/B sysupdate scenario
description: >-
  Run the three-version systemd-sysupdate regression (issue #20) against a
  built Lisa disk image: booted-oldest slot protected, middle slot evicted,
  reboot lands in the new version.

inputs:
  image:
    description: >-
      Path to the raw disk image, relative to the workspace. Consumed
      destructively.
    required: true
  version:
    description: >-
      The image's baked IMAGE_VERSION, which is also its root_@v slot label
      and its UKI's lisa_@v.efi name — "1" for the nightly image,
      "YYYYMMDD.run" for a release image. This is v1, the booted-oldest
      version the scenario protects; v2 (staged) and v3 (the update) are
      derived by incrementing its last dot-separated numeric field, so a
      release build stages 20260725.31 and 20260725.32 over 20260725.30 —
      the same shape real consecutive releases take, and the ordering
      systemd's version comparison actually applies.
    required: true
  scenario:
    description: >-
      "normal" (default) runs the three-version protection scenario to
      completion. "interrupted-transfer" (issue #159) uses the same rig
      but SIGKILLs systemd-sysupdate inside the guest once the target
      slot has taken >100 MiB of writes, then asserts host-side that the
      half-written slot is DISTINGUISHABLE from a completed one by
      something the boot path can read — the field failure this guards
      against was an interrupted transfer leaving a mountable,
      plausibly-labeled slot that both boot attempts then died in.
      Never run on real hardware; that is the point of it living here.
    required: false
    default: normal

runs:
  using: composite
  steps:
    - name: "A/B: plant sysupdate config + demo scripts (loop mounts)"
      shell: bash
      env:
        AB_IMAGE: ${{ inputs.image }}
        AB_VERSION: ${{ inputs.version }}
        AB_SCENARIO: ${{ inputs.scenario }}
      run: |
        [ -f "$AB_IMAGE" ] || { echo "FAIL: no image at $AB_IMAGE"; exit 1; }
        # Everything this scenario writes goes in its own directory, and the
        # image is addressed absolutely. The release lane runs this in the
        # SAME workspace that already holds the artifacts about to be
        # published — and the demo UKIs it builds are named lisa_<v1>.efi,
        # exactly the release's own artifact name. Working in the workspace
        # root would silently publish a demo UKI.
        AB_IMAGE="$(realpath "$AB_IMAGE")"
        mkdir -p ab-scratch
        cd ab-scratch
        sudo apt-get update -qq
        sudo apt-get install -qq -y --no-install-recommends \
          fdisk jq binutils systemd-ukify systemd-boot-efi xz-utils \
          btrfs-progs mtools >/dev/null

        # v2/v3 by incrementing the last numeric field of v1: 1 -> 2, 3 and
        # 20260725.30 -> .31, .32. systemd compares version strings with
        # strverscmp_improved(), which compares digit runs numerically, so
        # both shapes order correctly — and the booted version stays the
        # OLDEST, which is the whole point of the scenario.
        AB_V1="$AB_VERSION"
        case "$AB_V1" in
          *.*) AB_HEAD="${AB_V1%.*}."; AB_TAIL="${AB_V1##*.}" ;;
          *)   AB_HEAD="";             AB_TAIL="$AB_V1" ;;
        esac
        case "$AB_TAIL" in
          ''|*[!0-9]*) echo "FAIL: version '$AB_V1' does not end in a numeric field"; exit 1 ;;
        esac
        # 10#: a run number like "08" is not octal.
        AB_V2="${AB_HEAD}$((10#$AB_TAIL + 1))"
        AB_V3="${AB_HEAD}$((10#$AB_TAIL + 2))"
        echo "versions: v1=$AB_V1 (booted, protected)  v2=$AB_V2 (staged)  v3=$AB_V3 (update)"
        {
          echo "AB_V1=$AB_V1"
          echo "AB_V2=$AB_V2"
          echo "AB_V3=$AB_V3"
        } >>"$GITHUB_ENV"

        LOOP=$(sudo losetup -P --show -f "$AB_IMAGE")
        mkdir -p mnt-root mnt-esp
        sudo mount "${LOOP}p2" mnt-root
        sudo mount "${LOOP}p1" mnt-esp

        # ProtectVersion=%A anchors on the running os-release
        # IMAGE_VERSION, so the demo only exercises the real protection
        # path if the image's baked version is the v1 we were told. The
        # nightly image bakes ImageVersion=1 (mkosi.conf); release.yml
        # rewrites it to YYYYMMDD.run. Assert the anchor before relying
        # on it — a silent mismatch would turn every assertion below into
        # a test of nothing.
        if ! grep -Fqx "IMAGE_VERSION=$AB_V1" mnt-root/usr/lib/os-release &&
           ! grep -Fqx "IMAGE_VERSION=\"$AB_V1\"" mnt-root/usr/lib/os-release; then
          echo "FAIL: image os-release does not carry IMAGE_VERSION=$AB_V1"
          grep -F IMAGE_VERSION mnt-root/usr/lib/os-release || true
          exit 1
        fi

        # sysupdate transfers: root partition images by slot label, UKIs
        # by ESP filename. Verify=no: the M1 hosted repo signs.
        sudo mkdir -p mnt-root/etc/sysupdate.d mnt-root/efi
        # HERMETIC: mask the image's baked production channel
        # (/usr/lib/sysupdate.d → releases/latest). Without this, sysupdate
        # merges both sources and picks the highest version — the PUBLISHED
        # release (e.g. 20260724.25) beats the local demo's, so the test
        # silently updates slot B to the real GitHub release instead of the
        # build under test (the root cause of the ab-sysupdate failures
        # since v25 shipped). Same-name /etc symlinks to /dev/null override
        # /usr/lib per unit-file semantics. This matters twice as much in
        # the release lane, where the local demo versions are adjacent to
        # the real channel's.
        for f in mnt-root/usr/lib/sysupdate.d/*; do
          # No nullglob in this shell: an empty directory leaves the glob
          # literal and this loop would create /etc/sysupdate.d/'*' — a
          # symlink that masks nothing, and the guest then updates to the
          # PUBLISHED release instead of the build under test, which is
          # the exact failure this loop exists to prevent.
          [ -e "$f" ] || { echo "FAIL: image ships no /usr/lib/sysupdate.d transfers — nothing to mask, and nothing to update with"; exit 1; }
          sudo ln -sf /dev/null "mnt-root/etc/sysupdate.d/$(basename "$f")"
        done
        sudo tee mnt-root/etc/sysupdate.d/50-root.conf >/dev/null <<'EOF'
        [Transfer]
        Verify=no
        # Issue #20: sysupdate has NO built-in guard for the partition
        # backing /. Vacuuming for InstancesMax evicts the OLDEST
        # version — if that is the booted one, the running root is
        # erased mid-session. ProtectVersion= (sysupdate.d(5), since
        # v251) is the documented guard: %A = the running os-release
        # IMAGE_VERSION. Mirrors the shipped 50-root.transfer.
        ProtectVersion=%A
        [Source]
        Type=url-file
        Path=http://10.0.2.2:8000/
        MatchPattern=lisa_@v.root.xz
        [Target]
        Type=partition
        Path=auto
        MatchPattern=root_@v
        MatchPartitionType=root
        InstancesMax=2
        EOF
        sudo tee mnt-root/etc/sysupdate.d/60-uki.conf >/dev/null <<'EOF'
        [Transfer]
        Verify=no
        # Same guard for the boot entry: keep the booted version's UKI
        # while vacuuming (issue #20; mirrors the shipped
        # 60-uki.transfer).
        ProtectVersion=%A
        [Source]
        Type=url-file
        Path=http://10.0.2.2:8000/
        MatchPattern=lisa_@v.efi
        [Target]
        Type=regular-file
        Path=/EFI/Linux
        PathRelativeTo=esp
        MatchPattern=lisa_@v.efi
        InstancesMax=2
        EOF

        # QEMU user-net DHCP so the guest can reach the runner (10.0.2.2).
        sudo tee mnt-root/etc/systemd/network/99-demo-dhcp.network >/dev/null <<'EOF'
        [Match]
        Name=en*
        [Network]
        DHCP=yes
        EOF

        # Slot generation marker (1/2/3), deliberately NOT the sysupdate
        # version: it is what the console assertions grep for, and it stays
        # legible whatever version shape the caller passes.
        echo 1 | sudo tee mnt-root/etc/lisa-slot-version >/dev/null
        # Canary: 1 MiB of random bytes baked into the v1 root. If the
        # update ever writes to the booted slot again (issue #20), the
        # canary hash — or the fs UUID, or the PARTLABEL — changes;
        # all three are asserted host-side after the run.
        head -c 1M /dev/urandom > canary.bin
        sudo cp canary.bin mnt-root/usr/lib/lisa-canary
        echo "AB_CANARY_SHA=$(sha256sum canary.bin | cut -d' ' -f1)" >>"$GITHUB_ENV"
        # One driver for all slots, branching on the version marker —
        # so every root stays a byte-copy of v1 except the marker and
        # os-release. (systemd.run= is container-only; a real enabled
        # unit is the way to script a VM boot.)
        # Which flavor of the run the guest driver should perform. Baked
        # as a file because the driver heredoc is single-quoted (no
        # expansion) and must stay so — it contains $ syntax of its own.
        echo "$AB_SCENARIO" | sudo tee mnt-root/etc/lisa-demo-scenario >/dev/null
        sudo tee mnt-root/usr/local/bin/lisa-demo.sh >/dev/null <<'EOF'
        #!/bin/bash
        v=$(cat /etc/lisa-slot-version)
        echo "LISA_SLOT_BOOTED=$v" > /dev/console
        scenario=$(cat /etc/lisa-demo-scenario 2>/dev/null || echo normal)
        if [ "$v" = "1" ] && [ "$scenario" = "interrupted-transfer" ]; then
            # The host boots this image a SECOND time to prove the rescue
            # resolver rejects the half-written slot. That boot lands on
            # this same root, so the driver must not start another update
            # — hence the marker written just before the poweroff below.
            if [ -f /etc/lisa-interrupted-done ]; then
                echo "LISA_SECOND_BOOT (interrupted slot on disk; no new transfer)" > /dev/console
                systemctl poweroff
                exit 0
            fi
            # Issue #159: what does a SIGKILL'd transfer leave behind?
            # Start the update, watch the TARGET slot's write counter
            # (/proc/diskstats field 10 = sectors written), and kill -9
            # once >100 MiB has landed — solidly mid-write, past any
            # metadata preamble. The host inspects the corpse.
            systemctl start systemd-networkd
            # An HTTP probe, not a bare /dev/tcp handshake: QEMU's slirp
            # accepts the TCP handshake for its own gateway address
            # whether or not the host port is alive, so a connect-only
            # probe "succeeds" against a dead server (#272 — that false
            # positive cost a full CI round-trip to prove innocent).
            # Success here means the SERVER ANSWERED with an HTTP line.
            http_probe() {
                exec 3<>/dev/tcp/10.0.2.2/8000 || return 1
                printf 'HEAD /SHA256SUMS HTTP/1.0\r\n\r\n' >&3
                local line=""
                read -t 5 -r line <&3
                exec 3<&- 3>&-
                case "$line" in HTTP/*) return 0;; *) return 1;; esac
            }
            net_ok=""
            for _ in $(seq 1 60); do
                if http_probe 2>/dev/null; then net_ok=1; break; fi
                sleep 1
            done
            # Exhaustion is a finding, not a shrug: without this line a
            # dead server surfaces only as a later sysupdate error that
            # reads like an OS failure.
            [ -n "$net_ok" ] || echo "LISA_NET_WAIT_EXHAUSTED (server at 10.0.2.2:8000 never answered HTTP)" > /dev/console
            # PROVE THE PROBE BEFORE TRUSTING IT. The first version read
            # `awk '$3=="vda3"' /proc/diskstats` without checking that the
            # line exists; an empty result makes every later `$(( cur -
            # base ))` a silent arithmetic error, the test never fires,
            # and the run ends in an ambiguous LISA_KILL_TOO_LATE that
            # says nothing about whether the transfer was fast or the
            # counter was missing. A watcher that cannot see is not a
            # watcher.
            # Watch the WHOLE DISK, not the target partition, and this is
            # the second thing this probe got wrong. sysupdate does not
            # write through /dev/vda3: it opens the disk and addresses
            # the partition through that descriptor, reporting
            #
            #   Successfully installed '…root.xz' as '/proc/self/fd/3p3'
            #
            # so every sector lands in vda's counter while vda3's stays
            # at exactly 0 — which is what the previous run measured for
            # 153 seconds while a 10 GiB image streamed past it. Summing
            # every vda* row is indifferent to which bdev the kernel
            # accounts to, so a future systemd that writes the partition
            # directly does not silently blind this again.
            probe() { awk '$3 ~ /^vda/ {s += $10} END {print s+0}' /proc/diskstats; }
            if [ "$(probe)" = "0" ] && ! grep -q " vda" /proc/diskstats; then
                echo "LISA_NO_DISKSTATS — no write counter for any vda device:" > /dev/console
                cat /proc/diskstats > /dev/console
                systemctl poweroff
                exit 0
            fi
            echo "LISA_WATCHING dev=vda* (summed)" > /dev/console
            /usr/lib/systemd/systemd-sysupdate update > /tmp/sysupdate.log 2>&1 &
            upd=$!
            base=$(probe)
            got=0; cur="$base"; ticks=0
            for _ in $(seq 1 900); do
                if ! kill -0 "$upd" 2>/dev/null; then break; fi
                cur=$(probe)
                # 100 MiB in 512-byte sectors. Past any metadata
                # preamble, well short of a 10 GiB slot.
                if [ "$(( cur - base ))" -gt 204800 ]; then got=1; break; fi
                ticks=$(( ticks + 1 ))
                # Progress every 15s: a run that ends "too late" must
                # still show what the counter was doing, so the next
                # iteration is data-driven rather than another guess.
                if [ $(( ticks % 15 )) = 0 ]; then
                    echo "LISA_WRITE_PROGRESS t=${ticks}s sectors=$(( cur - base ))" > /dev/console
                fi
                sleep 1
            done
            if [ "$got" = "1" ]; then
                kill -9 "$upd" 2>/dev/null
                # MIDTRANSFER, not MIDWRITE: the counter sums every vda*
                # write, so it cannot tell the slot write from the
                # download to /var/tmp. Both are interruptions of a
                # claimed target, which is what #159 is about — but the
                # name should not claim precision the measurement lacks.
                echo "LISA_KILLED_MIDTRANSFER sectors=$(( cur - base ))" > /dev/console
            else
                # The update finished (or died) before the threshold —
                # the kill proved nothing. Say so, with the evidence:
                # how far the counter got, and what sysupdate itself
                # said. `>` per line, because a pipe into /dev/console
                # from a subshell can lose output on poweroff.
                echo "LISA_KILL_TOO_LATE sectors=$(( cur - base )) after=${ticks}s" > /dev/console
                echo "--- sysupdate said:" > /dev/console
                tail -20 /tmp/sysupdate.log > /dev/console 2>&1
                echo "--- diskstats (vda*):" > /dev/console
                grep " vda" /proc/diskstats > /dev/console
            fi
            # Written LAST, and synced: the next boot of this slot must
            # see it, or the rescue-boot step turns into a second
            # uncontrolled transfer.
            : > /etc/lisa-interrupted-done
            sync
            systemctl poweroff
        elif [ "$v" = "1" ]; then
            systemctl start systemd-networkd
            # An HTTP probe, not a bare /dev/tcp handshake: QEMU's slirp
            # accepts the TCP handshake for its own gateway address
            # whether or not the host port is alive, so a connect-only
            # probe "succeeds" against a dead server (#272 — that false
            # positive cost a full CI round-trip to prove innocent).
            # Success here means the SERVER ANSWERED with an HTTP line.
            http_probe() {
                exec 3<>/dev/tcp/10.0.2.2/8000 || return 1
                printf 'HEAD /SHA256SUMS HTTP/1.0\r\n\r\n' >&3
                local line=""
                read -t 5 -r line <&3
                exec 3<&- 3>&-
                case "$line" in HTTP/*) return 0;; *) return 1;; esac
            }
            net_ok=""
            for _ in $(seq 1 60); do
                if http_probe 2>/dev/null; then net_ok=1; break; fi
                sleep 1
            done
            # Exhaustion is a finding, not a shrug: without this line a
            # dead server surfaces only as a later sysupdate error that
            # reads like an OS failure.
            [ -n "$net_ok" ] || echo "LISA_NET_WAIT_EXHAUSTED (server at 10.0.2.2:8000 never answered HTTP)" > /dev/console
            if /usr/lib/systemd/systemd-sysupdate update > /tmp/sysupdate.log 2>&1; then
                tail -5 /tmp/sysupdate.log > /dev/console
                echo "LISA_UPDATE_DONE" > /dev/console
                # Drop the loader.conf pin that forced booting the
                # OLDEST version (the field state). systemd-boot's
                # normal highest-filename selection then picks the
                # freshly installed UKI on reboot. /efi is the ESP,
                # fstab-mounted (ADR-0018) — sysupdate just staged the
                # UKI through it.
                rm -f /efi/loader/loader.conf
                systemctl reboot
            else
                tail -10 /tmp/sysupdate.log > /dev/console
                echo "LISA_UPDATE_FAILED" > /dev/console
                systemctl poweroff
            fi
        else
            systemctl poweroff
        fi
        EOF
        sudo chmod +x mnt-root/usr/local/bin/lisa-demo.sh
        sudo tee mnt-root/etc/systemd/system/lisa-demo.service >/dev/null <<'EOF'
        [Unit]
        Description=Lisa A/B sysupdate demo driver
        After=multi-user.target
        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/lisa-demo.sh
        EOF
        sudo mkdir -p mnt-root/etc/systemd/system/multi-user.target.wants
        sudo ln -sf ../lisa-demo.service mnt-root/etc/systemd/system/multi-user.target.wants/lisa-demo.service
        # systemd-firstboot prompts interactively on first boot and
        # blocks the console; the demo has no user.
        sudo ln -sf /dev/null mnt-root/etc/systemd/system/systemd-firstboot.service

        # Demo UKIs from the shipped kernel+initrd: v1 boots slot A and
        # runs the update; v2 (staged, must NEVER boot) and v3 (the
        # update) boot slot B. mkosi names its UKI lisa_<version>.efi, but
        # older/other profiles use a dash — accept both, skip the rescue
        # entry, and refuse to guess if the ESP has none.
        NAME=""
        shopt -s nullglob
        for f in mnt-esp/EFI/Linux/lisa[-_]*.efi; do
          case "$f" in *rescue*) continue ;; esac
          NAME="$(basename "$f")"
          break
        done
        shopt -u nullglob
        [ -n "$NAME" ] || { echo "FAIL: no lisa UKI in the image's ESP"; ls -l mnt-esp/EFI/Linux/; exit 1; }
        echo "baked UKI: $NAME"
        objcopy --dump-section .linux=vmlinuz --dump-section .initrd=initrd.img "mnt-esp/EFI/Linux/$NAME" discard.efi
        UKIFY=$(command -v ukify || echo /usr/lib/systemd/ukify)
        "$UKIFY" build --linux=vmlinuz --initrd=initrd.img \
          --cmdline='root=/dev/vda2 rw console=ttyS0 systemd.gpt_auto=no' \
          --output="lisa_${AB_V1}.efi"
        "$UKIFY" build --linux=vmlinuz --initrd=initrd.img \
          --cmdline='root=/dev/vda3 rw console=ttyS0 systemd.gpt_auto=no' \
          --output="lisa_${AB_V2}.efi"
        "$UKIFY" build --linux=vmlinuz --initrd=initrd.img \
          --cmdline='root=/dev/vda3 rw console=ttyS0 systemd.gpt_auto=no' \
          --output="lisa_${AB_V3}.efi"
        sudo rm "mnt-esp/EFI/Linux/$NAME"
        sudo cp "lisa_${AB_V1}.efi" "lisa_${AB_V2}.efi" mnt-esp/EFI/Linux/
        # Boot the OLDEST installed version first, like the field
        # device (still running .22 with .25 staged). Without the pin
        # systemd-boot would pick the v2 UKI (highest filename). The
        # v1 driver removes the pin after the update; boot-order
        # mechanics themselves are ab-rollback's business.
        sudo mkdir -p mnt-esp/loader
        printf 'default lisa_%s.efi\ntimeout 0\n' "$AB_V1" |
          sudo tee mnt-esp/loader/loader.conf >/dev/null

        # Diagnostics for the A/B UUID story (ADR-0018): what identifiers
        # does the built image actually carry? If fs UUIDs repeat across
        # runs, real A/B updates would collide the same way the byte-copy
        # below used to.
        echo "--- baked /etc/fstab:"; sudo cat mnt-root/etc/fstab 2>/dev/null || echo "(no fstab)"
        echo "--- filesystem/partition identifiers:"; sudo blkid | grep "$LOOP" || true

        sudo umount mnt-esp mnt-root

        # Record what must SURVIVE the run: v1's btrfs fs UUID (the
        # canary hash is already in env; the PARTLABEL is read from
        # the table afterwards).
        echo "AB_V1_UUID=$(sudo blkid -s UUID -o value "${LOOP}p2")" >>"$GITHUB_ENV"

        # v2 root = byte-copy of slot A with a bumped version marker,
        # written INTO the _empty B slot so the disk starts FULL —
        # the issue #20 precondition (both slots populated, booted =
        # oldest, next version on the server).
        # A byte-copy carries slot A's btrfs fsid; two same-fsid devices on
        # one disk send the kernel's btrfs device-scan into chaos (the
        # by-uuid device never shows up → emergency mode — exactly what a
        # real cloned-slot update would do). btrfstune -m gives the copy a
        # fresh metadata_uuid/fsid, the supported way to make a clone
        # mountable next to its origin (needs btrfs-progs).
        sudo dd if="${LOOP}p2" of=upd.img bs=4M status=none
        sudo chown "$USER:" upd.img
        sudo btrfstune -f -m upd.img
        echo "--- v2 root identifiers after re-uuid:"; sudo blkid upd.img || true
        mkdir -p mnt-upd
        sudo mount -o loop upd.img mnt-upd
        echo 2 | sudo tee mnt-upd/etc/lisa-slot-version >/dev/null
        # ProtectVersion=%A resolves per-slot: bump the baked
        # IMAGE_VERSION to match the slot's sysupdate version.
        grep -q '^IMAGE_VERSION=' mnt-upd/usr/lib/os-release
        sudo sed -i "s/^IMAGE_VERSION=.*/IMAGE_VERSION=${AB_V2}/" mnt-upd/usr/lib/os-release
        sudo umount mnt-upd
        sudo dd if=upd.img of="${LOOP}p3" bs=4M status=none conv=fsync
        sudo sfdisk --part-label "$LOOP" 3 "root_${AB_V2}"
        rm upd.img

        # v3 = another byte-copy of the pristine slot A (fresh fsid
        # again, so v1/v2/v3 never collide on one disk), served over
        # HTTP as the available update. Sequential copies keep peak
        # scratch usage to one slot image.
        sudo dd if="${LOOP}p2" of=upd.img bs=4M status=none
        sudo chown "$USER:" upd.img
        sudo btrfstune -f -m upd.img
        echo "--- v3 root identifiers after re-uuid:"; sudo blkid upd.img || true
        sudo mount -o loop upd.img mnt-upd
        echo 3 | sudo tee mnt-upd/etc/lisa-slot-version >/dev/null
        sudo sed -i "s/^IMAGE_VERSION=.*/IMAGE_VERSION=${AB_V3}/" mnt-upd/usr/lib/os-release
        sudo umount mnt-upd
        xz -T0 -1 upd.img
        mkdir -p serve
        mv upd.img.xz "serve/lisa_${AB_V3}.root.xz"
        cp "lisa_${AB_V3}.efi" serve/
        # sysupdate enumerates available versions via the SHA256SUMS
        # manifest even with Verify=no (that flag only skips GPG).
        (cd serve && sha256sum "lisa_${AB_V3}.root.xz" "lisa_${AB_V3}.efi" > SHA256SUMS)
        sudo losetup -d "$LOOP"
        echo "--- starting labels (expect root_${AB_V1} + root_${AB_V2} + _empty gone):"
        sfdisk -J "$AB_IMAGE" | jq -r '.partitiontable.partitions[].name'
        ls -lh serve/

    - name: "A/B: update over the middle slot + reboot into v3 (UEFI QEMU)"
      if: ${{ inputs.scenario != 'interrupted-transfer' }}
      shell: bash
      env:
        AB_IMAGE: ${{ inputs.image }}
      run: |
        set -o pipefail
        AB_IMAGE="$(realpath "$AB_IMAGE")"
        cd ab-scratch   # same scratch directory the previous step set up
        [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm
        sudo apt-get install -qq -y --no-install-recommends qemu-system-x86 ovmf >/dev/null
        (cd serve && python3 -m http.server 8000 >/dev/null 2>&1 &)
        # The server is backgrounded with its output discarded, so prove it
        # serves BEFORE booting the guest — a dead server otherwise
        # surfaces 6 minutes later as a guest-side pull failure that reads
        # like an OS regression (#272).
        server_up=""
        for _ in $(seq 1 20); do
          if curl -sf -o /dev/null http://127.0.0.1:8000/SHA256SUMS; then server_up=1; break; fi
          sleep 1
        done
        [ -n "$server_up" ] || { echo "FAIL: local http.server never served SHA256SUMS — harness fault, not the image's"; exit 1; }
        cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
        # 1200s, not the 900 this scenario used when it was nightly-only:
        # the release image's root carries ~8 GiB of packages, so the guest
        # downloads a much bigger .xz over slirp before writing the slot.
        # The job-level timeout is the real backstop; this one only decides
        # how long a hang is given to prove itself.
        timeout 1200 qemu-system-x86_64 \
          -machine q35 -accel kvm -accel tcg -m 4G -nographic \
          -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
          -drive if=pflash,format=raw,file=vars.fd \
          -drive "file=$AB_IMAGE,format=raw,if=virtio" \
          | tee console.log
        echo "--- console assertions"
        V1=$(grep -n "LISA_SLOT_BOOTED=1" console.log | head -1 | cut -d: -f1)
        DONE=$(grep -n "LISA_UPDATE_DONE" console.log | head -1 | cut -d: -f1)
        V3=$(grep -n "LISA_SLOT_BOOTED=3" console.log | head -1 | cut -d: -f1)
        [ -n "$V1" ] && [ -n "$DONE" ] && [ -n "$V3" ]
        [ "$V1" -lt "$DONE" ] && [ "$DONE" -lt "$V3" ]
        grep -q "reboot: Power down" console.log
        # v2 is a staging target only — it must never boot. (`!` would
        # be swallowed by bash -e, hence the explicit if.)
        if grep -q "LISA_SLOT_BOOTED=2" console.log; then
          echo "FAIL: the staged middle version booted"; exit 1
        fi
        echo "--- disk assertions"
        # v3 evicted the MIDDLE version's slot (root_v2 -> root_v3); the
        # booted oldest slot keeps its label. This is the issue #20
        # regression gate: on the field iMac root_1's partition (the
        # running root) was relabeled and overwritten instead.
        sfdisk -J "$AB_IMAGE" | jq -r '.partitiontable.partitions[].name' | tee labels.txt
        grep -Fqx "root_${AB_V1}" labels.txt
        grep -Fqx "root_${AB_V3}" labels.txt
        if grep -Fqx "root_${AB_V2}" labels.txt; then
          echo "FAIL: middle version still present — the wrong slot was evicted"; exit 1
        fi
        # The booted partition survived: same fs UUID, same version
        # marker, same 1 MiB canary content.
        LOOP=$(sudo losetup -P --show -f "$AB_IMAGE")
        [ "$(sudo blkid -s UUID -o value "${LOOP}p2")" = "$AB_V1_UUID" ]
        mkdir -p mnt-check
        sudo mount -o ro "${LOOP}p2" mnt-check
        [ "$(cat mnt-check/etc/lisa-slot-version)" = "1" ]
        [ "$(sudo sha256sum mnt-check/usr/lib/lisa-canary | cut -d' ' -f1)" = "$AB_CANARY_SHA" ]
        sudo umount mnt-check
        # The B slot now carries v3's payload, not v2's.
        sudo mount -o ro "${LOOP}p3" mnt-check
        [ "$(cat mnt-check/etc/lisa-slot-version)" = "3" ]
        sudo umount mnt-check
        sudo losetup -d "$LOOP"
        # ESP: the booted version's UKI is kept (protected), the
        # middle one was vacuumed, v3's was installed.
        OFF=$(( $(sfdisk -J "$AB_IMAGE" | jq -r '.partitiontable.partitions[0].start') * 512 ))
        mdir -b -i "$AB_IMAGE@@$OFF" ::/EFI/Linux/ | tee esp-after.txt
        grep -Fq "lisa_${AB_V1}.efi" esp-after.txt
        grep -Fq "lisa_${AB_V3}.efi" esp-after.txt
        if grep -Fq "lisa_${AB_V2}.efi" esp-after.txt; then
          echo "FAIL: middle UKI still in ESP — the wrong UKI was vacuumed"; exit 1
        fi
        echo "SYSUPDATE DEMO: PASS (booted-oldest v${AB_V1} protected, v${AB_V3} installed over v${AB_V2}, rebooted into v${AB_V3})"

    - name: "A/B: SIGKILL mid-transfer, then prove the slot is distinguishable (#159)"
      if: ${{ inputs.scenario == 'interrupted-transfer' }}
      shell: bash
      env:
        AB_IMAGE: ${{ inputs.image }}
      run: |
        set -o pipefail
        AB_IMAGE="$(realpath "$AB_IMAGE")"
        cd ab-scratch
        [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm
        sudo apt-get install -qq -y --no-install-recommends qemu-system-x86 ovmf >/dev/null
        (cd serve && python3 -m http.server 8000 >/dev/null 2>&1 &)
        # The server is backgrounded with its output discarded, so prove it
        # serves BEFORE booting the guest — a dead server otherwise
        # surfaces 6 minutes later as a guest-side pull failure that reads
        # like an OS regression (#272).
        server_up=""
        for _ in $(seq 1 20); do
          if curl -sf -o /dev/null http://127.0.0.1:8000/SHA256SUMS; then server_up=1; break; fi
          sleep 1
        done
        [ -n "$server_up" ] || { echo "FAIL: local http.server never served SHA256SUMS — harness fault, not the image's"; exit 1; }
        cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
        timeout 1200 qemu-system-x86_64 \
          -machine q35 -accel kvm -accel tcg -m 4G -nographic \
          -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
          -drive if=pflash,format=raw,file=vars.fd \
          -drive "file=$AB_IMAGE,format=raw,if=virtio" \
          | tee console.log
        echo "--- console assertions"
        grep -q "LISA_SLOT_BOOTED=1" console.log
        grep -q "LISA_KILLED_MIDTRANSFER" console.log
        grep -q "reboot: Power down" console.log
        if grep -q "LISA_KILL_TOO_LATE" console.log; then
          echo "FAIL: the transfer completed before the kill — the scenario proved nothing"
          exit 1
        fi
        echo "--- RECORD: what the interrupted slot actually looks like (#159)"
        sfdisk -J "$AB_IMAGE" | jq '.partitiontable.partitions[]' | tee parts.json
        # Select the B slot by node, not array index — the release image
        # carries more partitions than the nightly one.
        P3_LABEL=$(sfdisk -J "$AB_IMAGE" | jq -r '.partitiontable.partitions[] | select(.node | test("3$")) | .name // "(none)"')
        P3_ATTRS=$(sfdisk -J "$AB_IMAGE" | jq -r '.partitiontable.partitions[] | select(.node | test("3$")) | .attrs // "(none)"')
        P3_TYPE=$(sfdisk -J "$AB_IMAGE" | jq -r '.partitiontable.partitions[] | select(.node | test("3$")) | .type // "(none)"' | tr 'a-f' 'A-F')
        P2_TYPE=$(sfdisk -J "$AB_IMAGE" | jq -r '.partitiontable.partitions[] | select(.node | test("2$")) | .type // "(none)"' | tr 'a-f' 'A-F')
        echo "p3 label: $P3_LABEL"
        echo "p3 attrs: $P3_ATTRS"
        echo "p3 type:  $P3_TYPE"
        echo "p2 type:  $P2_TYPE  (the completed slot, for comparison)"
        LOOP=$(sudo losetup -P --show -f "$AB_IMAGE")
        echo "p3 blkid: $(sudo blkid "${LOOP}p3" || echo '(unreadable)')"
        MOUNTS=no
        mkdir -p mnt-check
        if sudo mount -o ro "${LOOP}p3" mnt-check 2>/dev/null; then
          MOUNTS=yes
          P3_MARKER=$(cat mnt-check/etc/lisa-slot-version 2>/dev/null || echo '(none)')
          echo "p3 mounts: yes; slot marker: $P3_MARKER"
          sudo umount mnt-check
        else
          echo "p3 mounts: no"
        fi
        sudo losetup -d "$LOOP"
        # WHERE THE KILL LANDED — reported, not asserted, and the reason
        # is a correction to this very block.
        #
        # It used to REQUIRE the slot to read v3, on the argument that
        # only v3's bytes could put it there. True in one direction and
        # false in the other: the marker file sits at some arbitrary
        # offset inside a 10 GiB filesystem image, so a transfer can have
        # written a hundred megabytes of that image without yet having
        # reached the extent holding /etc/lisa-slot-version. Run
        # 30720421209 is exactly that — 262780 sectors written, marker
        # still '2' — and the assertion failed a perfectly good
        # interruption.
        #
        # It also asked the wrong question. #159 is about a slot that was
        # CLAIMED and not finished; sysupdate relabels and retypes the
        # target before the first byte is fetched, so an interruption
        # during the download leaves the identical dangerous state — and
        # is the likelier one in the field, where the network is what
        # drops. Both stages are the case of interest. The GPT type below
        # is what proves the transfer was in flight and never committed,
        # and it needs no timing argument at all.
        case "$P3_MARKER" in
          "${AB_V3}") echo "stage: the kill landed after the slot's own bytes began arriving" ;;
          "${AB_V2}") echo "stage: the kill landed during the download or before the marker's extent was reached — the target was already claimed and retyped" ;;
          *)          echo "stage: target slot reads '$P3_MARKER' (neither $AB_V2 nor $AB_V3)" ;;
        esac
        echo "--- ASSERT: the half-written slot must not impersonate a finished one"
        # WHAT THIS TEST GOT WRONG THE FIRST TIME, kept here because the
        # mistake is easy to repeat: it read the PARTLABEL, the GPT
        # attribute bits and whether the slot mounts, found all three
        # identical to a good slot, and concluded nothing marked it. The
        # marker was in the fourth property it never read — the GPT
        # partition TYPE. sysupdate relabels the target and switches its
        # type to a derived "not finished with this yet" GUID before the
        # first byte lands, and only patches the real root type in on
        # success (src/sysupdate/sysupdate-transfer.c). Nightly
        # 30686479397 measured it: the killed slot came out
        # 7A01D3C6-92AC-43E9-BD77-5726B602AD9D while the finished slot
        # beside it carried the real root type.
        #
        # So the assertion is on the type, and it is one-sided on
        # purpose: we never hardcode the derived GUID, only require that
        # it is NOT a root type. A future systemd is free to derive a
        # different one; what may not change is that an unfinished slot
        # stops looking like a root partition.
        ROOT_TYPE_X86_64=4F68BCE3-E8CD-4DB1-96E7-FBCAF984B709
        ROOT_TYPE_ARM64=B921B045-1DF0-41C3-AF44-4C6F280D3FAE
        is_root_type() { [ "$1" = "$ROOT_TYPE_X86_64" ] || [ "$1" = "$ROOT_TYPE_ARM64" ]; }
        # POSITIVE CONTROL. A check that only ever asks "is p3 not a root
        # type" passes just as happily against a disk with no root types
        # at all — a wrong jq path, a renamed field, an image whose slots
        # moved. Require the FINISHED slot to carry the root type first,
        # so the discriminator is known to discriminate.
        if ! is_root_type "$P2_TYPE"; then
          echo "FAIL: the completed slot p2 does not carry a root GPT type ($P2_TYPE)."
          echo "The type check below cannot distinguish anything on this disk — fix the"
          echo "probe, do not trust its verdict."
          exit 1
        fi
        if is_root_type "$P3_TYPE"; then
          # Two very different things put a root type on p3, and calling
          # both "#159 regression" would send the next reader hunting a
          # marking bug that isn't there. sysupdate does the root
          # transfer before the UKI one, so a v3 UKI in the ESP means the
          # root transfer COMMITTED and the kill simply arrived late.
          ESP_OFF=$(( $(sfdisk -J "$AB_IMAGE" | jq -r '.partitiontable.partitions[0].start') * 512 ))
          if mdir -b -i "$AB_IMAGE@@$ESP_OFF" ::/EFI/Linux/ 2>/dev/null | grep -Fq "lisa_${AB_V3}.efi"; then
            echo "FAIL: the root transfer completed before the kill (v3 UKI is in the ESP)."
            echo "This is a TIMING failure of the scenario, not a marking failure of"
            echo "sysupdate — the guest's sector threshold fired too late to catch a write"
            echo "in progress. Nothing here says anything about #159."
            exit 1
          fi
          echo "FAIL (#159): interrupted transfer left label=$P3_LABEL attrs=$P3_ATTRS mounts=$MOUNTS type=$P3_TYPE"
          echo "— the half-written slot carries a real root type, so nothing on disk"
          echo "distinguishes it from a completed one. That is the state that turned an"
          echo "SSH drop into a USB reinstall (#45). sysupdate no longer marks the target;"
          echo "we must mark it ourselves before trusting a slot to boot."
          exit 1
        fi
        echo "INTERRUPTED-TRANSFER: PASS (label=$P3_LABEL attrs=$P3_ATTRS mounts=$MOUNTS)"
        echo "  the mark is the GPT type: $P3_TYPE is not a root type; p2's $P2_TYPE is."
        echo "  Label, attrs and mountability are all identical to a good slot — reading"
        echo "  any of those instead of the type is how this looked like a missing marker."

    # A mark nothing reads is not a mark. The step above proves the disk
    # carries one; this one proves the code that consumes it does its job,
    # by running it — ADR-0022 phase 2's resolver, on the very disk the
    # kill just damaged. Until now that resolver was only ever asserted to
    # EXIST (nightly "Initrd must carry the Lisa initrd overlay"), which
    # is the failure mode this repo keeps repeating: a file that is
    # present and a mechanism that works are different claims.
    #
    # The disk is the interesting one on purpose: root_3 sorts NEWER than
    # root_1, so a resolver that ignored the GPT type would pick the
    # half-written slot first. Getting root_1 is therefore only explicable
    # by the type check having fired.
    - name: "A/B: the rescue resolver must refuse the half-written slot (#159, ADR-0022 phase 2)"
      if: ${{ inputs.scenario == 'interrupted-transfer' }}
      shell: bash
      env:
        AB_IMAGE: ${{ inputs.image }}
      run: |
        set -o pipefail
        AB_IMAGE="$(realpath "$AB_IMAGE")"
        cd ab-scratch
        [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm
        # vmlinuz/initrd.img were dumped from the image's own UKI in the
        # plant step — the shipped initrd, overlay and all. Direct kernel
        # boot is the only way to hand it the rescue cmdline: the rescue
        # UKI is deliberately not installed in the ESP (it captures
        # sd-boot's default — see the nightly's note on issue #23).
        [ -s vmlinuz ] && [ -s initrd.img ] || { echo "FAIL: no kernel/initrd from the plant step"; ls -l; exit 1; }
        timeout 600 qemu-system-x86_64 \
          -machine q35 -accel kvm -accel tcg -m 3G -nographic -no-reboot \
          -kernel vmlinuz -initrd initrd.img \
          -append "root=/dev/lisa/newest-good rw console=ttyS0 rd.timeout=90 systemd.gpt_auto=no" \
          -drive "file=$AB_IMAGE,format=raw,if=virtio" \
          | tee rescue.log || true
        echo "--- what the resolver said"
        grep "lisa-rescue:" rescue.log || echo "(nothing — the resolver produced no output at all)"
        if ! grep -q "lisa-rescue:" rescue.log; then
          echo "FAIL (#159/ADR-0022): the resolver never ran. Its own cmdline gate"
          echo "(root=/dev/lisa/newest-good) was satisfied, so this is the unit not"
          echo "reaching the initrd or not being wanted by initrd-root-device.target."
          tail -40 rescue.log
          exit 1
        fi
        if ! grep -q "unfinished sysupdate target" rescue.log; then
          echo "FAIL (#159): the resolver ran but did not reject the half-written slot."
          echo "root_3 sorts newest, so it was the first candidate; slot_is_committed()"
          echo "should have refused it on its GPT type. Either the type check is not"
          echo "reading ID_PART_ENTRY_TYPE, or udevadm is missing from the initrd (in"
          echo "which case it returns 'committed' by design and trusts everything)."
          exit 1
        fi
        if ! grep -q "booting newest mountable root: /dev/vda2" rescue.log; then
          echo "FAIL (#159): the resolver rejected the bad slot but did not land on the"
          echo "good one (/dev/vda2). What it chose:"
          grep "lisa-rescue:" rescue.log
          exit 1
        fi
        # And it must actually BOOT — a resolver that picks the right
        # device but publishes it in a way systemd cannot mount leaves the
        # machine hung on sysroot.mount, which is no better than picking
        # wrong. LISA_SECOND_BOOT comes from the demo driver on the root
        # filesystem, so seeing it means userspace on the chosen slot ran.
        if ! grep -q "LISA_SECOND_BOOT" rescue.log; then
          echo "FAIL (#159): the resolver chose /dev/vda2 but the machine never reached"
          echo "userspace on it. The usual cause is the symlink: systemd's sysroot.mount"
          echo "Requires= a .device unit, which exists only for links udev published —"
          echo "a hand-made symlink is invisible to it and the mount waits forever."
          tail -40 rescue.log
          exit 1
        fi
        echo "RESCUE RESOLVER: PASS (root_3 half-written and refused on its GPT type;"
        echo "booted /dev/vda2 = root_1 and reached userspace)"
