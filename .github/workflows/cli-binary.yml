# Build the x86_64 Linux CLI + daemons on demand, for testing a change on
# a real device without turning that device into a build box (ADR-0023's
# spirit: the device stays representative). Dispatch, download the
# artifact, scp it over, run it.
name: cli-binary

on:
  workflow_dispatch:
    inputs:
      crates:
        description: 'cargo -p flags (space separated)'
        required: false
        default: 'lisa lisa-inferenced lisa-agentd lisa-remoted lisa-contextd'

# The default token is broader than any job here needs — none of them
# call the API or push anything (release.yml is the only writer, and
# declares contents: write for its `gh release create`).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build release binaries
        env:
          # Via env, not ${{ }} inline: a dispatch input interpolated
          # straight into the script is a shell-injection surface, and an
          # array keeps the word-splitting deliberate instead of accidental.
          CRATES: ${{ github.event.inputs.crates }}
        run: |
          set -o pipefail
          FLAGS=()
          for c in $CRATES; do FLAGS+=(-p "$c"); done
          cargo build --release "${FLAGS[@]}"
          mkdir -p out
          for f in target/release/*; do
            [ -f "$f" ] && [ -x "$f" ] && case "$f" in *.d|*.rlib|*.so) ;; *) cp "$f" out/ ;; esac
          done
          ls -la out/
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: lisa-linux-x86_64
          path: out/*
          if-no-files-found: error
          retention-days: 3
