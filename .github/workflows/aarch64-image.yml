# aarch64 image lane (ADR-0021). Builds the Track I image for arm64 on an
# Arch Linux ARM base and boot-checks it in qemu-system-aarch64 — the
# arm64 twin of nightly.yml's `image` job. Weekly, not nightly: this lane
# targets QEMU/UTM guests (Asahi bare-metal is explicitly deferred) and
# earns a faster cadence once it has a consumer.
#
# Since issue #28 this lane is not a bare-OS lane: it builds the SAME Lisa
# package set release.yml builds on x86_64 (the lisa-* split packages,
# llama.cpp, the forked gnome-control-center, zen-browser) natively in the
# ALARM container and folds them into the image, so the arm64 artifact is
# a real Lisa system rather than stock GNOME on ALARM. This lane — not
# release.yml — is where the arm64 packages are proven, because giving
# release.yml an arch matrix would also mean arm64 sysupdate transfers,
# per-arch release assets, and per-arch installed-version detection; that
# is a separate piece of work and none of it is needed to answer "do the
# packages build and install on ARM".
#
# Runner: GitHub's free arm64 runners for public repos. The label below is
# per GitHub's runner docs; unverified from the dev host — if the first
# run never gets picked up, the label is the first thing to check.
#
# A/B rollback/sysupdate ports (the UEFI jobs, via AAVMF/QEMU_EFI from
# Ubuntu's qemu-efi-aarch64 package — /usr/share/qemu-efi-aarch64/QEMU_EFI.fd,
# paths verified in an Ubuntu 24.04 arm64 container) are follow-up, once
# this boot check is green.

name: aarch64-image

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    # Raised from 90 with issue #28: this job now compiles the Rust
    # workspace, llama.cpp and gnome-control-center from source before it
    # even starts the image build, on a 4-vCPU runner.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Expose /dev/kvm
        run: |
          # KVM availability on arm64 hosted runners is unconfirmed until
          # the first run; the boot check falls back to TCG either way.
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "no KVM; QEMU will fall back to TCG"; fi
      - name: Build Lisa packages + image in Arch Linux ARM container
        run: |
          # menci/archlinuxarm is the same ALARM container the Track L e2e
          # already runs in. mkosi cannot come from ALARM's repos (extra
          # ships the pre-rewrite mkosi 14, which cannot parse this
          # config) and is not on PyPI; the Arch-proper package is
          # arch=(any), so install the exact build nightly.yml gets from
          # `pacman -Syu mkosi`, pinned via the permanent Arch archive.
          # Bump this pin together with whatever version the x86_64 lane
          # resolves.
          sudo podman run --rm --privileged \
            -v "$PWD":/src -w /src docker.io/menci/archlinuxarm:latest bash -ec '
              # pacman >= 7 sandbox cannot apply inside the container
              sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              pacman -Syu --noconfirm
              # mkosi.conf.d/aarch64.conf resets ToolsTree= (mkosi'\''s
              # default tools tree demands dnf5 + edk2-ovmf, which ALARM
              # does not carry), so the build uses the container'\''s own
              # tools — install the set the image build actually calls.
              pacman -S --noconfirm --needed \
                btrfs-progs dosfstools mtools cpio kmod xz zstd \
                e2fsprogs util-linux systemd-ukify sbsigntools
              # Package-build toolchain, same set release.yml installs on
              # x86_64: rust for the lisa-* workspace, glib2 for
              # lisa-shell'\''s makedepends (build-packages.sh runs makepkg
              # without -s), cmake for llama.cpp, devtools for arch-meson
              # (the forked gnome-control-center). All present on ALARM.
              pacman -S --noconfirm --needed base-devel rust git glib2 cmake devtools
              pacman -U --noconfirm https://archive.archlinux.org/packages/m/mkosi/mkosi-26-5-any.pkg.tar.zst

              # --- Lisa packages, natively on aarch64 (issue #28) --------
              # Same recipe as release.yml, from a clean clone of HEAD
              # (makepkg refuses to run as root).
              git clone --quiet /src /build
              useradd -m builder
              # -s builds (g-c-c) auto-install their makedepends via sudo.
              printf "builder ALL=(ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/builder
              chown -R builder /build
              sudo -u builder bash -c "cd /build && bash os/repo-tools/build-packages.sh /build/repo-out"
              # llama.cpp: source build, no per-arch cmake delta — see the
              # PKGBUILD for why GGML_NATIVE=OFF needs no ARM flags.
              sudo -u builder bash -c "cd /build/os/packages/llama.cpp && makepkg --nocheck --skippgpcheck --noconfirm"
              cp /build/os/packages/llama.cpp/llama.cpp-*.pkg.tar.* /build/repo-out/
              # Zen browser — repackage the upstream aarch64 release
              # tarball. Upstream publishes zen.linux-aarch64.tar.xz next
              # to the x86_64 one and the PKGBUILD pins its verified
              # sha256, so this is a real arm64 browser, not a stub; if
              # upstream ever drops the asset the digest check fails the
              # build rather than shipping something unverified. -d: binary
              # repackage, runtime deps are resolved at image-install time.
              # Split since #51: zen-browser-launcher (.desktop + icons +
              # the /usr/bin/zen-browser resolver, permanent) and
              # zen-browser (the /opt/zen payload, leaving the image for the
              # apps channel). The glob takes both.
              sudo -u builder bash -c "cd /build/os/packages/zen-browser && makepkg -d --nocheck --noconfirm"
              cp /build/os/packages/zen-browser/zen-browser-*.pkg.tar.* /build/repo-out/
              # Our forked gnome-control-center: stock 50.3 + the native
              # Intelligence panel (ADR-0012). ALARM ships stock 50.3-1 for
              # aarch64, so pkgrel=2 outranks it there exactly as it does
              # on Arch proper.
              sudo -u builder bash -c "cd /build/os/packages/gnome-control-center-lisa && makepkg -s --nocheck --skippgpcheck --noconfirm"
              cp $(ls /build/os/packages/gnome-control-center-lisa/*.pkg.tar.* | grep -v -- -debug-) /build/repo-out/
              # Reclaim disk before the image build — the llama.cpp and
              # gnome-control-center build trees are multi-GB and the
              # runner has ~14 GB. The built .pkg.tar are in repo-out.
              rm -rf /build/os/packages/*/src /build/os/packages/*/pkg
              df -h / | tail -1

              mkdir -p /build/pkgs
              cp /build/repo-out/*.pkg.tar.* /build/pkgs/
              # Fail loudly and early if a package silently did not build:
              # without this, a missing lisa-* only surfaces as a confusing
              # pacman "target not found" deep inside the mkosi run.
              # NB: globbing on "$p"-* not "$p"-[0-9]* — llama.cpp'\''s pkgver
              # is a build tag (b10093), not a digit. -debug- splits are
              # filtered so they cannot stand in for the real package.
              # The prefix glob cannot tell zen-browser from
              # zen-browser-launcher (#51 split them), so the payload'\''s real
              # proof is the opt/zen/zen check in the image-content step
              # below; this loop only catches a wholesale build failure.
              for p in lisa-inferenced lisa-modeld lisa-cli lisa-shell lisa-agentd \
                       lisa-notes lisa-remoted lisa-contextd llama.cpp \
                       zen-browser zen-browser-launcher \
                       gnome-control-center; do
                ls /build/pkgs/"$p"-*.pkg.tar.* 2>/dev/null | grep -qv -- "-debug-" \
                  || { echo "aarch64 package missing: $p" >&2; exit 1; }
              done
              ls -1 /build/pkgs

              mkdir -p /build/extra/etc/systemd/network
              printf "[Match]\nName=en*\n\n[Network]\nDHCP=yes\n" \
                > /build/extra/etc/systemd/network/80-dhcp.network
              # CI-generated drop-in, never committed: it points at paths
              # that only exist inside this container. Mirrors release.yml
              # 50-release.conf minus the release versioning (this lane
              # ships an unversioned artifact, root_1, as it did before).
              cat > os/mkosi/mkosi.conf.d/50-lisa-packages.conf <<EOF
          [Match]
          Architecture=arm64

          [Content]
          PackageDirectories=/build/pkgs
          Packages=lisa-inferenced
                   lisa-modeld
                   lisa-cli
                   lisa-shell
                   lisa-agentd
                   lisa-notes
                   lisa-remoted
                   lisa-contextd
                   llama.cpp
                   # Permanent: the .desktop, icons and the
                   # /usr/bin/zen-browser resolver (ADR-0023 phase 1).
                   zen-browser-launcher
                   # OVERLAP RELEASE ONLY — drop this line together with
                   # release.yml'\''s, once devices have taken the release
                   # that carries the resolver + lisa-apps-sync.timer. See
                   # the long note in release.yml'\''s Packages= block.
                   zen-browser
          ExtraTrees=/build/extra
          Autologin=yes
          EOF
              mkosi --directory os/mkosi --architecture=arm64 summary
              mkosi --directory os/mkosi --architecture=arm64 build
            '
          # Outputs were written by root inside the container.
          sudo chown -R "$USER:" os/mkosi
      # Proves the packages did not merely build but landed in the image —
      # the whole point of issue #28. mkosi would already have failed if
      # pacman could not resolve them, but that says nothing about what the
      # packages put on disk.
      - name: Verify the Lisa stack is inside the arm64 image
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends btrfs-progs >/dev/null
          LOOP=$(sudo losetup -P --show -f os/mkosi/lisa.raw)
          sudo mkdir -p /mnt/lisaroot
          sudo mount -o ro "${LOOP}p2" /mnt/lisaroot
          rc=0
          # The Intelligence panel icon is the fork's marker: ALARM ships a
          # stock gnome-control-center 50.3-1 that has no such file, so its
          # presence proves OUR build won, not just that some g-c-c is in.
          # Its install path is fixed by cc-lisa-panel-meson.build, so this
          # check does not depend on an upstream meson variable.
          for f in usr/bin/lisa usr/bin/lisa-inferenced usr/bin/llama-server \
                   usr/share/lisa/shell/assistant opt/zen/zen \
                   usr/bin/zen-browser \
                   usr/share/applications/zen-browser.desktop \
                   usr/share/icons/hicolor/128x128/apps/zen-browser.png \
                   usr/lib/systemd/system/lisa-apps-sync.timer \
                   etc/systemd/system/timers.target.wants/lisa-apps-sync.timer \
                   usr/lib/lisa/bin/lisa \
                   usr/bin/gnome-control-center \
                   usr/share/icons/hicolor/scalable/apps/lisa-intelligence-symbolic.svg; do
            if sudo test -e "/mnt/lisaroot/$f"; then echo "ok   $f"; else echo "MISSING $f"; rc=1; fi
          done
          # Guards against an accidentally cross-built or foreign binary.
          # NOTE: /usr/bin/lisa is the resolver *shell script* (issue #52),
          # so the real CLI to arch-check is the baked binary it falls back
          # to. Checking /usr/bin/lisa here kept this job red from 872d942.
          for b in usr/bin/llama-server usr/lib/lisa/bin/lisa opt/zen/zen; do
            sudo file "/mnt/lisaroot/$b" | grep -q "ARM aarch64" \
              || { echo "not an aarch64 binary: $b"; rc=1; }
          done
          sudo umount /mnt/lisaroot
          sudo losetup -d "$LOOP"
          exit $rc
      # Direct kernel boot to poweroff.target, like nightly.yml: reaching
      # poweroff exits QEMU cleanly; a hang is caught by the timeout;
      # "Welcome to" proves systemd came up from the image's own initrd +
      # root. -machine virt has a PL011 UART: the console is ttyAMA0, not
      # ttyS0. swtpm is left to the A/B follow-up jobs (parity with the
      # x86_64 lane's split of concerns, minimal first lane).
      - name: Boot check (qemu-system-aarch64)
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends qemu-system-arm ipxe-qemu >/dev/null
          timeout 900 qemu-system-aarch64 \
            -machine virt -cpu cortex-a72 -accel kvm -accel tcg -m 4G -nographic -no-reboot \
            -kernel os/mkosi/lisa.vmlinuz -initrd os/mkosi/lisa.initrd \
            -append "root=PARTLABEL=root_1 rw console=ttyAMA0 systemd.unit=poweroff.target systemd.show_status=1 systemd.gpt_auto=no" \
            -drive file=os/mkosi/lisa.raw,format=raw,if=virtio \
            | tee boot-console.log
          grep -q "Welcome to" boot-console.log
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: lisa-image-aarch64
          path: os/mkosi/lisa*.raw
          if-no-files-found: warn
          retention-days: 7
