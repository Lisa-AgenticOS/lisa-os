# Release pipeline (workflow_dispatch): builds the Track I image with
# the Lisa packages folded in, publishes a GitHub Release carrying BOTH
# the human artifact (dd-able USB image) and the machine artifacts (the
# systemd-sysupdate transfer set: versioned root partition image + UKI +
# SHA256SUMS). Installed systems point at releases/latest/download/, so
# each new release IS the update: `lisa update` pulls it into the B slot
# (PLAN §6 channels; ADR-0001/0003).
#
# Gates, in order, all before `gh release create`: the image must boot
# ("no boot, no release"), and it must survive the A/B sysupdate scenario
# — the same one the nightly runs, shared via
# .github/actions/ab-sysupdate (issue #47). The A/B gate exists here
# because this image is NOT the nightly one: the lisa-* split packages,
# llama.cpp, zen-browser, the forked gnome-control-center and
# lisa-audio-cs8409 only ever land in this lane, and a packaging
# difference that breaks staging (issue #45) used to be invisible to CI.

name: release

on:
  workflow_dispatch:
  schedule:
    # The edge channel (PLAN §6): weekly, CI-green — each build takes the
    # week's Arch security updates with it; devices' sysupdate timers pick
    # the release up automatically.
    - cron: "0 4 * * 1"

# Queue, never cancel: two releases interleaving `gh release create`
# is how you get a half-published version, and killing a build that has
# already uploaded assets leaves the release worse than not running.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # 60 -> 90: the A/B sysupdate gate below adds ~13 min (two 10 GiB
    # root-slot copies + xz, then a UEFI QEMU update/reboot cycle) to a
    # job that already runs ~30 min. Measured against the nightly's
    # ab-sysupdate job (~9 min on the smaller image) plus the release
    # image's fuller root.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Compute version
        id: ver
        run: echo "ver=$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      # The apps-channel Zen payloads (ADR-0023 phase 1, issue #51), BOTH
      # architectures, built here on the x86_64 runner because this is a
      # repackage of an upstream binary tarball, not a compile — so one
      # release carries a complete channel and an arm64 device is never told
      # "no payload for your arch".
      #
      # First step on purpose: it re-downloads the two pinned upstream
      # tarballs and fails on a digest mismatch, so a re-cut upstream asset
      # costs one minute here instead of surfacing after the ~40-minute
      # image build.
      - name: Build the per-arch Zen payloads (apps channel)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends zstd >/dev/null
          for a in x86_64 aarch64; do
            bash os/repo-tools/build-zen-payload.sh "$a" "${{ steps.ver.outputs.ver }}" .
          done
          ls -lh lisa-zen_*.tar.zst
      # Downloads only — never built artifacts. A cached .pkg.tar.* would
      # be a silent-regression machine: lisa-audio-cs8409 is welded to one
      # kernel release and its guards exist because a mismatched module
      # loads as NOTHING, so reusing a cached build after Arch moves the
      # kernel would turn a red build into quiet dead speakers. pacman
      # validates versions and signatures itself and re-downloads when they
      # move, and the kernel tarball is sha256-pinned, so neither of these
      # can serve stale bytes without something noticing.
      - name: Restore download caches (pacman + pinned kernel tarball)
        uses: actions/cache@v6
        with:
          path: |
            .ci-cache/pacman
            .ci-cache/srcdest
          # v2: the v1 caches carry a llama.cpp clone of ggerganov/,
          # which makepkg refuses now the PKGBUILD points at ggml-org/.
          # `restore-keys` means a poisoned entry is handed back on every
          # future run, so the prefix itself has to change — a key bump
          # is the only thing that is certain to shake it off.
          key: dl-v2-${{ runner.os }}-${{ hashFiles('os/packages/**/PKGBUILD') }}
          restore-keys: |
            dl-v2-${{ runner.os }}-
      # Built third-party packages, separate from the download cache
      # because it expires on a different clock. llama.cpp (294s) and the
      # gnome-control-center fork (183s) are pinned to fixed versions and
      # change perhaps monthly, so rebuilding them every dispatch threw
      # away ~8 of the ~20 minutes spent in makepkg.
      #
      # The WEEK is part of the key on purpose. Arch is rolling: a package
      # built against last month’s libraries installs cleanly (depends
      # are unversioned) and then fails at runtime on a missing soname.
      # Weekly rotation bounds that, and the container additionally proves
      # every restored package still links before trusting it — the key
      # limits how stale, the ldd check catches stale anyway.
      #
      # NO restore-keys, deliberately. A prefix fallback would hand back
      # last month’s entry the moment the week rolls over, which defeats
      # the rotation entirely — and is precisely how the download cache
      # kept serving a dead llama.cpp clone earlier today.
      - name: Week stamp for the package cache
        id: week
        run: echo "w=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Cache built third-party packages
        uses: actions/cache@v6
        with:
          path: .ci-cache/pkgs
          # EVERY PKGBUILD reachable through use_cached must be hashed
          # here. A package that is cached but not keyed keeps serving the
          # previous binary after its recipe changes, so the fix you just
          # made is not in the image and nothing says so — which is how
          # whisper.cpp would have gone on shipping a build-tree RUNPATH
          # after that bug was fixed. Adding a use_cached call without
          # adding its PKGBUILD here is a silent regression.
          key: pkgs-v2-${{ runner.os }}-${{ steps.week.outputs.w }}-${{ hashFiles('os/packages/llama.cpp/PKGBUILD', 'os/packages/gnome-control-center-lisa/PKGBUILD', 'os/packages/whisper.cpp/PKGBUILD', 'os/packages/piper/PKGBUILD', 'os/packages/piper/pinned-deps-no-network.patch') }}
      - name: Build Lisa packages + versioned image (Arch container)
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          mkdir -p .ci-cache/pacman .ci-cache/srcdest .ci-cache/pkgs
          sudo podman run --rm --privileged -v "$PWD":/src -w /src -e VER="$VER" \
            -v "$PWD/.ci-cache/pacman":/var/cache/pacman/pkg \
            -v "$PWD/.ci-cache/srcdest":/srcdest \
            -v "$PWD/.ci-cache/pkgs":/pkgcache \
            docker.io/library/archlinux:latest bash -ec '
              sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              # Keep downloads across runs (the cache mount above): pacman
              # deletes them after install unless told otherwise, and the
              # 150 MB pinned kernel tarball is re-fetched every build.
              sed -i "s|^#*CleanMethod.*|CleanMethod = KeepCurrent|" /etc/pacman.conf
              # Trust the [lisa] index in THIS container, which is the
              # one that later runs `mkosi build` (#270). ADR-0039 step 4
              # made the image pull lisa-desktop-shell from the hosted
              # index, and without the trust anchor pacman fails with
              # "key … is unknown / keyring is not writable" — which is
              # what took the nightly of 2026-08-05 down.
              #
              # From this checkout, never a keyserver: ADR-0034 forbids
              # the build depending on infrastructure we do not control.
              # The lsign-key step is the half that matters: an imported
              # key that is not locally signed is present and unused.
              pacman-key --init
              pacman-key --populate archlinux
              pacman-key --add /src/os/packages/lisa-keyring/lisa-packages.pub
              pacman-key --lsign-key 737240D11D28E109A474A8E5827E27417AF5982B
              echo "SRCDEST=/srcdest" >> /etc/makepkg.conf
              chmod 777 /srcdest
              # glib2: lisa-shell makedepends (build-packages.sh runs
              # makepkg without -s, so makedepends must be preinstalled).
              # fcitx5: lisa-ime makedepends (Fcitx5Core/Utils headers +
              # the Fcitx5ModuleDBus cmake config). Same reason as glib2
              # above — makepkg runs without -s.
              # cmake: the llama.cpp engine build. devtools: arch-meson,
              # used by the forked gnome-control-center PKGBUILD.
              # linux-headers (+ bc, which base-devel lacks): the CS8409
              # codec module build (ADR-0024). Preinstalled so its makepkg
              # can run with -d, and so the PKGBUILD can compare the
              # installed headers against its kernel pin.
              # vulkan-headers + shaderc + spirv-headers: the llama.cpp
              # Vulkan backend (#193) — headers to compile against,
              # glslc for its shaders, and the SPIRV-Headers cmake
              # package ggml-vulkan find_package()s on its own;
              # vulkan-icd-loader is its link-time libvulkan.
              pacman -Syu --noconfirm base-devel rust git mkosi glib2 cmake devtools \
                linux-headers bc fcitx5 vulkan-headers shaderc vulkan-icd-loader \
                spirv-headers

              # A cached git source is keyed by DIRECTORY NAME, never
              # by remote, and the cache step falls back to restore-keys
              # — so when a project moves host (llama.cpp: ggerganov/ ->
              # ggml-org/) the old clone comes back on every future run
              # and makepkg refuses it: "is not a clone of ...". That is
              # not a flake. Without this it never recovers, because the
              # stale entry always matches the restore key.
              #
              # Compare the STORED remote (config --get, not get-url,
              # which applies any insteadOf rewrite) against what the
              # PKGBUILD asks for, normalised so scheme and .git suffix
              # do not count as a mismatch. Drop only real mismatches;
              # makepkg re-clones what it needs.
              srcnorm() {
                echo "$1" | sed -e "s|^git+||" -e "s|^[a-z]*://||" \
                  -e "s|^git@|/|" -e "s|:|/|g" -e "s|\.git$||" -e "s|//*|/|g"
              }
              # Two runs were spent guessing why the loop below matched
              # nothing. It costs one line to never guess again.
              echo ">> srcdest contains:"; ls -la /srcdest 2>&1 | head -20
              for d in /srcdest/*/; do
                [ -d "$d" ] || continue
                if ! git -c safe.directory="*" -C "$d" rev-parse --git-dir >/dev/null 2>&1; then
                  echo ">> srcdest: $(basename "$d") is not a git repo — left alone"
                  continue
                fi
                name=$(basename "$d")
                have=$(git -c safe.directory="*" -C "$d" config --get remote.origin.url || true)
                # `|| true`: the container runs `bash -ec`, so a grep
                # that matches nothing (a cached source no PKGBUILD
                # claims any more) would abort the entire build.
                want=$(grep -rhoE "git\+https://[^\"#]+" /src/os/packages/*/PKGBUILD \
                       | sed "s|^git+||" | grep -E "/${name}(\.git)?$" | head -1 || true)
                if [ -n "$want" ] && [ "$(srcnorm "$have")" != "$(srcnorm "$want")" ]; then
                  echo ">> srcdest: $name has ${have:-no origin}, PKGBUILD wants $want — re-cloning"
                  rm -rf "$d"
                fi
              done

              # Reuse a PREBUILT third-party package when one is cached.
              #
              # llama.cpp and the gnome-control-center fork are pinned to
              # fixed versions and change perhaps monthly, yet they were
              # rebuilt on every dispatch: measured at 294s and 183s, i.e.
              # ~8 of the ~20 minutes spent in makepkg, thrown away each
              # time. Our own `lisa` package is NOT cached — it is the
              # thing being released.
              #
              # Arch is rolling, so a package built days ago can reference
              # a soname that no longer exists, install cleanly (depends
              # are unversioned) and fail at RUNTIME. The cache key is
              # rotated weekly, and every restored package is proved to
              # still link before it is trusted. Anything unresolved and
              # it is rebuilt.
              use_cached() {
                local name=$1 f probe bad bin
                # NOT a digit-anchored glob: the llama.cpp pkgver is
                # b10093, so $name-[0-9]* never matched it and the
                # cache-reuse this function exists for was silently
                # dead for exactly that package (#194). The open glob
                # needs the -debug- filter or head -1 can pick a debug
                # split package over the real one.
                f=$(ls -1 /pkgcache/$name-*.pkg.tar.* 2>/dev/null | grep -v -- "-debug-" | head -1)
                [ -n "$f" ] || return 1
                probe=$(mktemp -d)
                if ! bsdtar -xf "$f" -C "$probe" 2>/dev/null; then
                  rm -rf "$probe"; return 1
                fi
                bad=0 seen=0
                while IFS= read -r bin; do
                  seen=$((seen + 1))
                  if ldd "$bin" 2>/dev/null | grep -q "not found"; then bad=1; break; fi
                done < <(find "$probe/usr/bin" "$probe/usr/lib" -type f 2>/dev/null)
                rm -rf "$probe"
                # A check that inspected NOTHING has not passed. An empty
                # or truncated archive would otherwise sail through as
                # "no unresolved sonames" and ship a package with no
                # binaries in it.
                if [ "$seen" -eq 0 ]; then
                  echo ">> pkgcache: $name extracted no binaries to check — rebuilding"
                  return 1
                fi
                if [ "$bad" -ne 0 ]; then
                  echo ">> pkgcache: $name has an unresolved soname — rebuilding"
                  return 1
                fi
                echo ">> pkgcache: $name checked $seen file(s), all link"
                echo ">> pkgcache: reusing $(basename "$f")"
                cp "$f" /build/repo-out/
                return 0
              }
              cache_built() {  # <glob of freshly built packages>
                cp $1 /pkgcache/ 2>/dev/null || true
              }

              # Packages from a clean checkout of HEAD (makepkg refuses root).
              git clone --quiet /src /build
              useradd -m builder
              # The download cache restores as uid 1001 (the runner), so
              # every git source in /srcdest is owned by a stranger. Git
              # then refuses it for "dubious ownership" and
              # `git config --get remote.origin.url` returns NOTHING —
              # and makepkg reports that as "<dir> is not a clone of
              # <url>", which reads as a stale-URL problem and is not
              # one. Two runs were lost to that message before the
              # `ls -la` above showed the ownership. Hand the tree to the
              # user that will actually build with it.
              chown -R builder /srcdest
              # -s builds (g-c-c) auto-install their makedepends via sudo.
              printf "builder ALL=(ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/builder
              chown -R builder /build
              sudo -u builder bash -c "cd /build && bash os/repo-tools/build-packages.sh /build/repo-out"
              # The local inference engine (llama-server) — AUR-only, built
              # from source into the same repo the lisa packages use.
              if ! use_cached llama.cpp; then
                sudo -u builder bash -c "cd /build/os/packages/llama.cpp && makepkg --nocheck --skippgpcheck --noconfirm"
                cp /build/os/packages/llama.cpp/llama.cpp-*.pkg.tar.* /build/repo-out/
                cache_built "/build/os/packages/llama.cpp/llama.cpp-*.pkg.tar.*"
              fi
              # Zen browser — repackage the upstream release tarball. -d:
              # it is a binary repackage, so its runtime deps gtk3/nss/etc
              # need not be installed in the build container to package it;
              # pacman satisfies them at image-install time. Since #51 this
              # is a SPLIT build: zen-browser-launcher (the .desktop, icons
              # and /usr/bin/zen-browser resolver — permanent OS contract)
              # and zen-browser (the /opt/zen payload — leaving the image).
              # The glob picks up both.
              sudo -u builder bash -c "cd /build/os/packages/zen-browser && makepkg -d --nocheck --noconfirm"
              cp /build/os/packages/zen-browser/zen-browser-*.pkg.tar.* /build/repo-out/
              # Voice: the two engines PLAN §5.7.5 needs, neither of which
              # Arch packages. Until these exist on a device, `lisa
              # transcribe` and the spoken reply are code with nothing to
              # run — voice is not degraded, it is absent.
              #
              # NOT --nocheck, deliberately, for the same reason as the
              # SASL plugin below: the check() function in both PKGBUILDs
              # EXECUTE the built binary. the first version of whisper.cpp
              # passed a naive run test while carrying a RUNPATH into the
              # build tree — it resolved its libraries out of
              # /home/builder and would have failed on every real machine.
              # A binary that starts on the builder is not the claim worth
              # testing; the claim is that it starts anywhere.
              if ! use_cached whisper.cpp; then
                sudo -u builder bash -c "cd /build/os/packages/whisper.cpp && makepkg --skippgpcheck --noconfirm"
                cp /build/os/packages/whisper.cpp/whisper.cpp-*.pkg.tar.* /build/repo-out/
                cache_built "/build/os/packages/whisper.cpp/whisper.cpp-*.pkg.tar.*"
              fi
              # piper (TTS) — the OHF-Voice engine, NOT the same-named
              # gaming-mouse GUI in the Arch repos. -s installs onnxruntime,
              # which it links against; espeak-ng is pinned in its own
              # source=() because piper needs an API no espeak-ng release
              # has (see the PKGBUILD header).
              if ! use_cached piper; then
                sudo -u builder bash -c "cd /build/os/packages/piper && makepkg -s --skippgpcheck --noconfirm"
                cp /build/os/packages/piper/piper-*.pkg.tar.* /build/repo-out/
                cache_built "/build/os/packages/piper/piper-*.pkg.tar.*"
              fi
              # The XOAUTH2 SASL mechanism (issue #155). Cyrus SASL 2.1.28
              # ships anonymous/crammd5/digestmd5/login/ntlm/plain/sasldb/
              # scram and nothing else, so mbsync cannot authenticate to
              # Gmail with the token Online Accounts holds. Arch does not
              # package it and the AUR is not a dependency this OS takes
              # (ADR-0034).
              #
              # NOT --nocheck, unlike everything else here: the check()
              # in this PKGBUILD asks libsasl which mechanisms it loads,
              # with and without the plugin. A .so in the right directory
              # is not the same claim as a mechanism that works, and the
              # failure mode is mbsync saying "unsupported authentication
              # mechanism" while the file sits there looking installed.
              sudo -u builder bash -c "cd /build/os/packages/cyrus-sasl-xoauth2 && makepkg -s --noconfirm"
              cp /build/os/packages/cyrus-sasl-xoauth2/cyrus-sasl-xoauth2-*.pkg.tar.* /build/repo-out/
              # The [lisa] trust anchor (ADR-0039): the signing public
              # key into pacman keyring form. check() verifies the
              # committed key still carries the pinned fingerprint.
              sudo -u builder bash -c "cd /build/os/packages/lisa-keyring && makepkg -s --noconfirm"
              cp /build/os/packages/lisa-keyring/lisa-keyring-*.pkg.tar.* /build/repo-out/
              # Our forked gnome-control-center: stock 50.3 + the native
              # Intelligence panel (ADR-0012). -s installs its makedepends;
              # it takes the gnome-control-center name so the local repo
              # precedence installs it instead of the stock Arch package.
              if ! use_cached gnome-control-center; then
                sudo -u builder bash -c "cd /build/os/packages/gnome-control-center-lisa && makepkg -s --nocheck --skippgpcheck --noconfirm"
                cp $(ls /build/os/packages/gnome-control-center-lisa/*.pkg.tar.* | grep -v -- -debug-) /build/repo-out/
                cache_built "$(ls /build/os/packages/gnome-control-center-lisa/*.pkg.tar.* | grep -v -- -debug-)"
              fi
              # Apple CS8409/CS42L83 codec override — internal speakers on
              # the reference iMac18,2 (issue #44, ADR-0024). -d: its deps
              # are the kernel itself, pinned and checked inside the
              # PKGBUILD rather than installed here.
              #
              # THIS STEP FAILS THE RELEASE WHEN THE ARCH KERNEL MOVES, on
              # purpose. A codec module built for another kernel release
              # does not load at all, and the machine goes back to silent
              # speakers with nothing logged — so kernel drift has to be a
              # red build, not a quiet regression. Fix: re-pin
              # os/packages/lisa-audio-cs8409 (README "Re-pinning") and
              # re-verify on hardware. Do NOT paper over it here.
              # Back in the release (issue #44). The 7.1.5 header drift
              # is handled in prepare() in the PKGBUILD: the upstream
              # patch_cs8409.h.diff predates two lines the kernel added
              # inside its context, so those two are lifted out, the diff
              # applies with -F0, and they go back. Any OTHER drift still
              # fails the build loudly.
              sudo -u builder bash -c "cd /build/os/packages/lisa-audio-cs8409 && makepkg -d --nocheck --noconfirm"
              cp /build/os/packages/lisa-audio-cs8409/lisa-audio-cs8409-*.pkg.tar.* /build/repo-out/
              # Reclaim disk before the image build — the llama.cpp and
              # gnome-control-center build trees are multi-GB and the runner
              # has ~14 GB. The built .pkg.tar are already in repo-out.
              rm -rf /build/os/packages/*/src /build/os/packages/*/pkg
              df -h / | tail -1

              # Versioned USB/release profile outside the host mount.
              cp -r /src/os/mkosi /build/mkosi
              sed -i "s/^Label=root_1$/Label=root_${VER}/" /build/mkosi/mkosi.repart/10-root.conf
              sed -i "s/PARTLABEL=root_1/PARTLABEL=root_${VER}/" /build/mkosi/mkosi.conf
              # IMAGE_VERSION in os-release — sysupdate needs it (else
              # `--reboot` errors "os-release lacks IMAGE_VERSION").
              sed -i "s/^ImageVersion=1$/ImageVersion=${VER}/" /build/mkosi/mkosi.conf
              mkdir -p /build/pkgs /build/extra/etc/systemd/network
              cp /build/repo-out/*.pkg.tar.* /build/pkgs/
              printf "[Match]\nName=en*\n\n[Network]\nDHCP=yes\n" \
                > /build/extra/etc/systemd/network/80-dhcp.network
              mkdir -p /build/mkosi/mkosi.conf.d
              cat > /build/mkosi/mkosi.conf.d/50-release.conf <<EOF
          [Content]
          PackageDirectories=/build/pkgs
          Packages=lisa-inferenced
                   lisa-modeld
                   lisa-cli
                   lisa-shell
                   lisa-agentd
                   lisa-notes
                   lisa-remoted
                   # The trust boundary itself (PLAN §5.5, ADR-0008).
                   # Built and packaged since M2 and never listed here,
                   # so it has never been on a device — found by the
                   # first run of `lisa doctor`, which reported the unit
                   # as "not running" because nothing had installed it.
                   # §4 rule 1 says sandboxed apps never talk to the
                   # daemons directly; the component that enforces that
                   # cannot enforce it from a package repository.
                   lisa-portal
                   # M3 context fabric: without it the Assistant reports
                   # "Context daemon unavailable" and conversations do
                   # not survive a restart (field-found on v30).
                   lisa-contextd
                   # The other half of mail sync (issue #155). isync and
                   # gnome-keyring come from Arch and are named in
                   # os/mkosi/mkosi.conf; this is the piece neither Arch
                   # nor upstream Cyrus SASL provides, without which a
                   # connected Google account and an installed mbsync
                   # still cannot talk to each other.
                   # Writing tools + the double-tap-Shift summon
                   # (§5.7.3 layer 2). Both were written months ago and
                   # have never run on a device, because nothing built
                   # the addon.
                   lisa-ime
                   cyrus-sasl-xoauth2
                   # The [lisa] repo trust anchor: once devices carry
                   # this, SigLevel for [lisa] can flip to Required
                   # (ADR-0039; custody in lisa-packages README).
                   lisa-keyring
                   llama.cpp
                   # Voice (PLAN §5.7.5): the ear and the mouth. Neither
                   # is in Arch — see the build steps above. piper pulls
                   # onnxruntime from Arch as a normal dependency.
                   whisper.cpp
                   piper
                   # The .desktop entry, icons and /usr/bin/zen-browser
                   # resolver. ~10 KiB, and it stays here forever: it is
                   # what keeps the browser launchable no matter which side
                   # of the ADR-0023 migration a root slot is on.
                   zen-browser-launcher
                   # ---------------------------------------------------
                   # MIGRATION COMPLETE (ADR-0023 phase 1, issues #51/#89).
                   # `zen-browser` used to be baked here — ~363 MiB of root
                   # payload, paid twice by the A/B layout — for exactly
                   # one overlap cycle, because a device on an older image
                   # had a `lisa update` predating the payload pre-fetch
                   # and would have booted a slot with no browser at all.
                   #
                   # The condition for deleting it was "the next release
                   # after the overlap one has shipped AND devices have
                   # taken it". v31 (20260726.34) was the overlap release;
                   # .57, .60, .61 and .62 have since shipped, and the
                   # reference iMac is running 20260801.62. Verified on it
                   # 2026-08-02 rather than assumed:
                   #
                   #   $ zen-browser --version     # the shipped resolver
                   #   Mozilla Zen 1.21.8b
                   #
                   # answered by /var/lib/lisa-apps/payloads/zen/current,
                   # not by the baked /opt/zen. `lisa apps status` reports
                   # zen current 20260731.57.
                   #
                   # zen-browser-launcher stays FOREVER (above): the
                   # .desktop, icons and /usr/bin/zen-browser resolver are
                   # what keep the browser launchable whichever side of the
                   # migration a slot is on.
                   #
                   # RESIDUAL RISK, stated because it is not zero. A device
                   # that skips releases — offline across two of them —
                   # lands here from a pre-pre-fetch image: no /opt/zen in
                   # the new slot and possibly no /var payload yet. It
                   # self-heals when lisa-apps-sync.timer next fires (the
                   # nightly asserts that timer is enabled), but there is a
                   # window with no browser. Bounded and recoverable, and
                   # the alternative is baking 726 MiB across both slots
                   # forever.
                   # ---------------------------------------------------
                   # Apple CS8409/CS42L83 speaker override (issue #44,
                   # ADR-0024). depends=(linux=<exact version>), so if the
                   # image resolves a different kernel than the one this
                   # module was built for, pacman refuses here — a second,
                   # independent guard against shipping a dead module.
                   lisa-audio-cs8409
          ExtraTrees=/build/extra
          Autologin=yes
          EOF
              mkosi --directory /build/mkosi build
              cp /build/mkosi/lisa.raw /src/lisa-usb.raw
              # The packages are built into /build/repo-out, which lives
              # inside this --rm container and dies with it. The runtime
              # payload step (issue #52) runs on the HOST and needs the
              # lisa-cli package, so hand it across the boundary. Without
              # this that step cannot ever have worked — it was added
              # after v30 and this release is its first execution.
              mkdir -p /src/repo-out
              # ALL packages, not just lisa-cli: the publish step uploads
              # them for the [lisa] index (ADR-0039, #171), and anything
              # not copied here died with this --rm container — which is
              # why the v20260802.63 release carries exactly one package.
              cp /build/repo-out/*.pkg.tar.* /src/repo-out/
            '
          sudo chown -R "$USER:" lisa-usb.raw repo-out
          ls -lh repo-out/
      - name: Boot check — no boot, no release
        run: |
          set -o pipefail
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends qemu-system-x86 >/dev/null
          LOOP=$(sudo losetup -P --show -f lisa-usb.raw)
          sudo dd if="${LOOP}p1" of=/dev/null bs=1M count=1 status=none  # sanity: partitions exist
          sudo losetup -d "$LOOP"
          # Direct-kernel boot to poweroff.target: extract kernel+initrd
          # from the image's UKI via objcopy on a copy pulled with mtools.
          sudo apt-get install -qq -y --no-install-recommends mtools jq binutils >/dev/null
          OFF=$(( $(sfdisk -J lisa-usb.raw | jq -r '.partitiontable.partitions[0].start') * 512 ))
          NAME=$(mdir -b -i "lisa-usb.raw@@$OFF" ::/EFI/Linux/ | grep -o 'lisa[^/]*\.efi' | head -1)
          mcopy -i "lisa-usb.raw@@$OFF" "::/EFI/Linux/$NAME" boot-check.efi
          objcopy --dump-section .linux=vmlinuz --dump-section .initrd=initrd.img boot-check.efi discard.efi
          timeout 600 qemu-system-x86_64 \
            -machine q35 -accel kvm -accel tcg -m 4G -nographic -no-reboot \
            -kernel vmlinuz -initrd initrd.img \
            -append "root=PARTLABEL=root_${{ steps.ver.outputs.ver }} rw console=ttyS0 systemd.unit=poweroff.target" \
            -drive file=lisa-usb.raw,format=raw,if=virtio \
            | tee boot-console.log
          grep -q "Welcome to" boot-console.log
      # ADR-0023 phase 3 needs a real number, not the estimate that drove
      # the 8 -> 10 GiB slot bump: how full is the populated root, and how
      # much of it is the payload that is leaving? Recorded on every release
      # in the job summary so the slot-shrink decision reads measurements
      # instead of memory. Read-only, and BEFORE the A/B gate — that gate is
      # destructive to lisa-usb.raw.
      - name: The mail chain must be complete in the shipped image (#155)
        run: |
          set -o pipefail
          sudo apt-get install -qq -y --no-install-recommends btrfs-progs >/dev/null
          LOOP=$(sudo losetup -P --show -f lisa-usb.raw)
          sudo mkdir -p /mnt/mailcheck
          sudo mount -o ro "${LOOP}p2" /mnt/mailcheck
          fail=0
          # This assertion used to live ONLY in nightly.yml, where it
          # could never pass: that job runs a plain `mkosi build` with no
          # PackageDirectories=, so cyrus-sasl-xoauth2 — which only
          # os/packages builds — is absent by construction while `isync`
          # arrives from Arch on both images. It was therefore either red
          # or meaningless everywhere. It belongs HERE, on the artifact
          # that is about to be published and actually contains the
          # package.
          #
          # The PKGBUILD's own check() already proves the mechanism
          # loads; this proves the built plugin reached the IMAGE. Those
          # are different claims, and #155 was the second one failing.
          if [ -x /mnt/mailcheck/usr/bin/mbsync ] &&
             ! ls /mnt/mailcheck/usr/lib/sasl2/libxoauth2.so >/dev/null 2>&1; then
            echo "FAIL: mbsync ships but SASL has no XOAUTH2 mechanism"
            echo "      (os/packages/cyrus-sasl-xoauth2 did not reach the image)."
            echo "      Gmail cannot be authenticated with an Online Accounts token."
            ls -l /mnt/mailcheck/usr/lib/sasl2/ 2>/dev/null || echo "      (no /usr/lib/sasl2 at all)"
            fail=1
          fi
          # A check that inspected nothing has not passed.
          if [ ! -x /mnt/mailcheck/usr/bin/mbsync ]; then
            echo "FAIL: no mbsync in the release image — the mail chain"
            echo "      cannot sync at all (mkosi.conf Packages= isync)."
            fail=1
          fi
          sudo umount /mnt/mailcheck
          sudo losetup -d "$LOOP"
          [ "$fail" -eq 0 ] || exit 1
          echo "mail chain (mbsync + XOAUTH2 mechanism) present in the image: OK"
      # ADR-0039 step 5, the integration test the split made necessary:
      # does the image built from [lisa] carry the desktop it expects?
      # Under one repo this was structurally guaranteed. It is not any
      # more — lisa-desktop-shell is built by another repo's CI and
      # arrives through a hosted index, so "the image has last week's
      # shell in it" is now a thing that can happen quietly.
      #
      # Every assertion below is about a path something else READS.
      # ADR-0038's own argument for the fork is the incident where an
      # extension silently did not load and the desktop was stock GNOME
      # with nobody noticing: a desktop that fails by looking like
      # something else needs a test that looks.
      - name: The desktop must be complete in the shipped image (ADR-0038/0039)
        run: |
          set -o pipefail
          LOOP=$(sudo losetup -P --show -f lisa-usb.raw)
          sudo mkdir -p /mnt/lisadesk
          sudo mount -o ro "${LOOP}p2" /mnt/lisadesk
          R=/mnt/lisadesk
          fail=0
          say() { echo "FAIL: $*"; fail=1; }

          # -- 1. The shell is ours, and stock is not there ------------
          # pacman's local db lives in the root tree, so the installed
          # set is readable straight off the mounted partition.
          sudo ls "$R/var/lib/pacman/local" > /tmp/installed.txt
          grep -q '^lisa-desktop-shell-' /tmp/installed.txt \
            || say "lisa-desktop-shell is not installed — the image has no Lisa Desktop."
          if grep -q '^gnome-shell-' /tmp/installed.txt; then
            say "stock gnome-shell is installed; it should have been replaced (provides/conflicts)."
          fi
          [ -x "$R/usr/bin/gnome-shell" ] \
            || say "no /usr/bin/gnome-shell — nothing can start a session."

          # -- 2. GDM can offer the session, and start it --------------
          for f in usr/share/wayland-sessions/lisa-desktop.desktop \
                   usr/share/gnome-session/sessions/lisa.session \
                   usr/lib/systemd/user/lisa-desktop@.service \
                   usr/lib/systemd/user/gnome-session@lisa.target.d/lisa-session.conf; do
            [ -e "$R/$f" ] || say "missing $f — the session cannot be selected or cannot start."
          done

          # -- 3. It is the DEFAULT session ---------------------------
          # GDM has no default-session setting; its fallback is the
          # hardcoded string "gnome" (gdm-session.c). The only lever is
          # the user's saved session in accountsservice, and /var is a
          # separate partition, so the record ships as a factory copy
          # that tmpfiles lays down on first boot.
          A=$R/usr/share/factory/var/lib/AccountsService/users/lisa
          if ! sudo grep -q '^Session=lisa-desktop$' "$A" 2>/dev/null; then
            say "the factory accountsservice record does not select lisa-desktop;"
            echo "      GDM would fall back to its hardcoded \"gnome\"."
          fi
          [ -e "$R/usr/lib/tmpfiles.d/lisa-default-session.conf" ] \
            || say "nothing copies that record onto the persistent /var — it would never be read."

          # -- 4. The three extensions are where the shell looks ------
          # GNOME Shell scans GLib.get_system_data_dirs() for
          # gnome-shell/extensions (js/misc/fileUtils.js,
          # collectFromDatadirs) — XDG_DATA_DIRS, not the shell's
          # compiled-in datadir. /usr/share is in that list by default.
          for uuid in lisa-overlay@lisa-os.org lisa-launcher@lisa-os.org \
                      lisa-desktop@lisa-os.org; do
            [ -e "$R/usr/share/gnome-shell/extensions/$uuid/extension.js" ] \
              || say "extension $uuid is not installed where the shell scans."
          done

          # -- 5. ...and they are ENABLED for the shell that runs ------
          # This is the assertion the private-prefix build would have
          # failed. enabled-extensions comes from lisa-shell's
          # 10_lisa-shell.gschema.override, which only takes effect
          # because it is compiled into the SAME schema directory the
          # shell reads. The compiled db is binary; the default value is
          # a literal string inside it.
          S=$R/usr/share/glib-2.0/schemas/gschemas.compiled
          [ -s "$S" ] || say "no compiled gschemas — every default in the image is inert."
          if ! sudo grep -aq 'lisa-overlay@lisa-os.org' "$S"; then
            say "the compiled schemas do not carry Lisa's enabled-extensions default."
            echo "      The desktop would boot looking like stock GNOME with none of"
            echo "      Lisa's surfaces in it, and nothing would say so."
          fi
          sudo grep -aq 'app.lisaos.Surfer.desktop' "$S" \
            || say "the compiled schemas do not carry Lisa's dock (favorite-apps)."

          # -- 6. The dconf system defaults are compiled --------------
          # dconf is a settings BACKEND: prefix-independent, and the
          # layer that survives whichever shell reads it. But the text
          # in /etc/dconf/db/local.d does nothing until `dconf update`
          # turns it into the binary db, which postinst does.
          D=$R/etc/dconf/db/local
          [ -s "$D" ] || say "/etc/dconf/db/local was never compiled — the app grid and key defaults are inert."
          sudo grep -aq 'Utilities' "$D" \
            || say "the compiled dconf db does not carry the app-folder defaults."

          # -- 7. The apps are launchable from the dock ---------------
          # Gio.AppInfo reads XDG_DATA_DIRS; /usr/share/applications is
          # the same path for any shell.
          for d in app.lisaos.Surfer app.lisaos.Assistant; do
            [ -e "$R/usr/share/applications/$d.desktop" ] \
              || say "$d.desktop is missing — the dock would render a gap."
          done

          sudo umount /mnt/lisadesk
          sudo losetup -d "$LOOP"
          [ "$fail" -eq 0 ] || exit 1
          echo "Lisa Desktop is installed, selectable, default, and its extensions,"
          echo "schemas, dconf defaults and apps are all where something reads them: OK"
      - name: Measure the populated root (ADR-0023 phase 3 input)
        run: |
          set -o pipefail
          sudo apt-get install -qq -y --no-install-recommends btrfs-progs >/dev/null
          LOOP=$(sudo losetup -P --show -f lisa-usb.raw)
          sudo mkdir -p /mnt/lisaroot
          sudo mount -o ro "${LOOP}p2" /mnt/lisaroot
          total=$(sudo du -sxm /mnt/lisaroot | cut -f1)
          # `if`, not `[ … ] && …`: GitHub runs `run:` under `bash -e`, and
          # after the migration completes /opt/zen is GONE — a bare test
          # would then fail the whole release step on a zero it expected.
          zen=0
          if [ -d /mnt/lisaroot/opt/zen ]; then
            zen=$(sudo du -sxm /mnt/lisaroot/opt/zen | cut -f1)
          fi
          {
            echo "### Populated root (ADR-0023)"
            echo ""
            echo "| what | MiB |"
            echo "|---|---|"
            echo "| populated root total | $total |"
            echo "| of which /opt/zen (leaving the image) | $zen |"
            echo "| root without /opt/zen | $((total - zen)) |"
            echo ""
            echo "Slot size is 10240 MiB (os/mkosi/mkosi.repart/10-root.conf), paid twice."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "populated root: ${total} MiB (/opt/zen: ${zen} MiB)"
          sudo umount /mnt/lisaroot
          sudo losetup -d "$LOOP"
      - name: Version the UKI + extract sysupdate artifacts
        run: |
          set -o pipefail
          VER="${{ steps.ver.outputs.ver }}"
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends mtools fdisk jq xz-utils zstd >/dev/null
          OFF=$(( $(sfdisk -J lisa-usb.raw | jq -r '.partitiontable.partitions[0].start') * 512 ))
          ESP="lisa-usb.raw@@$OFF"
          # The shipped UKI becomes the versioned type#2 entry so
          # installed-version detection matches lisa_@v.efi.
          NAME=$(mdir -b -i "$ESP" ::/EFI/Linux/ | grep -o 'lisa[^/]*\.efi' | head -1)
          mcopy -i "$ESP" "::/EFI/Linux/$NAME" "lisa_${VER}.efi"
          mdel -i "$ESP" "::/EFI/Linux/$NAME"
          mcopy -i "$ESP" "lisa_${VER}.efi" "::/EFI/Linux/lisa_${VER}.efi"
          mdir -i "$ESP" ::/EFI/Linux/
          # Root slot A is partition 2; its byte image is the update
          # payload future systems pull into their B slot.
          LOOP=$(sudo losetup -P --show -f lisa-usb.raw)
          sudo dd if="${LOOP}p2" of="lisa_${VER}.root" bs=4M status=none
          sudo losetup -d "$LOOP"
          sudo chown "$USER:" "lisa_${VER}.root"
          xz -T0 -3 "lisa_${VER}.root"
          zstd -q -T0 -8 --sparse lisa-usb.raw -o "lisa-usb-${VER}.raw.zst"
          # The app-update channel (ADR-0020): the interpreted app tree as
          # its own artifact, so `lisa apps update` refreshes apps without an
          # image update. Packed from the SAME commit as the image, by the
          # SAME script the lisa-shell package stages /usr/share/lisa/shell
          # with — this used to be `tar -C shell .`, which carried none of
          # apps/, so Mail, Surfer and Preview were absent from the channel
          # that exists to update them (#239 defect 2).
          bash os/repo-tools/build-apps-payload.sh apps-payload \
            "$PWD/lisa-apps_${VER}.tar.zst"
          # The runtime channel (issue #52): the CLI and its skills, so a
          # CLI fix reaches devices without an OS release or a reboot.
          # Per-arch, because this one is a compiled binary — the payload
          # must match the machine. The binary was built in the container
          # step above and extracted from the lisa-cli package, which is
          # the SAME binary the image bakes: one build, two delivery
          # paths, never a skew between them.
          rt="runtime-payload"
          rm -rf "$rt" && mkdir -p "$rt/bin" "$rt/skills"
          tar -xOf repo-out/lisa-cli-*.pkg.tar.* usr/lib/lisa/bin/lisa \
            > "$rt/bin/lisa" 2>/dev/null || \
            tar --use-compress-program=unzstd -xOf repo-out/lisa-cli-*.pkg.tar.zst \
              usr/lib/lisa/bin/lisa > "$rt/bin/lisa"
          chmod 0755 "$rt/bin/lisa"
          file "$rt/bin/lisa" | grep -q 'x86-64' || {
            echo "runtime payload is not an x86_64 binary"; exit 1; }
          cp -r skills/. "$rt/skills/"
          tar --zstd -cf "lisa-runtime_${VER}_x86_64.tar.zst" -C "$rt" .
          # The per-arch Zen payloads were built in the first step; they go
          # into the SAME manifest, because `lisa apps` verifies every
          # payload against it before unpacking anything (ADR-0023: pins are
          # load-bearing for everything on /var).
          sha256sum "lisa_${VER}.root.xz" "lisa_${VER}.efi" "lisa-usb-${VER}.raw.zst" \
            "lisa-apps_${VER}.tar.zst" \
            "lisa-runtime_${VER}_x86_64.tar.zst" \
            "lisa-zen_${VER}_x86_64.tar.zst" "lisa-zen_${VER}_aarch64.tar.zst" > SHA256SUMS
          cat SHA256SUMS; ls -lh lisa_* lisa-usb-* lisa-zen_*
      # The A/B gate, on the artifact devices actually receive (issue #47).
      # Until now the ab-* jobs only ever ran against the NIGHTLY image,
      # while release.yml builds a materially different one (the lisa-*
      # split packages, llama.cpp, zen-browser, the forked
      # gnome-control-center, lisa-audio-cs8409) and checked only "no boot,
      # no release". A packaging difference that breaks staging — issue
      # #45's failure class, which reached a real device — passed every
      # gate. Same scenario, same code, this artifact.
      #
      # ORDERING IS LOAD-BEARING, twice:
      #  * AFTER the extract step, because the scenario is destructive: it
      #    rewrites the ESP, relabels partition 3 and lets the guest write
      #    a root image over it. Every published artifact has already been
      #    derived from the pristine image by this point, so nothing
      #    downstream reads lisa-usb.raw again.
      #  * BEFORE `gh release create`, because that is the whole point — a
      #    staging failure must fail the release instead of reaching
      #    devices.
      # Do not move it, and do not add a step between here and Publish that
      # reads lisa-usb.raw.
      #
      # v1 is the real release version (YYYYMMDD.run), not the nightly's
      # "1": it is what mkosi baked into IMAGE_VERSION, what the root_@v
      # slot label carries, and what ProtectVersion=%A resolves to. The
      # scenario stages .run+1 and offers .run+2 — the shape consecutive
      # releases actually take.
      - name: A/B sysupdate gate on the release image
        uses: ./.github/actions/ab-sysupdate
        with:
          image: lisa-usb.raw
          version: ${{ steps.ver.outputs.ver }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          cat > notes.md <<EOF
          Lisa OS image ${VER} (pre-alpha, runs-from-USB — not an installer).

          **Boot it:** decompress \`lisa-usb-${VER}.raw.zst\` (zstd -d), write to a
          32 GB+ USB stick (\`dd\` / Etcher — the 19 GiB A/B layout outgrew 16 GB
          sticks when the desktop landed), boot an Intel Mac holding ⌥ Option →
          "EFI Boot". Boots into a GNOME session: assistant overlay
          (Super+Space), semantic launcher, Ledger app preinstalled; Wi-Fi and
          ethernet via the GNOME network UI (NetworkManager on iwd).
          PROVISIONAL field-test login: user \`lisa\`, password \`lisa\`, GDM
          autologin (dev image — no secrets on the stick). Includes
          lisa-inferenced (append-only ledger, stub engine by default) and the
          \`lisa\` CLI.

          **Self-update:** installed systems track this repo's releases —
          \`lisa update\` (or \`systemd-sysupdate update\`) pulls the newest
          release's \`lisa_@v.root.xz\` + \`lisa_@v.efi\` into the inactive A/B
          slot; reboot lands in it, boot-counting rolls back automatically if it
          fails. \`lisa_${VER}.root.xz\`, \`lisa_${VER}.efi\`, and \`SHA256SUMS\`
          are that machinery — humans want the \`.raw.zst\`.

          **Apps channel:** \`lisa-apps_${VER}.tar.zst\` (shell surfaces) and
          \`lisa-zen_${VER}_x86_64.tar.zst\` / \`lisa-zen_${VER}_aarch64.tar.zst\`
          (Zen browser) update independently of the image — \`lisa apps update\`,
          no reboot (ADR-0020, ADR-0023). The browser is moving out of the image
          onto this channel: this release still bakes \`/opt/zen\` as a floor
          while devices pick up the resolver and the pre-fetch, and
          \`lisa-apps-sync.timer\` pulls the payload to \`/var\` once online.
          EOF
          gh release create "v${VER}" \
            --title "Lisa OS ${VER}" \
            --notes-file notes.md \
            "lisa-usb-${VER}.raw.zst" \
            "lisa_${VER}.root.xz" \
            "lisa_${VER}.efi" \
            "lisa-apps_${VER}.tar.zst" \
            "lisa-runtime_${VER}_x86_64.tar.zst" \
            "lisa-zen_${VER}_x86_64.tar.zst" \
            "lisa-zen_${VER}_aarch64.tar.zst" \
            SHA256SUMS
          # The packages the image was built FROM, for the [lisa] index
          # (ADR-0039, lisa-os#171): lisa-packages' publish workflow is
          # dispatched with `lisa-os=v${VER}` and repo-adds exactly these.
          # Same binaries, second delivery path — never a separate build.
          # Debug split-packages stay out: symbols are index noise.
          ls repo-out/*.pkg.tar.zst | grep -v -- '-debug-' \
            | xargs gh release upload "v${VER}"
