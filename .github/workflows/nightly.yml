# Nightly image pipeline (PLAN §6). Builds the Track I image and
# boot-checks it in QEMU. Runs inside a real Arch container (rootful
# podman, privileged) so mkosi uses Arch's own pacman — the default
# Debian tools tree on Ubuntu runners ships a pacman without its cache
# dir. swtpm + the A/B sysupdate rollback demo complete the M0 gate.
# ab-sysupdate runs the three-version issue #20 scenario (booted-oldest
# protection via ProtectVersion=%A), not just the happy empty-slot path.

name: nightly-image

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Expose /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "no KVM; QEMU will fall back to TCG"; fi
      - name: Build image in Arch container
        run: |
          sudo podman run --rm --privileged \
            -v "$PWD":/src -w /src docker.io/library/archlinux:latest bash -ec '
              # pacman >= 7 sandbox cannot apply inside the container
              sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              pacman -Syu --noconfirm mkosi
              mkosi --directory os/mkosi summary
              mkosi --directory os/mkosi build
            '
          # Outputs were written by root inside the container.
          sudo chown -R "$USER:" os/mkosi
      # Boot on the runner host with plain QEMU (mkosi qemu needs a
      # systemd host, which the container is not). Direct kernel boot to
      # poweroff.target: reaching poweroff exits QEMU cleanly; a hang is
      # caught by the timeout; "Welcome to" proves systemd came up from
      # the image's own initrd + root.
      - name: Initrd must carry the bare-metal storage/HID stack
        run: |
          # v26-v29 shipped initrds with ZERO storage modules (issue #46:
          # the KernelModulesInitrdInclude spelling never applied): USB
          # sticks could load the UKI via firmware and then Linux couldn't
          # see the stick — every USB boot dead. Never again. The check
          # decompresses EVERY zstd frame — mkosi appends the kernel-
          # modules initrd as separate frames, so a first-frame-only look
          # cannot see them (or their absence) reliably. The UKI is the
          # authoritative artifact; fall back to lisa.initrd if extraction
          # fails.
          sudo apt-get install -qq -y --no-install-recommends mtools fdisk jq binutils zstd >/dev/null
          OFF=$(( $(sfdisk -J lisa.raw 2>/dev/null | jq -r '.partitiontable.partitions[0].start' || echo 0) * 512 ))
          if [ "$OFF" -gt 0 ]; then
            NAME=$(mdir -b -i "lisa.raw@@$OFF" ::/EFI/Linux/ | grep -o 'lisa[-_][^/]*\.efi' | grep -v rescue | head -1 || true)
            if [ -n "$NAME" ]; then
              mcopy -i "lisa.raw@@$OFF" "::/EFI/Linux/$NAME" uki.efi
              objcopy --dump-section .initrd=initrd.img uki.efi discard.efi || true
            fi
          fi
          [ -f initrd.img ] || cp os/mkosi/lisa.initrd initrd.img
          python3 - <<'PY'
          import subprocess, sys
          d = open('initrd.img','rb').read()
          offs = [i for i in range(len(d)) if d[i:i+4] == b'\x28\xb5\x2f\xfd'] or [0]
          blob = b''
          for off in offs:
              blob += subprocess.run(['zstd','-dc'], input=d[off:], capture_output=True).stdout
          blob += d  # uncompressed cpio segments too
          missing = [m for m in (b'usb-storage.ko', b'uas.ko', b'sd_mod.ko',
                                 b'xhci-pci.ko', b'ahci.ko', b'nvme.ko', b'btrfs.ko')
                     if m not in blob]
          if missing:
              print('FAIL: initrd missing modules:', [m.decode() for m in missing])
              sys.exit(1)
          print('initrd storage/HID stack: OK')
          PY
          rm -f initrd.img uki.efi discard.efi
      - name: "Image must ship the whole sysupdate pull stack (issue #45)"
        run: |
          # `lisa update` is only as good as what the image can execute.
          # systemd-pull dlopen()s libcurl.so.4 and reports ANY dlopen
          # failure as EOPNOTSUPP — the field iMac's
          # "Failed to allocate puller: Operation not supported". Arch lists
          # libcurl as an *optional* systemd dependency, so nothing in the
          # package graph guarantees the update path can download; today it
          # only arrives because networkmanager pulls curl. Assert the
          # binaries, the library, the CA bundle and the guarded transfer
          # configs on the built image, so a dependency reshuffle upstream
          # breaks CI instead of the field.
          LOOP=$(sudo losetup -P --show -f os/mkosi/lisa.raw)
          mkdir -p mnt-pull
          sudo mount -o ro "${LOOP}p2" mnt-pull
          fail=0
          for b in usr/lib/systemd/systemd-pull usr/lib/systemd/systemd-sysupdate; do
            [ -x "mnt-pull/$b" ] || { echo "FAIL: /$b missing from the image"; fail=1; }
          done
          ls mnt-pull/usr/lib/libcurl.so.4* >/dev/null 2>&1 || {
            echo "FAIL: libcurl.so.4 missing — systemd-pull cannot allocate a puller"; fail=1; }
          [ -s mnt-pull/etc/ssl/certs/ca-certificates.crt ] ||
            [ -s mnt-pull/etc/ca-certificates/extracted/tls-ca-bundle.pem ] || {
              echo "FAIL: no CA bundle — the HTTPS release channel cannot be verified"; fail=1; }
          shopt -s nullglob
          transfers=(mnt-pull/usr/lib/sysupdate.d/*.transfer)
          [ "${#transfers[@]}" -gt 0 ] || { echo "FAIL: image ships no sysupdate transfers"; fail=1; }
          for t in "${transfers[@]}"; do
            # Issue #20: without this, vacuuming can erase the booted slot.
            grep -q '^ProtectVersion=' "$t" || { echo "FAIL: $t lacks ProtectVersion="; fail=1; }
          done
          sudo umount mnt-pull
          sudo losetup -d "$LOOP"
          [ "$fail" -eq 0 ] || exit 1
          echo "sysupdate pull stack: OK"
      - name: Boot check (QEMU + swtpm)
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends qemu-system-x86 swtpm >/dev/null
          # Software TPM 2.0, as the e2e harness prescribes (PLAN §11) —
          # TPM-backed disk encryption (systemd-cryptenroll) builds on this.
          mkdir -p tpmstate
          swtpm socket --tpmstate dir=tpmstate \
            --ctrl type=unixio,path=tpm.sock --tpm2 --daemon
          timeout 600 qemu-system-x86_64 \
            -machine q35 -accel kvm -accel tcg -m 4G -nographic -no-reboot \
            -chardev socket,id=chrtpm,path=tpm.sock \
            -tpmdev emulator,id=tpm0,chardev=chrtpm \
            -device tpm-tis,tpmdev=tpm0 \
            -kernel os/mkosi/lisa.vmlinuz -initrd os/mkosi/lisa.initrd \
            -append "root=PARTLABEL=root_1 rw console=ttyS0 systemd.unit=poweroff.target systemd.show_status=1" \
            -drive file=os/mkosi/lisa.raw,format=raw,if=virtio \
            | tee boot-console.log
          grep -q "Welcome to" boot-console.log
          # The guest saw the emulated TPM.
          grep -qi "tpm" boot-console.log
      # NOT installing the rescue entry into the ESP yet (ADR-0022 phase
      # 2, issue #23). Two nightlies proved systemd-boot selects it as the
      # DEFAULT — first with SORT_KEY alone, then again with a
      # `default lisa*.efi` pin in loader.conf — so every UEFI job booted
      # the rescue cmdline and hung waiting for /dev/lisa/newest-good.
      # A boot entry that can capture the default is a device-bricking
      # hazard, and sd-boot's selection rules deserve a dedicated
      # experiment rather than another guess against a 20-minute gate.
      # make-rescue-uki.sh stays in the tree, unused, until that lands.
      - name: Initrd must carry the rescue root resolver
        run: |
          # The resolver is inert without the rescue cmdline, but if it is
          # missing from the initrd entirely the rescue entry can never
          # work — and Boot 3 below would fail for a reason that looks
          # like a resolver bug. Assert presence, not behaviour.
          if ! grep -aq 'newest-good-root' initrd-check.img 2>/dev/null; then
            OFF=$(( $(sfdisk -J os/mkosi/lisa.raw | jq -r '.partitiontable.partitions[0].start') * 512 ))
            NAME=$(mdir -b -i "os/mkosi/lisa.raw@@$OFF" ::/EFI/Linux/ | grep -o 'lisa[-_][^/]*\.efi' | grep -v rescue | head -1)
            mcopy -i "os/mkosi/lisa.raw@@$OFF" "::/EFI/Linux/$NAME" uki2.efi
            objcopy --dump-section .initrd=initrd-check.img uki2.efi d2.efi
          fi
          python3 - <<'PY'
          import subprocess, sys
          d = open('initrd-check.img','rb').read()
          offs = [i for i in range(len(d)) if d[i:i+4] == b'\x28\xb5\x2f\xfd'] or [0]
          blob = b''
          for off in offs:
              blob += subprocess.run(['zstd','-dc'], input=d[off:], capture_output=True).stdout
          blob += d
          if b'newest-good-root.sh' not in blob:
              print('FAIL: initrd has no rescue resolver — mkosi.initrd/mkosi.extra did not apply')
              sys.exit(1)
          print('rescue resolver present in initrd: OK')
          PY
          rm -f initrd-check.img uki2.efi d2.efi
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: lisa-image
          path: os/mkosi/lisa*.raw
          if-no-files-found: warn
          retention-days: 7

  # M0 acceptance (PLAN §10): A/B update + rollback demonstrated. A
  # broken higher-version UKI with +2 try counters is preferred by
  # systemd-boot, fails twice (initrd timeout -> reboot), exhausts its
  # tries, and the good entry boots automatically. Real UEFI via OVMF —
  # this exercises systemd-boot itself, unlike the direct-kernel job.
  ab-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: image
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: lisa-image
      - name: Stage A/B demo UKIs in the ESP (mtools, no rebuild)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            mtools fdisk jq binutils systemd-ukify systemd-boot-efi >/dev/null
          ls -l lisa*.raw
          # ESP = partition 1; mtools addresses it as an offset into the raw.
          OFF=$(( $(sfdisk -J lisa.raw | jq -r '.partitiontable.partitions[0].start') * 512 ))
          ESP="lisa.raw@@$OFF"
          NAME=$(mdir -b -i "$ESP" ::/EFI/Linux/ | grep -o 'lisa-[^/]*\.efi' | grep -v rescue | head -1)
          echo "good UKI: $NAME (ESP offset $OFF)"
          mcopy -i "$ESP" "::/EFI/Linux/$NAME" good.efi
          # The mkosi UKI carries no .cmdline section, so rebuild demo
          # variants properly with ukify from its kernel + initrd.
          objcopy --dump-section .linux=vmlinuz --dump-section .initrd=initrd.img good.efi discard.efi
          UKIFY=$(command -v ukify || echo /usr/lib/systemd/ukify)
          # Good entry: serial console + clean poweroff so QEMU exits on
          # success. No try counters = permanently valid entry.
          "$UKIFY" build --linux=vmlinuz --initrd=initrd.img \
            --cmdline='root=/dev/vda2 rw console=ttyS0 lisa_demo=good systemd.unit=poweroff.target systemd.gpt_auto=no' \
            --output=good-demo.efi
          # Bad entry: version 99 outranks the good entry. It boots but
          # immediately reboots (systemd.unit=reboot.target) without ever
          # reaching boot-complete — a deterministic failed boot that
          # burns a try per cycle. (A broken-root variant drops to an
          # emergency shell and hangs instead of rebooting.)
          "$UKIFY" build --linux=vmlinuz --initrd=initrd.img \
            --cmdline='root=/dev/vda2 rw console=ttyS0 lisa_demo=bad systemd.unit=reboot.target systemd.gpt_auto=no' \
            --output=bad-demo.efi
          mcopy -o -i "$ESP" good-demo.efi "::/EFI/Linux/$NAME"
          mcopy -i "$ESP" bad-demo.efi "::/EFI/Linux/lisa-99+2.efi"
          mdir -i "$ESP" ::/EFI/Linux/
          echo "ESP=$ESP" >>"$GITHUB_ENV"
      - name: Boot-counting rollback demo (UEFI QEMU)
        run: |
          set -o pipefail
          sudo apt-get install -qq -y --no-install-recommends qemu-system-x86 ovmf >/dev/null
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          # No -no-reboot: the failed tries MUST reboot for the counters
          # to decrement. Success = good entry powers off -> QEMU exits.
          timeout 900 qemu-system-x86_64 \
            -machine q35 -accel kvm -accel tcg -m 4G -nographic \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=lisa.raw,format=raw,if=virtio \
            | tee console.log
          echo "--- assertions"
          # Two failed tries (bad entry reboots), then the good entry
          # powers off — in that order.
          RESTARTS=$(grep -c "reboot: Restarting system" console.log)
          [ "$RESTARTS" -eq 2 ]
          grep -q "reboot: Power down" console.log
          LAST_RESTART=$(grep -n "reboot: Restarting system" console.log | tail -1 | cut -d: -f1)
          POWEROFF=$(grep -n "reboot: Power down" console.log | tail -1 | cut -d: -f1)
          [ "$LAST_RESTART" -lt "$POWEROFF" ]
          grep -q "Welcome to" console.log
          # The smoking gun: systemd-boot renamed the bad entry's try
          # counters to +0-2 (two tries used, none left) in the ESP.
          mdir -b -i "$ESP" ::/EFI/Linux/ | tee esp-after.txt
          grep -q 'lisa-99+0-2.efi' esp-after.txt
          echo "ROLLBACK DEMO: PASS (2 failed tries, counters exhausted to +0-2, good entry booted and powered off)"

  # M0 acceptance (PLAN §10, ADR-0001) + issue #20 regression: the update
  # half of A/B, in the THREE-version shape that erased the field iMac's
  # running root (booted .22 = oldest, .25 staged in the other slot, .26
  # available, InstancesMax=2). Mechanism, verified against systemd main
  # (src/sysupdate/sysupdate-transfer.c, transfer_vacuum()) and
  # sysupdate.d(5): sysupdate installs into an `_empty`-labeled slot; if
  # none exists it vacuums down to InstancesMax-1 by evicting the OLDEST
  # installed version — it never checks which partition backs `/` (its
  # resource code only uses /usr's backing device to LOCATE the disk).
  # The only guard is opt-in: ProtectVersion= (sysupdate.d(5), since
  # v251) — "Protected versions are never removed while making room for
  # new, updated versions ... to ensure that the currently booted OS
  # version ... is not replaced/overwritten during updates" — where %A
  # expands to the running os-release IMAGE_VERSION. So the incident is
  # documented-but-surprising behavior our config triggered (no
  # ProtectVersion= in the transfer definitions), not an upstream bug
  # (cf. systemd/systemd#33339, the adjacent incomplete-version case) and
  # not the v22 device's root=PARTLABEL/fstab state, which sysupdate
  # never consults. The shipped transfers now carry ProtectVersion=%A;
  # this job proves it in the incident's shape: boot v1 (the OLDEST) with
  # v2 staged in slot B and v3 on the server, assert v3 installs OVER v2,
  # v1's partition survives untouched (PARTLABEL + fs UUID + canary
  # hash), and the reboot lands in v3. The old two-version flow never
  # covered this: with one slot still _empty, vacuum has nothing to
  # evict, so the erase path was unreachable.
  ab-sysupdate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: image
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: lisa-image
      - name: Plant sysupdate config + demo scripts (loop mounts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            fdisk jq binutils systemd-ukify systemd-boot-efi xz-utils \
            btrfs-progs mtools >/dev/null
          LOOP=$(sudo losetup -P --show -f lisa.raw)
          mkdir -p mnt-root mnt-esp
          sudo mount "${LOOP}p2" mnt-root
          sudo mount "${LOOP}p1" mnt-esp

          # ProtectVersion=%A anchors on the running os-release
          # IMAGE_VERSION. The nightly image bakes ImageVersion=1
          # (mkosi.conf) — exactly the demo's v1, so the demo exercises
          # the real protection path. Assert the anchor before relying
          # on it.
          grep -Eqx 'IMAGE_VERSION="?1"?' mnt-root/usr/lib/os-release

          # sysupdate transfers: root partition images by slot label,
          # UKIs by ESP filename. Verify=no: the M1 hosted repo signs.
          sudo mkdir -p mnt-root/etc/sysupdate.d mnt-root/efi
          # HERMETIC: mask the image's baked production channel
          # (/usr/lib/sysupdate.d → releases/latest). Without this, sysupdate
          # merges both sources and picks the highest version — the PUBLISHED
          # release (e.g. 20260724.25) beats the local demo's "2", so the
          # test silently updated slot B to the real GitHub release instead
          # of the build under test (the root cause of the ab-sysupdate
          # failures since v25 shipped: v2 was always v25's old /var-UUID
          # fstab, never this build). Same-name /etc symlinks to /dev/null
          # override /usr/lib per unit-file semantics.
          for f in mnt-root/usr/lib/sysupdate.d/*; do
            sudo ln -sf /dev/null "mnt-root/etc/sysupdate.d/$(basename "$f")"
          done
          sudo tee mnt-root/etc/sysupdate.d/50-root.conf >/dev/null <<'EOF'
          [Transfer]
          Verify=no
          # Issue #20: sysupdate has NO built-in guard for the partition
          # backing /. Vacuuming for InstancesMax evicts the OLDEST
          # version — if that is the booted one, the running root is
          # erased mid-session. ProtectVersion= (sysupdate.d(5), since
          # v251) is the documented guard: %A = the running os-release
          # IMAGE_VERSION. Mirrors the shipped 50-root.transfer.
          ProtectVersion=%A
          [Source]
          Type=url-file
          Path=http://10.0.2.2:8000/
          MatchPattern=lisa_@v.root.xz
          [Target]
          Type=partition
          Path=auto
          MatchPattern=root_@v
          MatchPartitionType=root
          InstancesMax=2
          EOF
          sudo tee mnt-root/etc/sysupdate.d/60-uki.conf >/dev/null <<'EOF'
          [Transfer]
          Verify=no
          # Same guard for the boot entry: keep the booted version's UKI
          # while vacuuming (issue #20; mirrors the shipped
          # 60-uki.transfer).
          ProtectVersion=%A
          [Source]
          Type=url-file
          Path=http://10.0.2.2:8000/
          MatchPattern=lisa_@v.efi
          [Target]
          Type=regular-file
          Path=/EFI/Linux
          PathRelativeTo=esp
          MatchPattern=lisa_@v.efi
          InstancesMax=2
          EOF

          # QEMU user-net DHCP so the guest can reach the runner (10.0.2.2).
          sudo tee mnt-root/etc/systemd/network/99-demo-dhcp.network >/dev/null <<'EOF'
          [Match]
          Name=en*
          [Network]
          DHCP=yes
          EOF

          echo 1 | sudo tee mnt-root/etc/lisa-slot-version >/dev/null
          # Canary: 1 MiB of random bytes baked into the v1 root. If the
          # update ever writes to the booted slot again (issue #20), the
          # canary hash — or the fs UUID, or the PARTLABEL — changes;
          # all three are asserted host-side after the run.
          head -c 1M /dev/urandom > canary.bin
          sudo cp canary.bin mnt-root/usr/lib/lisa-canary
          echo "CANARY_SHA=$(sha256sum canary.bin | cut -d' ' -f1)" >>"$GITHUB_ENV"
          # One driver for all slots, branching on the version marker —
          # so every root stays a byte-copy of v1 except the marker and
          # os-release. (systemd.run= is container-only; a real enabled
          # unit is the way to script a VM boot.)
          sudo tee mnt-root/usr/local/bin/lisa-demo.sh >/dev/null <<'EOF'
          #!/bin/bash
          v=$(cat /etc/lisa-slot-version)
          echo "LISA_SLOT_BOOTED=$v" > /dev/console
          if [ "$v" = "1" ]; then
              systemctl start systemd-networkd
              for _ in $(seq 1 60); do (echo > /dev/tcp/10.0.2.2/8000) 2>/dev/null && break; sleep 1; done
              if /usr/lib/systemd/systemd-sysupdate update > /tmp/sysupdate.log 2>&1; then
                  tail -5 /tmp/sysupdate.log > /dev/console
                  echo "LISA_UPDATE_DONE" > /dev/console
                  # Drop the loader.conf pin that forced booting the
                  # OLDEST version (the field state). systemd-boot's
                  # normal highest-filename selection then picks the
                  # freshly installed UKI on reboot. /efi is the ESP,
                  # fstab-mounted (ADR-0018) — sysupdate just staged the
                  # UKI through it.
                  rm -f /efi/loader/loader.conf
                  systemctl reboot
              else
                  tail -10 /tmp/sysupdate.log > /dev/console
                  echo "LISA_UPDATE_FAILED" > /dev/console
                  systemctl poweroff
              fi
          else
              systemctl poweroff
          fi
          EOF
          sudo chmod +x mnt-root/usr/local/bin/lisa-demo.sh
          sudo tee mnt-root/etc/systemd/system/lisa-demo.service >/dev/null <<'EOF'
          [Unit]
          Description=Lisa A/B sysupdate demo driver
          After=multi-user.target
          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/lisa-demo.sh
          EOF
          sudo mkdir -p mnt-root/etc/systemd/system/multi-user.target.wants
          sudo ln -sf ../lisa-demo.service mnt-root/etc/systemd/system/multi-user.target.wants/lisa-demo.service
          # systemd-firstboot prompts interactively on first boot and
          # blocks the console; the demo has no user.
          sudo ln -sf /dev/null mnt-root/etc/systemd/system/systemd-firstboot.service

          # Demo UKIs from the shipped kernel+initrd: v1 boots slot A and
          # runs the update; v2 (staged, must NEVER boot) and v3 (the
          # update) boot slot B.
          NAME=$(ls mnt-esp/EFI/Linux/ | grep '^lisa-.*\.efi$' | head -1)
          objcopy --dump-section .linux=vmlinuz --dump-section .initrd=initrd.img "mnt-esp/EFI/Linux/$NAME" discard.efi
          UKIFY=$(command -v ukify || echo /usr/lib/systemd/ukify)
          "$UKIFY" build --linux=vmlinuz --initrd=initrd.img \
            --cmdline='root=/dev/vda2 rw console=ttyS0 systemd.gpt_auto=no' \
            --output=lisa_1.efi
          "$UKIFY" build --linux=vmlinuz --initrd=initrd.img \
            --cmdline='root=/dev/vda3 rw console=ttyS0 systemd.gpt_auto=no' \
            --output=lisa_2.efi
          "$UKIFY" build --linux=vmlinuz --initrd=initrd.img \
            --cmdline='root=/dev/vda3 rw console=ttyS0 systemd.gpt_auto=no' \
            --output=lisa_3.efi
          sudo rm "mnt-esp/EFI/Linux/$NAME"
          sudo cp lisa_1.efi lisa_2.efi mnt-esp/EFI/Linux/
          # Boot the OLDEST installed version first, like the field
          # device (still running .22 with .25 staged). Without the pin
          # systemd-boot would pick lisa_2.efi (highest filename). The
          # v1 driver removes the pin after the update; boot-order
          # mechanics themselves are ab-rollback's business.
          sudo mkdir -p mnt-esp/loader
          sudo tee mnt-esp/loader/loader.conf >/dev/null <<'EOF'
          default lisa_1.efi
          timeout 0
          EOF

          # Diagnostics for the A/B UUID story (ADR-0018): what identifiers
          # does the built image actually carry? If fs UUIDs repeat across
          # nightly runs, real A/B updates would collide the same way the
          # byte-copy below used to.
          echo "--- baked /etc/fstab:"; sudo cat mnt-root/etc/fstab 2>/dev/null || echo "(no fstab)"
          echo "--- filesystem/partition identifiers:"; sudo blkid | grep "$LOOP" || true

          sudo umount mnt-esp mnt-root

          # Record what must SURVIVE the run: v1's btrfs fs UUID (the
          # canary hash is already in env; the PARTLABEL is read from
          # the table afterwards).
          echo "V1_UUID=$(sudo blkid -s UUID -o value "${LOOP}p2")" >>"$GITHUB_ENV"

          # v2 root = byte-copy of slot A with a bumped version marker,
          # written INTO the _empty B slot so the disk starts FULL —
          # the issue #20 precondition (both slots populated, booted =
          # oldest, next version on the server).
          # A byte-copy carries slot A's btrfs fsid; two same-fsid devices on
          # one disk send the kernel's btrfs device-scan into chaos (the
          # by-uuid device never shows up → emergency mode — exactly what a
          # real cloned-slot update would do). btrfstune -m gives the copy a
          # fresh metadata_uuid/fsid, the supported way to make a clone
          # mountable next to its origin (needs btrfs-progs).
          sudo dd if="${LOOP}p2" of=upd.img bs=4M status=none
          sudo chown "$USER:" upd.img
          sudo btrfstune -f -m upd.img
          echo "--- v2 root identifiers after re-uuid:"; sudo blkid upd.img || true
          mkdir -p mnt-upd
          sudo mount -o loop upd.img mnt-upd
          echo 2 | sudo tee mnt-upd/etc/lisa-slot-version >/dev/null
          # ProtectVersion=%A resolves per-slot: bump the baked
          # IMAGE_VERSION to match the slot's sysupdate version.
          grep -q '^IMAGE_VERSION=' mnt-upd/usr/lib/os-release
          sudo sed -i 's/^IMAGE_VERSION=.*/IMAGE_VERSION=2/' mnt-upd/usr/lib/os-release
          sudo umount mnt-upd
          sudo dd if=upd.img of="${LOOP}p3" bs=4M status=none conv=fsync
          sudo sfdisk --part-label "$LOOP" 3 root_2
          rm upd.img

          # v3 = another byte-copy of the pristine slot A (fresh fsid
          # again, so v1/v2/v3 never collide on one disk), served over
          # HTTP as the available update. Sequential copies keep peak
          # scratch usage to one slot image.
          sudo dd if="${LOOP}p2" of=upd.img bs=4M status=none
          sudo chown "$USER:" upd.img
          sudo btrfstune -f -m upd.img
          echo "--- v3 root identifiers after re-uuid:"; sudo blkid upd.img || true
          sudo mount -o loop upd.img mnt-upd
          echo 3 | sudo tee mnt-upd/etc/lisa-slot-version >/dev/null
          sudo sed -i 's/^IMAGE_VERSION=.*/IMAGE_VERSION=3/' mnt-upd/usr/lib/os-release
          sudo umount mnt-upd
          xz -T0 -1 upd.img
          mkdir -p serve
          mv upd.img.xz serve/lisa_3.root.xz
          cp lisa_3.efi serve/
          # sysupdate enumerates available versions via the SHA256SUMS
          # manifest even with Verify=no (that flag only skips GPG).
          (cd serve && sha256sum lisa_3.root.xz lisa_3.efi > SHA256SUMS)
          sudo losetup -d "$LOOP"
          echo "--- starting labels (expect root_1 + root_2 + _empty gone):"
          sfdisk -J lisa.raw | jq -r '.partitiontable.partitions[].name'
          ls -lh serve/
      - name: Update over the middle slot + reboot into v3 (UEFI QEMU)
        run: |
          set -o pipefail
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm
          sudo apt-get install -qq -y --no-install-recommends qemu-system-x86 ovmf >/dev/null
          (cd serve && python3 -m http.server 8000 >/dev/null 2>&1 &)
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          timeout 900 qemu-system-x86_64 \
            -machine q35 -accel kvm -accel tcg -m 4G -nographic \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=lisa.raw,format=raw,if=virtio \
            | tee console.log
          echo "--- console assertions"
          V1=$(grep -n "LISA_SLOT_BOOTED=1" console.log | head -1 | cut -d: -f1)
          DONE=$(grep -n "LISA_UPDATE_DONE" console.log | head -1 | cut -d: -f1)
          V3=$(grep -n "LISA_SLOT_BOOTED=3" console.log | head -1 | cut -d: -f1)
          [ -n "$V1" ] && [ -n "$DONE" ] && [ -n "$V3" ]
          [ "$V1" -lt "$DONE" ] && [ "$DONE" -lt "$V3" ]
          grep -q "reboot: Power down" console.log
          # v2 is a staging target only — it must never boot. (`!` would
          # be swallowed by bash -e, hence the explicit if.)
          if grep -q "LISA_SLOT_BOOTED=2" console.log; then
            echo "FAIL: the staged middle version booted"; exit 1
          fi
          echo "--- disk assertions"
          # v3 evicted the MIDDLE version's slot (root_2 -> root_3); the
          # booted oldest slot keeps its label. This is the issue #20
          # regression gate: on the field iMac root_1's partition (the
          # running root) was relabeled and overwritten instead.
          sfdisk -J lisa.raw | jq -r '.partitiontable.partitions[].name' | tee labels.txt
          grep -qx "root_1" labels.txt
          grep -qx "root_3" labels.txt
          if grep -qx "root_2" labels.txt; then
            echo "FAIL: middle version still present — the wrong slot was evicted"; exit 1
          fi
          # The booted partition survived: same fs UUID, same version
          # marker, same 1 MiB canary content.
          LOOP=$(sudo losetup -P --show -f lisa.raw)
          [ "$(sudo blkid -s UUID -o value "${LOOP}p2")" = "$V1_UUID" ]
          mkdir -p mnt-check
          sudo mount -o ro "${LOOP}p2" mnt-check
          [ "$(cat mnt-check/etc/lisa-slot-version)" = "1" ]
          [ "$(sudo sha256sum mnt-check/usr/lib/lisa-canary | cut -d' ' -f1)" = "$CANARY_SHA" ]
          sudo umount mnt-check
          # The B slot now carries v3's payload, not v2's.
          sudo mount -o ro "${LOOP}p3" mnt-check
          [ "$(cat mnt-check/etc/lisa-slot-version)" = "3" ]
          sudo umount mnt-check
          sudo losetup -d "$LOOP"
          # ESP: the booted version's UKI is kept (protected), the
          # middle one was vacuumed, v3's was installed.
          OFF=$(( $(sfdisk -J lisa.raw | jq -r '.partitiontable.partitions[0].start') * 512 ))
          mdir -b -i "lisa.raw@@$OFF" ::/EFI/Linux/ | tee esp-after.txt
          grep -q 'lisa_1.efi' esp-after.txt
          grep -q 'lisa_3.efi' esp-after.txt
          if grep -q 'lisa_2.efi' esp-after.txt; then
            echo "FAIL: middle UKI still in ESP — the wrong UKI was vacuumed"; exit 1
          fi
          echo "SYSUPDATE DEMO: PASS (booted-oldest v1 protected, v3 installed over v2, rebooted into v3)"

  # ADR-0022 phase 1 (issue #23): the #20 disk state, reconstructed.
  # Boot 1 (pristine) lets lisa-boot-repair stash the booted UKI on the
  # durable /var partition. Then mtools damage: delete the booted UKI
  # from the ESP and plant a dangling one for a slot that never existed.
  # Boot 2 must self-repair — restore the real UKI from the stash and
  # remove the dangling entry — with the assertions read back from the
  # ESP afterwards. Direct-kernel boots: the repair unit is loader-
  # agnostic, and this keeps the job fast.
  ab-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: image
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: lisa-image
      - name: Expose /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "no KVM; TCG fallback"; fi
      - name: Tools + poweroff unit (loop mount)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            qemu-system-x86 mtools fdisk jq btrfs-progs >/dev/null
          LOOP=$(sudo losetup -P --show -f lisa.raw)
          mkdir -p mnt-root
          sudo mount "${LOOP}p2" mnt-root
          # Deterministic boots: power off right after the repair ran.
          sudo tee mnt-root/usr/lib/systemd/system/lisa-test-poweroff.service >/dev/null <<'UNIT'
          [Unit]
          Description=Power off after boot-repair (ab-recovery test)
          After=lisa-boot-repair.service multi-user.target
          Wants=lisa-boot-repair.service
          [Service]
          Type=oneshot
          ExecStart=/usr/bin/systemctl poweroff
          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo ln -sf ../lisa-test-poweroff.service \
            mnt-root/usr/lib/systemd/system/multi-user.target.wants/lisa-test-poweroff.service
          # The baked sysupdate channel must stay quiet (hermetic test).
          sudo ln -sf /dev/null mnt-root/etc/systemd/system/systemd-sysupdate.timer
          sudo umount mnt-root
          sudo losetup -d "$LOOP"
          # No boot menu concerns: direct kernel. Extract kernel+initrd
          # from the ESP UKI copy? Not needed — the image job's direct-
          # kernel pair is not in the artifact, so pull them from the
          # baked UKI with mtools + objcopy.
          sudo apt-get install -qq -y --no-install-recommends binutils >/dev/null
          OFF=$(( $(sfdisk -J lisa.raw | jq -r '.partitiontable.partitions[0].start') * 512 ))
          ESP="lisa.raw@@$OFF"
          NAME=$(mdir -b -i "$ESP" ::/EFI/Linux/ | grep -o 'lisa[-_][^/]*\.efi' | grep -v rescue | head -1)
          echo "baked UKI: $NAME"
          mcopy -i "$ESP" "::/EFI/Linux/$NAME" baked.efi
          objcopy --dump-section .linux=vmlinuz --dump-section .initrd=initrd.img baked.efi discard.efi
          ls -l vmlinuz initrd.img
          echo "ESP=$ESP" >>"$GITHUB_ENV"
          echo "UKINAME=$NAME" >>"$GITHUB_ENV"
      - name: Boot 1 — pristine, repair stashes the booted UKI
        run: |
          set -o pipefail
          timeout 600 qemu-system-x86_64 \
            -machine q35 -accel kvm -accel tcg -m 3G -nographic -no-reboot \
            -kernel vmlinuz -initrd initrd.img \
            -append "root=PARTLABEL=root_1 rw console=ttyS0 systemd.gpt_auto=no" \
            -drive file=lisa.raw,format=raw,if=virtio \
            | tee boot1.log
          grep -q "Welcome to" boot1.log
          # Unit stdout lands in the journal, not the serial console —
          # assert on STATE: the stash on the var partition.
          LOOP=$(sudo losetup -P --show -f lisa.raw)
          mkdir -p mnt-var
          sudo mount "${LOOP}p4" mnt-var
          ls -l mnt-var/lib/lisa/uki/
          test -f mnt-var/lib/lisa/uki/"$UKINAME" || { echo "FAIL: no stash"; exit 1; }
          sudo umount mnt-var
          sudo losetup -d "$LOOP"
      - name: Damage the ESP (#20 reconstruction)
        run: |
          mdel -i "$ESP" "::/EFI/Linux/$UKINAME"
          # A dangling UKI for a slot that never existed.
          mcopy -i "$ESP" baked.efi "::/EFI/Linux/lisa_19990101.1.efi"
          mdir -i "$ESP" ::/EFI/Linux/
      - name: Boot 2 — self-repair restores + cleans
        run: |
          set -o pipefail
          timeout 600 qemu-system-x86_64 \
            -machine q35 -accel kvm -accel tcg -m 3G -nographic -no-reboot \
            -kernel vmlinuz -initrd initrd.img \
            -append "root=PARTLABEL=root_1 rw console=ttyS0 systemd.gpt_auto=no" \
            -drive file=lisa.raw,format=raw,if=virtio \
            | tee boot2.log
          grep -q "Welcome to" boot2.log
          # State-based assertions (journal is not on the console).
          mdir -b -i "$ESP" ::/EFI/Linux/ | tee esp-final.txt
          grep -q "$UKINAME" esp-final.txt
          if grep -q 'lisa_19990101.1.efi' esp-final.txt; then
            echo "FAIL: dangling UKI survived"; exit 1
          fi
          echo "AB-RECOVERY: PASS (stash -> damage -> restore + cleanup)"
      - name: Boot 3 — the rescue cmdline finds a root with no baked label
        run: |
          set -o pipefail
          # The Lisa Rescue entry carries root=/dev/lisa/newest-good: no
          # baked PARTLABEL at all. The initrd resolver must probe the
          # root slots and mount the newest one that actually works —
          # the hand-edit the field iMac needed three times, automated.
          timeout 600 qemu-system-x86_64 \
            -machine q35 -accel kvm -accel tcg -m 3G -nographic -no-reboot \
            -kernel vmlinuz -initrd initrd.img \
            -append "root=/dev/lisa/newest-good rw console=ttyS0 systemd.gpt_auto=no" \
            -drive file=lisa.raw,format=raw,if=virtio \
            | tee boot3.log
          grep -q "lisa-rescue: booting newest mountable root" boot3.log
          grep -q "Welcome to" boot3.log
          echo "AB-RECOVERY RESCUE: PASS (no baked root label; resolver found a good slot)"
