# Nightly image pipeline (PLAN §6). Builds the Track I image and
# boot-checks it in QEMU. Runs inside a real Arch container (rootful
# podman, privileged) so mkosi uses Arch's own pacman — the default
# Debian tools tree on Ubuntu runners ships a pacman without its cache
# dir. swtpm + the A/B sysupdate rollback demo complete the M0 gate.
# ab-sysupdate runs the three-version issue #20 scenario (booted-oldest
# protection via ProtectVersion=%A), not just the happy empty-slot path.
# That scenario now lives in .github/actions/ab-sysupdate and is shared
# with release.yml, so the image devices actually receive goes through
# the same gate (issue #47) — edit it there, not here.

name: nightly-image

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Expose /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "no KVM; QEMU will fall back to TCG"; fi
      - name: Build image in Arch container
        run: |
          sudo podman run --rm --privileged \
            -v "$PWD":/src -w /src docker.io/library/archlinux:latest bash -ec '
              # pacman >= 7 sandbox cannot apply inside the container
              sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              pacman -Syu --noconfirm mkosi
              mkosi --directory os/mkosi summary
              mkosi --directory os/mkosi build
            '
          # Outputs were written by root inside the container.
          sudo chown -R "$USER:" os/mkosi
      # Boot on the runner host with plain QEMU (mkosi qemu needs a
      # systemd host, which the container is not). Direct kernel boot to
      # poweroff.target: reaching poweroff exits QEMU cleanly; a hang is
      # caught by the timeout; "Welcome to" proves systemd came up from
      # the image's own initrd + root.
      - name: Initrd must carry the bare-metal storage/HID stack
        run: |
          # v26-v29 shipped initrds with ZERO storage modules (issue #46:
          # the KernelModulesInitrdInclude spelling never applied): USB
          # sticks could load the UKI via firmware and then Linux couldn't
          # see the stick — every USB boot dead. Never again. The check
          # decompresses EVERY zstd frame — mkosi appends the kernel-
          # modules initrd as separate frames, so a first-frame-only look
          # cannot see them (or their absence) reliably. The UKI is the
          # authoritative artifact; fall back to lisa.initrd if extraction
          # fails.
          sudo apt-get install -qq -y --no-install-recommends mtools fdisk jq binutils zstd >/dev/null
          OFF=$(( $(sfdisk -J lisa.raw 2>/dev/null | jq -r '.partitiontable.partitions[0].start' || echo 0) * 512 ))
          if [ "$OFF" -gt 0 ]; then
            NAME=$(mdir -b -i "lisa.raw@@$OFF" ::/EFI/Linux/ | grep -o 'lisa[-_][^/]*\.efi' | grep -v rescue | head -1 || true)
            if [ -n "$NAME" ]; then
              mcopy -i "lisa.raw@@$OFF" "::/EFI/Linux/$NAME" uki.efi
              objcopy --dump-section .initrd=initrd.img uki.efi discard.efi || true
            fi
          fi
          [ -f initrd.img ] || cp os/mkosi/lisa.initrd initrd.img
          python3 - <<'PY'
          import subprocess, sys
          d = open('initrd.img','rb').read()
          offs = [i for i in range(len(d)) if d[i:i+4] == b'\x28\xb5\x2f\xfd'] or [0]
          blob = b''
          for off in offs:
              blob += subprocess.run(['zstd','-dc'], input=d[off:], capture_output=True).stdout
          blob += d  # uncompressed cpio segments too
          missing = [m for m in (b'usb-storage.ko', b'uas.ko', b'sd_mod.ko',
                                 b'xhci-pci.ko', b'ahci.ko', b'nvme.ko', b'btrfs.ko')
                     if m not in blob]
          if missing:
              print('FAIL: initrd missing modules:', [m.decode() for m in missing])
              sys.exit(1)
          print('initrd storage/HID stack: OK')
          PY
          rm -f initrd.img uki.efi discard.efi
      - name: Initrd must carry the display stack (amdgpu + its firmware)
        run: |
          # ADR-0025. The splash is only as good as the DRM device the
          # initrd can bind: ADR-0017 listed `simpledrm`, which is BUILT IN
          # on Arch (modules.builtin) and therefore matched no .ko at all —
          # the field iMac18,2 booted black from the Apple logo to GDM.
          # The fix is Ubuntu's: the native driver AND its firmware in the
          # initrd. Both halves are asserted here, because either one
          # missing gives the same black screen: amdgpu.ko without
          # amdgpu/polaris11_* firmware cannot bring up the Radeon Pro 560,
          # and mkosi's automatic firmware-dependency resolution is the
          # kind of implicit behaviour that breaks silently on an upgrade
          # (cf. issue #46). Extraction mirrors the storage/HID step: every
          # zstd frame, because the kernel-modules initrd is appended as
          # separate frames.
          sudo apt-get install -qq -y --no-install-recommends mtools fdisk jq binutils zstd >/dev/null
          RAW=""
          for c in os/mkosi/lisa.raw lisa.raw; do [ -f "$c" ] && RAW="$c" && break; done
          if [ -n "$RAW" ]; then
            OFF=$(( $(sfdisk -J "$RAW" | jq -r '.partitiontable.partitions[0].start') * 512 ))
            NAME=$(mdir -b -i "$RAW@@$OFF" ::/EFI/Linux/ | grep -o 'lisa[-_][^/]*\.efi' | grep -v rescue | head -1 || true)
            if [ -n "$NAME" ]; then
              mcopy -i "$RAW@@$OFF" "::/EFI/Linux/$NAME" uki-drm.efi
              objcopy --dump-section .initrd=initrd-drm.img uki-drm.efi discard-drm.efi || true
            fi
          fi
          [ -f initrd-drm.img ] || cp os/mkosi/lisa.initrd initrd-drm.img
          python3 - <<'PY'
          import subprocess, sys
          d = open('initrd-drm.img','rb').read()
          offs = [i for i in range(len(d)) if d[i:i+4] == b'\x28\xb5\x2f\xfd'] or [0]
          blob = b''
          for off in offs:
              blob += subprocess.run(['zstd','-dc'], input=d[off:], capture_output=True).stdout
          blob += d  # uncompressed cpio segments too
          # Modules: the driver plus two of the helpers modinfo lists in its
          # depends= — proof that mkosi resolved dependencies, not just the
          # one name we spelled out.
          missing = [m for m in (b'amdgpu.ko', b'ttm.ko', b'gpu-sched.ko') if m not in blob]
          # Firmware: the blobs Polaris11/Baffin (Radeon Pro 560) actually
          # loads. Matches the .zst-suffixed names too.
          missing += [f for f in (b'polaris11_smc.bin', b'polaris11_pfp.bin',
                                  b'polaris11_mec.bin', b'polaris11_sdma.bin')
                      if f not in blob]
          if missing:
              print('FAIL: initrd missing display stack:', [m.decode() for m in missing])
              print('      amdgpu + amdgpu/polaris11_* must be in the initrd or the')
              print('      iMac boots black from the Apple logo to GDM (ADR-0025).')
              sys.exit(1)
          print('initrd display stack (amdgpu + polaris11 firmware): OK')
          PY
          # Issue #45: without this flag Plymouth sees console=ttyS0,
          # decides the machine is headless and builds NO renderer at all
          # (`renderer type: 4294967295`). The splash is then absent on
          # every real machine while CI, which reads that same serial
          # console, stays perfectly green.
          # A check that inspected nothing has not passed: if the UKI was
          # never extracted above, say so rather than silently succeed.
          [ -f uki-drm.efi ] || { echo "FAIL: no UKI to check the cmdline of"; exit 1; }
          objcopy --dump-section .cmdline=cmdline.txt uki-drm.efi /dev/null 2>/dev/null
          tr -d '\0' < cmdline.txt | grep -q 'plymouth.ignore-serial-consoles' || {
            echo "FAIL: UKI cmdline lacks plymouth.ignore-serial-consoles"
            echo "      Plymouth finds console=ttyS0, decides the machine is"
            echo "      headless and builds NO renderer — no splash on any"
            echo "      real machine, while CI stays green (issue #45)."
            echo "      cmdline was: $(tr -d '\0' < cmdline.txt)"
            exit 1
          }
          echo 'cmdline carries plymouth.ignore-serial-consoles: OK'
          python3 - <<'PY'
          import sys
          PY
          rm -f initrd-drm.img uki-drm.efi discard-drm.efi
      - name: Initrd must carry the Lisa initrd overlay
        run: |
          # Issue #50 / ADR-0028. `os/mkosi/mkosi.initrd/` looked like a
          # mkosi convention and was one in nobody's version of mkosi: the
          # default initrd is an internal sub-image configured only from
          # mkosi's bundled resources, so BOTH halves of that directory —
          # its Packages= and its mkosi.extra/ tree — were read by nothing.
          # ADR-0017's plymouthd.conf and ADR-0022's rescue root resolver
          # therefore never shipped, silently, for weeks. The overlay now
          # rides in as its own cpio through $ARTIFACTDIR/io.mkosi.initrd
          # (os/mkosi/mkosi.finalize) and plymouth through
          # InitrdProfiles=. Assert the payload inside the UKI so a
          # mechanism that stops working can never look like one that
          # works. Paths AND file bodies are checked: a cpio member name
          # proves the entry landed, a distinctive string from the file
          # proves its contents came with it. Extraction mirrors the
          # storage/HID and display steps — every zstd frame, because the
          # initrd is a concatenation of independently compressed
          # archives, plus the raw bytes for our uncompressed one.
          sudo apt-get install -qq -y --no-install-recommends mtools fdisk jq binutils zstd >/dev/null
          RAW=""
          for c in os/mkosi/lisa.raw lisa.raw; do [ -f "$c" ] && RAW="$c" && break; done
          if [ -n "$RAW" ]; then
            OFF=$(( $(sfdisk -J "$RAW" | jq -r '.partitiontable.partitions[0].start') * 512 ))
            NAME=$(mdir -b -i "$RAW@@$OFF" ::/EFI/Linux/ | grep -o 'lisa[-_][^/]*\.efi' | grep -v rescue | head -1 || true)
            if [ -n "$NAME" ]; then
              mcopy -i "$RAW@@$OFF" "::/EFI/Linux/$NAME" uki-ovl.efi
              objcopy --dump-section .initrd=initrd-ovl.img uki-ovl.efi discard-ovl.efi || true
            fi
          fi
          [ -f initrd-ovl.img ] || cp os/mkosi/lisa.initrd initrd-ovl.img
          python3 - <<'PY'
          import subprocess, sys
          d = open('initrd-ovl.img','rb').read()
          offs = [i for i in range(len(d)) if d[i:i+4] == b'\x28\xb5\x2f\xfd'] or [0]
          blob = b''
          for off in offs:
              blob += subprocess.run(['zstd','-dc'], input=d[off:], capture_output=True).stdout
          blob += d  # uncompressed cpio segments too — the overlay is one
          checks = [
              # ADR-0022 phase 2: the rescue root resolver and its unit.
              (b'usr/lib/lisa/newest-good-root.sh', 'rescue resolver script'),
              (b'lisa-rescue: no mountable root slot found', 'rescue resolver body'),
              (b'usr/lib/systemd/system/lisa-newest-good-root.service', 'rescue resolver unit'),
              (b'initrd-root-device.target.wants/lisa-newest-good-root.service',
               'rescue resolver unit enablement'),
              # ADR-0017 / issue #45: the splash is Arch's stock `bgrt`
              # theme with OUR logo, not a bespoke theme.
              #
              # A hand-made theme was tried and is why this check changed:
              # it had 26 files where stock `spinner` has 74, so it loaded,
              # FAILED, and Plymouth silently fell back to bgrt — the
              # machine booted with the Arch logo and nothing anywhere
              # said so. The old assertion passed throughout, because the
              # theme was present; present is not loadable.
              #
              # bgrt draws ImageDir=.../spinner, so replacing that one
              # watermark rebrands the splash with no theme to maintain.
              # The marker file is what proves our overlay landed —
              # watermark.png itself is always there, from the package.
              (b'themes/spinner/.lisa-branded', 'Lisa watermark overlay'),
              (b'sysinit.target.wants/plymouth-start.service', 'plymouth-start enablement'),
              # …and the daemon those three configure. InitrdProfiles= is
              # the only thing putting it here; without it the overlay
              # would be three configs for a program that is not present.
              (b'plymouthd', 'plymouthd binary (InitrdProfiles=plymouth)'),
              # Issue #16: deterministic by-partlabel on multi-disk machines,
              # which root=PARTLABEL= depends on *in the initrd*.
              (b'usr/lib/udev/lisa-loader-disk', 'boot-disk udev helper'),
              (b'59-lisa-boot-disk.rules', 'boot-disk udev rule'),
              # Issue #138: the display driver must be LOADED in the
              # initrd, not merely shipped in it. The check above asserts
              # amdgpu.ko is present — it always was, and the splash was
              # still lost, because nothing modprobed it before Plymouth
              # picked a DRM device. These three are what make it load
              # first; without any one of them the boot silently goes
              # back to Plymouth on simpledrm.
              (b'usr/lib/modules-load.d/lisa-drm.conf', 'early DRM modules-load config'),
              (b'sysinit.target.wants/systemd-modules-load.service',
               'modules-load enablement in the initrd'),
              (b'plymouth-start.service.d/10-lisa-after-drm.conf',
               'plymouth-after-DRM ordering drop-in'),
          ]
          missing = [what for marker, what in checks if marker not in blob]
          if missing:
              print('FAIL: initrd overlay missing:', missing)
              print('      os/mkosi/initrd-overlay/ is packed into the initrd by')
              print('      os/mkosi/mkosi.finalize via $ARTIFACTDIR/io.mkosi.initrd.')
              print('      If mkosi dropped that mechanism, find the new one — do not')
              print('      delete this check (issue #50, ADR-0028).')
              sys.exit(1)
          print('initrd overlay (rescue resolver + plymouth + udev): OK')
          PY
          rm -f initrd-ovl.img uki-ovl.efi discard-ovl.efi
      - name: "Image must ship the whole sysupdate pull stack (issue #45)"
        run: |
          # `lisa update` is only as good as what the image can execute.
          # systemd-pull dlopen()s libcurl.so.4 and reports ANY dlopen
          # failure as EOPNOTSUPP — the field iMac's
          # "Failed to allocate puller: Operation not supported". Arch lists
          # libcurl as an *optional* systemd dependency, so nothing in the
          # package graph guarantees the update path can download; today it
          # only arrives because networkmanager pulls curl. Assert the
          # binaries, the library, the CA bundle and the guarded transfer
          # configs on the built image, so a dependency reshuffle upstream
          # breaks CI instead of the field.
          LOOP=$(sudo losetup -P --show -f os/mkosi/lisa.raw)
          mkdir -p mnt-pull
          sudo mount -o ro "${LOOP}p2" mnt-pull
          fail=0
          for b in usr/lib/systemd/systemd-pull usr/lib/systemd/systemd-sysupdate; do
            [ -x "mnt-pull/$b" ] || { echo "FAIL: /$b missing from the image"; fail=1; }
          done
          ls mnt-pull/usr/lib/libcurl.so.4* >/dev/null 2>&1 || {
            echo "FAIL: libcurl.so.4 missing — systemd-pull cannot allocate a puller"; fail=1; }
          [ -s mnt-pull/etc/ssl/certs/ca-certificates.crt ] ||
            [ -s mnt-pull/etc/ca-certificates/extracted/tls-ca-bundle.pem ] || {
              echo "FAIL: no CA bundle — the HTTPS release channel cannot be verified"; fail=1; }
          shopt -s nullglob
          transfers=(mnt-pull/usr/lib/sysupdate.d/*.transfer)
          [ "${#transfers[@]}" -gt 0 ] || { echo "FAIL: image ships no sysupdate transfers"; fail=1; }
          for t in "${transfers[@]}"; do
            # Issue #20: without this, vacuuming can erase the booted slot.
            grep -q '^ProtectVersion=' "$t" || { echo "FAIL: $t lacks ProtectVersion="; fail=1; }
          done
          # Services must be ENABLED, not merely installed. Arch's stock
          # presets disable most units and silently override the postinst
          # `systemctl enable` — the reason 00-lisa.preset exists at all.
          # Only the aarch64 job checked this, and it caught
          # lisa-apps-sync.timer shipping disabled on BOTH arches: the
          # safety net that fetches app payloads for a device that was
          # offline when its slot updated (ADR-0023 phase 1). Without it,
          # such a device loses its browser with no way to know why.
          #
          # The invariant is "installed IMPLIES enabled", not "installed":
          # this job builds the MINIMAL image (no NetworkManager, no gdm),
          # where those units are legitimately absent. Asserting presence
          # outright made this step fail on an image that was fine.
          # "Enabled" means a .wants symlink exists in EITHER tree: presets
          # and `systemctl enable` write to /etc, while some packages ship
          # their own under /usr/lib. Checking only /etc reports a working
          # image as broken.
          check_enabled() { # <unit> <target>
            [ -e "mnt-pull/usr/lib/systemd/system/$1" ] || return 0  # not in this flavor
            # -L, not -e: a wants symlink points at the ABSOLUTE path
            # /usr/lib/systemd/system/<unit>, which resolves against the
            # HOST root when the image is loop-mounted here. Every one of
            # them is dangling from outside and perfectly valid inside, so
            # `-e` reported a correctly-enabled image as broken.
            [ -L "mnt-pull/etc/systemd/system/$2.wants/$1" ] && return 0
            [ -L "mnt-pull/usr/lib/systemd/system/$2.wants/$1" ] && return 0
            echo "FAIL: $1 is installed but NOT enabled (no $2.wants symlink in /etc or /usr/lib)"
            echo "      /etc/systemd/system/$2.wants:"
            ls "mnt-pull/etc/systemd/system/$2.wants" 2>/dev/null | sed 's/^/        /' || echo "        (absent)"
            fail=1
          }
          check_enabled lisa-apps-sync.timer timers.target
          check_enabled systemd-sysupdate.timer timers.target
          check_enabled NetworkManager.service multi-user.target
          check_enabled iwd.service multi-user.target
          check_enabled lisa-inferenced.service multi-user.target
          # Issue #142: without this the machine mints a new SSH identity
          # on every A/B update, and each first login afterwards warns
          # REMOTE HOST IDENTIFICATION HAS CHANGED — training the user to
          # click through the one warning that must never be routine.
          check_enabled lisa-identity-persist.service multi-user.target
          # …and the script it runs, since an enabled unit pointing at a
          # missing ExecStart fails at boot instead of at build time.
          [ -x mnt-pull/usr/lib/lisa/persist-identity.sh ] || {
            echo "FAIL: lisa-identity-persist.service is enabled but"
            echo "      /usr/lib/lisa/persist-identity.sh is missing or not executable"
            fail=1
          }
          # Every D-Bus name a daemon TRUSTS must have an activation file
          # on the image, or the trust check silently has nothing to
          # point at. agentd refuses a Modal approval from the peer that
          # requested it and defers to whoever owns dev.lisaos.Consent1;
          # with no activation file that name is unowned, every
          # confirmation lands in the "no surface exists" branch, and the
          # requester answers its own call. Nothing logs a problem —
          # which is exactly how lisa-portal (#153) and this (#145)
          # both shipped absent.
          for svc in dev.lisaos.Consent1 dev.lisaos.Overlay1; do
            [ -f "mnt-pull/usr/share/dbus-1/services/$svc.service" ] || {
              echo "FAIL: no D-Bus activation file for $svc"
              echo "      A trusted name with no owner is not a closed door;"
              echo "      it is a check with nothing behind it."
              fail=1
            }
          done
          # A desktop with Online Accounts and no Secret Service is worse
          # than one without Online Accounts: the account is added, the
          # panel says connected, and every consumer fails with "Failed to
          # retrieve credentials from the keyring". That is what a
          # connected Google account did on the field iMac on 2026-07-30.
          #
          # Implication, not presence — this job also builds the minimal
          # image, where gdm is legitimately absent (same reasoning as
          # check_enabled above).
          if [ -e mnt-pull/usr/bin/gdm ]; then
            [ -x mnt-pull/usr/bin/gnome-keyring-daemon ] || {
              echo "FAIL: the image ships gdm but no Secret Service"
              echo "      (gnome-keyring-daemon). Settings -> Online Accounts"
              echo "      will accept an account it can never hand a token for."
              fail=1
            }
            # Arch's gdm calls this from gdm-password AND gdm-autologin as
            # `optional`, so a missing module fails silently at login and
            # the keyring is simply never unlocked.
            ls mnt-pull/usr/lib/security/pam_gnome_keyring.so >/dev/null 2>&1 || {
              echo "FAIL: pam_gnome_keyring.so missing — PAM references it as"
              echo "      optional, so the login keyring would never unlock."
              fail=1
            }
            # The Mail app reads a Maildir and says so; mbsync is the
            # thing that fills one. A README telling the user to run a
            # syncer that is not on the disk is the same defect as
            # documenting an unbuilt feature.
            [ -x mnt-pull/usr/bin/mbsync ] || {
              echo "FAIL: no mbsync — apps/mail has nothing to read from"
              fail=1
            }
            # mbsync speaks OAuth only through this. Cyrus SASL ships no
            # XOAUTH2 and no OAUTHBEARER, so without it a connected Google
            # account and an installed syncer still cannot authenticate —
            # every other link in the chain present and the mail still not
            # arriving. Only meaningful on the release image, which is
            # where os/packages/ lands.
            if [ -x mnt-pull/usr/bin/mbsync ] &&
               ! ls mnt-pull/usr/lib/sasl2/libxoauth2.so >/dev/null 2>&1; then
              echo "FAIL: mbsync is installed but SASL has no XOAUTH2 mechanism"
              echo "      (os/packages/cyrus-sasl-xoauth2). Gmail cannot be"
              echo "      authenticated with an Online Accounts token."
              fail=1
            fi
          fi
          sudo umount mnt-pull
          sudo losetup -d "$LOOP"
          [ "$fail" -eq 0 ] || exit 1
          echo "sysupdate pull stack: OK"
      - name: Boot check (QEMU + swtpm)
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends qemu-system-x86 swtpm >/dev/null
          # Software TPM 2.0, as the e2e harness prescribes (PLAN §11) —
          # TPM-backed disk encryption (systemd-cryptenroll) builds on this.
          mkdir -p tpmstate
          swtpm socket --tpmstate dir=tpmstate \
            --ctrl type=unixio,path=tpm.sock --tpm2 --daemon
          timeout 600 qemu-system-x86_64 \
            -machine q35 -accel kvm -accel tcg -m 4G -nographic -no-reboot \
            -chardev socket,id=chrtpm,path=tpm.sock \
            -tpmdev emulator,id=tpm0,chardev=chrtpm \
            -device tpm-tis,tpmdev=tpm0 \
            -kernel os/mkosi/lisa.vmlinuz -initrd os/mkosi/lisa.initrd \
            -append "root=PARTLABEL=root_1 rw console=ttyS0 systemd.unit=poweroff.target systemd.show_status=1" \
            -drive file=os/mkosi/lisa.raw,format=raw,if=virtio \
            | tee boot-console.log
          grep -q "Welcome to" boot-console.log
          # The guest saw the emulated TPM.
          grep -qi "tpm" boot-console.log
      # NOT installing the rescue entry into the ESP yet (ADR-0022 phase
      # 2, issue #23). Two nightlies proved systemd-boot selects it as the
      # DEFAULT — first with SORT_KEY alone, then again with a
      # `default lisa*.efi` pin in loader.conf — so every UEFI job booted
      # the rescue cmdline and hung waiting for /dev/lisa/newest-good.
      # A boot entry that can capture the default is a device-bricking
      # hazard, and sd-boot's selection rules deserve a dedicated
      # experiment rather than another guess against a 20-minute gate.
      # make-rescue-uki.sh stays in the tree, unused, until that lands.
      # The RESOLVER half is fixed and asserted above ("Initrd must carry
      # the Lisa initrd overlay", issue #50 / ADR-0028): it reaches the
      # initrd now, where the old mkosi.initrd/mkosi.extra tree never did.
      # The ENTRY is still not installed — that is issue #23's separate
      # sd-boot default-selection problem, not a missing file.
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: lisa-image
          path: os/mkosi/lisa*.raw
          if-no-files-found: warn
          retention-days: 7

  # M0 acceptance (PLAN §10): A/B update + rollback demonstrated. A
  # broken higher-version UKI with +2 try counters is preferred by
  # systemd-boot, fails twice (initrd timeout -> reboot), exhausts its
  # tries, and the good entry boots automatically. Real UEFI via OVMF —
  # this exercises systemd-boot itself, unlike the direct-kernel job.
  ab-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: image
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: lisa-image
      - name: Stage A/B demo UKIs in the ESP (mtools, no rebuild)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            mtools fdisk jq binutils systemd-ukify systemd-boot-efi >/dev/null
          ls -l lisa*.raw
          # ESP = partition 1; mtools addresses it as an offset into the raw.
          OFF=$(( $(sfdisk -J lisa.raw | jq -r '.partitiontable.partitions[0].start') * 512 ))
          ESP="lisa.raw@@$OFF"
          NAME=$(mdir -b -i "$ESP" ::/EFI/Linux/ | grep -o 'lisa-[^/]*\.efi' | grep -v rescue | head -1)
          echo "good UKI: $NAME (ESP offset $OFF)"
          mcopy -i "$ESP" "::/EFI/Linux/$NAME" good.efi
          # The mkosi UKI carries no .cmdline section, so rebuild demo
          # variants properly with ukify from its kernel + initrd.
          objcopy --dump-section .linux=vmlinuz --dump-section .initrd=initrd.img good.efi discard.efi
          UKIFY=$(command -v ukify || echo /usr/lib/systemd/ukify)
          # Good entry: serial console + clean poweroff so QEMU exits on
          # success. No try counters = permanently valid entry.
          "$UKIFY" build --linux=vmlinuz --initrd=initrd.img \
            --cmdline='root=/dev/vda2 rw console=ttyS0 lisa_demo=good systemd.unit=poweroff.target systemd.gpt_auto=no' \
            --output=good-demo.efi
          # Bad entry: version 99 outranks the good entry. It boots but
          # immediately reboots (systemd.unit=reboot.target) without ever
          # reaching boot-complete — a deterministic failed boot that
          # burns a try per cycle. (A broken-root variant drops to an
          # emergency shell and hangs instead of rebooting.)
          "$UKIFY" build --linux=vmlinuz --initrd=initrd.img \
            --cmdline='root=/dev/vda2 rw console=ttyS0 lisa_demo=bad systemd.unit=reboot.target systemd.gpt_auto=no' \
            --output=bad-demo.efi
          mcopy -o -i "$ESP" good-demo.efi "::/EFI/Linux/$NAME"
          mcopy -i "$ESP" bad-demo.efi "::/EFI/Linux/lisa-99+2.efi"
          mdir -i "$ESP" ::/EFI/Linux/
          echo "ESP=$ESP" >>"$GITHUB_ENV"
      - name: Boot-counting rollback demo (UEFI QEMU)
        run: |
          set -o pipefail
          sudo apt-get install -qq -y --no-install-recommends qemu-system-x86 ovmf >/dev/null
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          # No -no-reboot: the failed tries MUST reboot for the counters
          # to decrement. Success = good entry powers off -> QEMU exits.
          timeout 900 qemu-system-x86_64 \
            -machine q35 -accel kvm -accel tcg -m 4G -nographic \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=lisa.raw,format=raw,if=virtio \
            | tee console.log
          echo "--- assertions"
          # Two failed tries (bad entry reboots), then the good entry
          # powers off — in that order.
          # Count the KERNEL-timestamped line only. Plymouth (now genuinely
          # in the initrd, ADR-0028) echoes a second, untimestamped copy of
          # each reboot line to the console, which doubled this count and
          # failed an otherwise-passing rollback.
          RESTARTS=$(grep -cE '\] reboot: Restarting system' console.log)
          [ "$RESTARTS" -eq 2 ]
          grep -q "reboot: Power down" console.log
          LAST_RESTART=$(grep -nE '\] reboot: Restarting system' console.log | tail -1 | cut -d: -f1)
          POWEROFF=$(grep -nE '\] reboot: Power down' console.log | tail -1 | cut -d: -f1)
          [ "$LAST_RESTART" -lt "$POWEROFF" ]
          grep -q "Welcome to" console.log
          # The smoking gun: systemd-boot renamed the bad entry's try
          # counters to +0-2 (two tries used, none left) in the ESP.
          mdir -b -i "$ESP" ::/EFI/Linux/ | tee esp-after.txt
          grep -q 'lisa-99+0-2.efi' esp-after.txt
          echo "ROLLBACK DEMO: PASS (2 failed tries, counters exhausted to +0-2, good entry booted and powered off)"

  # M0 acceptance (PLAN §10, ADR-0001) + issue #20 regression: the update
  # half of A/B, in the THREE-version shape that erased the field iMac's
  # running root. The scenario itself lives in
  # .github/actions/ab-sysupdate — the SINGLE source of truth, shared with
  # release.yml so the artifact devices actually receive goes through the
  # same gate (issue #47). Read that action for the mechanism and the
  # ProtectVersion=%A reasoning; change it there, never here.
  #
  # The nightly image bakes ImageVersion=1 (os/mkosi/mkosi.conf), so v1=1
  # and the scenario derives the staged v2 and the available v3.
  ab-sysupdate:
    runs-on: ubuntu-latest
    # 30 -> 40: the shared action gives a hung guest 1200s (it has to, for
    # the much larger release image), and a job killed by GitHub prints no
    # console log or assertions. Keep the in-step `timeout` the thing that
    # fails first, so failures stay diagnosable.
    timeout-minutes: 40
    needs: image
    steps:
      # Checkout FIRST: actions/checkout cleans the workspace, which would
      # delete a previously downloaded artifact. It is needed at all only
      # because the scenario is a local composite action.
      - uses: actions/checkout@v5
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: lisa-image
      - uses: ./.github/actions/ab-sysupdate
        with:
          image: lisa.raw
          version: "1"

  # ADR-0022 phase 1 (issue #23): the #20 disk state, reconstructed.
  # Boot 1 (pristine) lets lisa-boot-repair stash the booted UKI on the
  # durable /var partition. Then mtools damage: delete the booted UKI
  # from the ESP and plant a dangling one for a slot that never existed.
  # Boot 2 must self-repair — restore the real UKI from the stash and
  # remove the dangling entry — with the assertions read back from the
  # ESP afterwards. Direct-kernel boots: the repair unit is loader-
  # agnostic, and this keeps the job fast.
  ab-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: image
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: lisa-image
      - name: Expose /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "no KVM; TCG fallback"; fi
      - name: Tools + poweroff unit (loop mount)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            qemu-system-x86 mtools fdisk jq btrfs-progs >/dev/null
          LOOP=$(sudo losetup -P --show -f lisa.raw)
          mkdir -p mnt-root
          sudo mount "${LOOP}p2" mnt-root
          # Deterministic boots: power off right after the repair ran.
          sudo tee mnt-root/usr/lib/systemd/system/lisa-test-poweroff.service >/dev/null <<'UNIT'
          [Unit]
          Description=Power off after boot-repair (ab-recovery test)
          After=lisa-boot-repair.service multi-user.target
          Wants=lisa-boot-repair.service
          [Service]
          Type=oneshot
          ExecStart=/usr/bin/systemctl poweroff
          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo ln -sf ../lisa-test-poweroff.service \
            mnt-root/usr/lib/systemd/system/multi-user.target.wants/lisa-test-poweroff.service
          # The baked sysupdate channel must stay quiet (hermetic test).
          sudo ln -sf /dev/null mnt-root/etc/systemd/system/systemd-sysupdate.timer
          sudo umount mnt-root
          sudo losetup -d "$LOOP"
          # No boot menu concerns: direct kernel. Extract kernel+initrd
          # from the ESP UKI copy? Not needed — the image job's direct-
          # kernel pair is not in the artifact, so pull them from the
          # baked UKI with mtools + objcopy.
          sudo apt-get install -qq -y --no-install-recommends binutils >/dev/null
          OFF=$(( $(sfdisk -J lisa.raw | jq -r '.partitiontable.partitions[0].start') * 512 ))
          ESP="lisa.raw@@$OFF"
          NAME=$(mdir -b -i "$ESP" ::/EFI/Linux/ | grep -o 'lisa[-_][^/]*\.efi' | grep -v rescue | head -1)
          echo "baked UKI: $NAME"
          mcopy -i "$ESP" "::/EFI/Linux/$NAME" baked.efi
          objcopy --dump-section .linux=vmlinuz --dump-section .initrd=initrd.img baked.efi discard.efi
          ls -l vmlinuz initrd.img
          echo "ESP=$ESP" >>"$GITHUB_ENV"
          echo "UKINAME=$NAME" >>"$GITHUB_ENV"
      - name: Boot 1 — pristine, repair stashes the booted UKI
        run: |
          set -o pipefail
          timeout 600 qemu-system-x86_64 \
            -machine q35 -accel kvm -accel tcg -m 3G -nographic -no-reboot \
            -kernel vmlinuz -initrd initrd.img \
            -append "root=PARTLABEL=root_1 rw console=ttyS0 systemd.gpt_auto=no" \
            -drive file=lisa.raw,format=raw,if=virtio \
            | tee boot1.log
          grep -q "Welcome to" boot1.log
          # Unit stdout lands in the journal, not the serial console —
          # assert on STATE: the stash on the var partition.
          LOOP=$(sudo losetup -P --show -f lisa.raw)
          mkdir -p mnt-var
          sudo mount "${LOOP}p4" mnt-var
          ls -l mnt-var/lib/lisa/uki/
          test -f mnt-var/lib/lisa/uki/"$UKINAME" || { echo "FAIL: no stash"; exit 1; }
          sudo umount mnt-var
          sudo losetup -d "$LOOP"
      - name: Damage the ESP (#20 reconstruction)
        run: |
          mdel -i "$ESP" "::/EFI/Linux/$UKINAME"
          # A dangling UKI for a slot that never existed.
          mcopy -i "$ESP" baked.efi "::/EFI/Linux/lisa_19990101.1.efi"
          mdir -i "$ESP" ::/EFI/Linux/
      - name: Boot 2 — self-repair restores + cleans
        run: |
          set -o pipefail
          timeout 600 qemu-system-x86_64 \
            -machine q35 -accel kvm -accel tcg -m 3G -nographic -no-reboot \
            -kernel vmlinuz -initrd initrd.img \
            -append "root=PARTLABEL=root_1 rw console=ttyS0 systemd.gpt_auto=no" \
            -drive file=lisa.raw,format=raw,if=virtio \
            | tee boot2.log
          grep -q "Welcome to" boot2.log
          # State-based assertions (journal is not on the console).
          mdir -b -i "$ESP" ::/EFI/Linux/ | tee esp-final.txt
          grep -q "$UKINAME" esp-final.txt
          if grep -q 'lisa_19990101.1.efi' esp-final.txt; then
            echo "FAIL: dangling UKI survived"; exit 1
          fi
          echo "AB-RECOVERY: PASS (stash -> damage -> restore + cleanup)"