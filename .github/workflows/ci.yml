name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Per-job path filtering (ADR-0006): docs-only commits skip the heavy
  # jobs; the layer e2e additionally reacts to os/** changes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      layer: ${{ steps.filter.outputs.layer }}
      shell: ${{ steps.filter.outputs.shell }}
      ime: ${{ steps.filter.outputs.ime }}
      gnome_panel: ${{ steps.filter.outputs.gnome_panel }}
      llama: ${{ steps.filter.outputs.llama }}
      zen: ${{ steps.filter.outputs.zen }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'libs/**'
              - 'daemons/**'
              - 'cli/**'
              - 'models/**'
              - 'tests/e2e/**'
              - '.github/workflows/ci.yml'
            layer:
              - 'os/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'libs/**'
              - 'daemons/**'
              - 'cli/**'
              - 'models/**'
              - 'tests/e2e/**'
              - '.github/workflows/ci.yml'
            shell:
              - 'shell/**'
              - '.github/workflows/ci.yml'
            ime:
              - 'ime/**'
              - '.github/workflows/ci.yml'
            gnome_panel:
              - 'os/packages/gnome-control-center-lisa/**'
              - '.github/workflows/ci.yml'
            llama:
              - 'os/packages/llama.cpp/**'
              - '.github/workflows/ci.yml'
            zen:
              - 'os/packages/zen-browser/**'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # PLAN §5.7 shell surfaces: pure-logic unit tests (overlay envelope,
  # launcher ranking, ledger view-model) — runtime-agnostic modules run
  # under node here, gjs on the image, jsc on macOS dev hosts.
  shell-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    steps:
      - uses: actions/checkout@v5
      - run: |
          for t in shell/*/tests/*.test.js; do
            echo "== $t"
            node "$t"
          done

  # PLAN §5.7.3 layer 2 (ADR-0007): compile the fcitx5 addon against
  # real Fcitx5Core headers in an Arch container and run the protocol
  # unit tests.
  ime-build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ime == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Build addon + run protocol tests in Arch
        run: |
          sudo podman run --rm -v "$PWD":/src docker.io/library/archlinux:latest bash -ec '
            pacman -Sy --noconfirm --needed base-devel cmake fcitx5 >/dev/null
            cmake -S /src/ime/fcitx5-lisa -B /tmp/build
            cmake --build /tmp/build
            cd /tmp/build && ctest --output-on-failure'

  # ADR-0012: build our forked gnome-control-center (stock 50.3 + the
  # native Intelligence panel) with makepkg in an x86 Arch container —
  # the real build gate the arm64 dev-host compile-check cannot be. Heavy
  # (full g-c-c compile), so path-filtered to the package dir. --nocheck
  # skips upstream's xvfb test suite; --skippgpcheck trusts the pinned
  # tag/commit (no keyring in CI).
  gnome-panel-build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.gnome_panel == 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: makepkg gnome-control-center-lisa in Arch
        run: |
          sudo podman run --rm -v "$PWD":/src docker.io/library/archlinux:latest bash -ec '
            # devtools provides arch-meson (used by the PKGBUILD build()).
            pacman -Syu --noconfirm --needed base-devel git devtools >/dev/null
            useradd -m builder
            printf "builder ALL=(ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/builder
            cp -r /src/os/packages/gnome-control-center-lisa /home/builder/pkg
            chown -R builder:builder /home/builder/pkg
            su builder -c "cd ~/pkg && makepkg -s --nocheck --skippgpcheck --noconfirm"
            # Prove the panel landed: our desktop file must be in the package.
            pkg=$(ls /home/builder/pkg/gnome-control-center-[0-9]*.pkg.tar.*)
            echo "built: $pkg"
            pacman -Qlp "$pkg" | grep -q gnome-lisa-panel.desktop \
              && echo "OK: Intelligence panel .desktop present" \
              || { echo "FAIL: panel .desktop missing from package"; exit 1; }'

  # aarch64 twin of gnome-panel-build (ADR-0021, issue #28). The ARM image
  # ships this fork too, so the ARM compile needs a per-PR gate — the
  # aarch64 image lane runs weekly, far too late to catch a PKGBUILD that
  # only builds on x86. Native arm64 runner + the ALARM container, the same
  # pair the image lane uses; ALARM carries stock gnome-control-center
  # 50.3-1, so every dependency of the pinned version resolves there.
  gnome-panel-build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.gnome_panel == 'true'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: makepkg gnome-control-center-lisa in Arch Linux ARM
        run: |
          sudo podman run --rm -v "$PWD":/src docker.io/menci/archlinuxarm:latest bash -ec '
            # pacman >= 7 sandbox cannot apply inside the container.
            sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
            pacman -Syu --noconfirm --needed base-devel git devtools >/dev/null
            useradd -m builder
            printf "builder ALL=(ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/builder
            cp -r /src/os/packages/gnome-control-center-lisa /home/builder/pkg
            chown -R builder:builder /home/builder/pkg
            su builder -c "cd ~/pkg && makepkg -s --nocheck --skippgpcheck --noconfirm"
            pkg=$(ls /home/builder/pkg/gnome-control-center-[0-9]*.pkg.tar.* | grep -v -- -debug- | head -1)
            echo "built: $pkg"
            pacman -Qlp "$pkg" | grep -q gnome-lisa-panel.desktop \
              && echo "OK: Intelligence panel .desktop present (aarch64)" \
              || { echo "FAIL: panel .desktop missing from package"; exit 1; }'

  # PLAN §5.1: build the local inference engine (llama.cpp / llama-server)
  # from source in x86 Arch — it's AUR-only, so this is the build gate.
  # Path-filtered (heavy C++ compile). Asserts the server binary lands.
  llama-build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.llama == 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: makepkg llama.cpp in Arch
        run: |
          sudo podman run --rm -v "$PWD":/src docker.io/library/archlinux:latest bash -ec '
            pacman -Syu --noconfirm --needed base-devel git cmake >/dev/null
            useradd -m builder
            printf "builder ALL=(ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/builder
            cp -r /src/os/packages/llama.cpp /home/builder/pkg
            chown -R builder:builder /home/builder/pkg
            su builder -c "cd ~/pkg && makepkg -s --nocheck --skippgpcheck --noconfirm"
            # makepkg also emits a -debug package; select only the main one.
            pkg=$(ls /home/builder/pkg/llama.cpp-*.pkg.tar.* | grep -v -- -debug- | head -1)
            echo "built: $pkg"
            pacman -Qlp "$pkg" | grep -q usr/bin/llama-server \
              && echo "OK: llama-server present" \
              || { echo "FAIL: llama-server missing from package"; exit 1; }'

  # aarch64 twin of llama-build (ADR-0021, issue #28). The PKGBUILD claims
  # the same cmake invocation works on ARM (GGML_NATIVE=OFF adds no arch
  # flag there); this is the job that has to prove it, per PR, rather than
  # discovering it in the weekly image lane. Also asserts the shipped
  # binary is genuinely aarch64.
  llama-build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.llama == 'true'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: makepkg llama.cpp in Arch Linux ARM
        run: |
          sudo podman run --rm -v "$PWD":/src docker.io/menci/archlinuxarm:latest bash -ec '
            sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
            pacman -Syu --noconfirm --needed base-devel git cmake file >/dev/null
            useradd -m builder
            printf "builder ALL=(ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/builder
            cp -r /src/os/packages/llama.cpp /home/builder/pkg
            chown -R builder:builder /home/builder/pkg
            su builder -c "cd ~/pkg && makepkg -s --nocheck --skippgpcheck --noconfirm"
            pkg=$(ls /home/builder/pkg/llama.cpp-*.pkg.tar.* | grep -v -- -debug- | head -1)
            echo "built: $pkg"
            pacman -Qlp "$pkg" | grep -q usr/bin/llama-server \
              && echo "OK: llama-server present" \
              || { echo "FAIL: llama-server missing from package"; exit 1; }
            bsdtar -xOf "$pkg" usr/bin/llama-server | file - | grep -q "ARM aarch64" \
              && echo "OK: llama-server is an aarch64 binary" \
              || { echo "FAIL: llama-server is not aarch64"; exit 1; }'

  # zen-browser on aarch64 (ADR-0021, issue #28). Cheap but load-bearing:
  # this package is a repackage of an upstream release asset, so what can
  # rot is the PINNED DIGEST, not a compiler. makepkg fails on a sha256
  # mismatch, which is exactly the check we want — an upstream that pulls
  # or re-cuts zen.linux-aarch64.tar.xz breaks the build instead of
  # silently shipping something unverified (CLAUDE.md rule 8). -d: binary
  # repackage, runtime deps are resolved at image-install time.
  zen-build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.zen == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: makepkg zen-browser in Arch Linux ARM
        run: |
          sudo podman run --rm -v "$PWD":/src docker.io/menci/archlinuxarm:latest bash -ec '
            sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
            pacman -Syu --noconfirm --needed base-devel file >/dev/null
            useradd -m builder
            cp -r /src/os/packages/zen-browser /home/builder/pkg
            chown -R builder:builder /home/builder/pkg
            su builder -c "cd ~/pkg && makepkg -d --nocheck --noconfirm"
            pkg=$(ls /home/builder/pkg/zen-browser-*.pkg.tar.* | head -1)
            echo "built: $pkg"
            pacman -Qlp "$pkg" | grep -q opt/zen/zen \
              && echo "OK: zen binary present" \
              || { echo "FAIL: zen binary missing from package"; exit 1; }
            bsdtar -xOf "$pkg" opt/zen/zen | file - | grep -q "ARM aarch64" \
              && echo "OK: zen is an aarch64 binary" \
              || { echo "FAIL: zen is not aarch64"; exit 1; }'

  # PLAN §5.1 acceptance forerunner: unmodified OpenAI Python client
  # against the OpenAI-compat endpoint.
  openai-compat:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p lisa-inferenced
      - name: Start daemon
        run: |
          ./target/debug/lisa-inferenced &
          for _ in $(seq 1 50); do
            curl -sf 127.0.0.1:7777/health >/dev/null && break
            sleep 0.2
          done
      - run: pip install openai
      - run: python tests/e2e/openai_client_test.py

  # PLAN §5.10: egress control is verified, not promised — the daemon
  # serves loopback under its unit sandbox while outbound is blocked.
  egress:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p lisa-inferenced
      - run: bash tests/e2e/egress-test.sh target/debug/lisa-inferenced

  # PLAN §10 M0 acceptance: the Track L layer installs and uninstalls
  # cleanly on vanilla Arch (systemd container; Omarchy VM lands later).
  layer-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changes
    if: needs.changes.outputs.layer == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Start Arch container with systemd
        run: |
          # --privileged: the runner's default seccomp/AppArmor confinement
          # kills dbus-broker's launcher child, crashlooping the system bus
          # and wedging PID1 (throwaway CI container; the image job already
          # runs privileged for the same reason).
          sudo podman run -d --name lisa-e2e --privileged --systemd=always -v "$PWD":/src:ro \
            docker.io/library/archlinux:latest /usr/lib/systemd/systemd
          # systemd on runners can take several 90 s job-timeout cycles to
          # settle; require running|degraded before testing — piling work
          # onto an "initializing" PID1 is what produced the endless hangs.
          if ! timeout 300 sudo podman exec lisa-e2e bash -c \
            'until systemctl is-system-running 2>/dev/null | grep -qE "running|degraded"; do sleep 2; done'; then
            echo "::error::systemd never settled; boot journal follows"
            # journalctl reads journal files directly — works even when
            # PID1's bus is unresponsive.
            sudo podman exec lisa-e2e journalctl -b --no-pager | tail -150 || true
            exit 1
          fi
          sudo podman exec lisa-e2e systemctl list-units --failed --no-pager || true
      - name: Run layer e2e
        run: sudo podman exec lisa-e2e bash /src/tests/e2e/layer-test.sh
      - name: Diagnostics on failure
        if: failure()
        run: |
          sudo podman exec lisa-e2e systemctl list-jobs --no-pager || true
          sudo podman exec lisa-e2e systemctl list-units --failed --no-pager || true
          sudo podman exec lisa-e2e systemctl status lisa-inferenced.service --no-pager -l || true
          sudo podman exec lisa-e2e journalctl --no-pager -n 100 || true
      - name: Cleanup
        if: always()
        run: sudo podman rm -f lisa-e2e
