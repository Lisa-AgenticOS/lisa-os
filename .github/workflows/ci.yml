name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The default token is broader than any job here needs — none of them
# call the API or push anything (release.yml is the only writer, and
# declares contents: write for its `gh release create`).
# A newer push supersedes the run in flight; letting both finish just
# spends minutes to learn the same thing twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Per-job path filtering (ADR-0006): docs-only commits skip the heavy
  # jobs; the layer e2e additionally reacts to os/** changes.
  changes:
    runs-on: ubuntu-latest
    # A hung job otherwise burns the 6-hour default. Sized from
    # measured runs (the fast CI jobs finish inside a minute).
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      layer: ${{ steps.filter.outputs.layer }}
      shell: ${{ steps.filter.outputs.shell }}
      ime: ${{ steps.filter.outputs.ime }}
      gnome_panel: ${{ steps.filter.outputs.gnome_panel }}
      llama: ${{ steps.filter.outputs.llama }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'libs/**'
              - 'daemons/**'
              - 'portals/**'
              - 'cli/**'
              - 'models/**'
              - 'tests/e2e/**'
              # Everything the `egress` job READS, because that job hangs
              # off this filter. It once did not list os/** at all, so
              # editing a unit could never trigger the check that guards
              # it — and lisa-inferenced-dbus.service sat with NO
              # sandbox while a gate "covering" it stayed green by never
              # running. A gate you cannot reach is not a gate
              # (2026-08-05).
              #
              # The list is now the check's whole input surface, not
              # just the units: os/repo-tools/check-egress-units.py
              # DISCOVERS the units by reading the PKGBUILD install
              # lines, so a PKGBUILD edit can change which daemons are
              # covered without touching a single .service file (#275).
              - 'os/packages/**/*.service'
              - 'os/packages/**/PKGBUILD'
              - 'os/repo-tools/check-egress-units.py'
              - 'os/mkosi/**/systemd/**/*.service'
              - '.github/workflows/ci.yml'
            layer:
              - 'os/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'libs/**'
              - 'daemons/**'
              - 'portals/**'
              - 'cli/**'
              - 'models/**'
              - 'tests/e2e/**'
              # layer-e2e is the only PR-time job that runs
              # build-packages.sh, i.e. the only one that PACKAGES the
              # shell and apps trees into lisa-shell. Without these two,
              # a shell/apps change that breaks packaging (staging,
              # schema compilation, an installed path) is first caught
              # by release.yml, mid-release, ~40 minutes in.
              - 'shell/**'
              - 'apps/**'
              - '.github/workflows/ci.yml'
            # The JS suites: shell surfaces AND apps, one job, because
            # `just shell-test` has always globbed both trees. Without
            # 'apps/**' here an apps-only commit triggered no test job at
            # all — ~200 cases that CI had never run once (#242).
            shell:
              - 'shell/**'
              - 'apps/**'
              - 'justfile'
              - '.github/workflows/ci.yml'
            ime:
              - 'ime/**'
              # The addon is packaged as lisa-ime out of this PKGBUILD,
              # so a change there can break the build just as easily.
              - 'os/packages/lisa/PKGBUILD'
              - '.github/workflows/ci.yml'
            gnome_panel:
              - 'os/packages/lisa-desktop-control-center/**'
              - '.github/workflows/ci.yml'
            llama:
              - 'os/packages/llama.cpp/**'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    # A hung job otherwise burns the 6-hour default. Sized from
    # measured runs (the fast CI jobs finish inside a minute).
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: CLI resolver safety (issue #52)
        run: os/packages/lisa/tests/resolver-test.sh

  test:
    runs-on: ubuntu-latest
    # A hung job otherwise burns the 6-hour default. Sized from
    # measured runs (the fast CI jobs finish inside a minute).
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The portal's caller-identity tests need a real message broker:
      # p2p has exactly one peer, so "another app cannot drive your
      # session" is not a statement it can even make (ADR-0033).
      - run: sudo apt-get update && sudo apt-get install -y dbus
      - run: cargo test --workspace --locked
        env:
          LISA_REQUIRE_BUS_TESTS: '1'

  # The runner image ships dbus 1.14, which predates `ProcessFD` in
  # GetConnectionCredentials. Without a pidfd the portal cannot name a
  # caller's executable at all, so #106/#107's mechanism — the one thing
  # ADR-0033 asked to be asserted in CI rather than run locally — is
  # untestable there. Lisa OS ships on Arch (dbus 1.16); Debian trixie
  # is the closest base the runner can host.
  portal-identity:
    runs-on: ubuntu-latest
    # A hung job otherwise burns the 6-hour default. Sized from
    # measured runs (the fast CI jobs finish inside a minute).
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install -y dbus curl build-essential pkg-config
      - run: dbus-daemon --version | head -1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # remoted joined the portal here: its management plane resolves
      # callers the same way, over D-Bus *and* over its unix socket
      # (SO_PEERPIDFD), and neither can be proven on the runner's dbus
      # 1.14 base.
      - run: cargo test -p xdg-desktop-portal-lisa -p lisa-remoted -p lisa-peer --locked
        env:
          LISA_REQUIRE_BUS_TESTS: '1'
          LISA_REQUIRE_PIDFD: '1'

  # PLAN §5.7 shell surfaces and §5.8 apps: pure-logic unit tests
  # (overlay envelope, launcher ranking, ledger view-model, Mail's
  # parsers, Surfer's URL policy, Preview's view math) — runtime-agnostic
  # modules run under node here, gjs on the image, jsc on macOS dev hosts.
  #
  # This runs `just shell-test` rather than restating its glob. The glob
  # covered apps/*/tests all along; the job did not, so ~200 app cases
  # were green on their author's laptop and had never once run in CI
  # (#242). Two lists is how that happens, so there is one list.
  shell-tests:
    runs-on: ubuntu-latest
    # A hung job otherwise burns the 6-hour default. Sized from
    # measured runs (the fast CI jobs finish inside a minute).
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y just
      - run: just shell-test

  # PLAN §5.7.3 layer 2 (ADR-0007): compile the fcitx5 addon against
  # real Fcitx5Core headers in an Arch container and run the protocol
  # unit tests.
  ime-build:
    runs-on: ubuntu-latest
    # A hung job otherwise burns the 6-hour default. Sized from
    # measured runs (the fast CI jobs finish inside a minute).
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.ime == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Build addon + run protocol tests in Arch
        run: |
          sudo podman --runtime runc run --rm -v "$PWD":/src docker.io/library/archlinux:latest bash -ec '
            pacman -Sy --noconfirm --needed base-devel cmake fcitx5 >/dev/null
            # fcitx5 DOES ship fcitx-module/dbus/dbus_public.h, at
            # /usr/include/Fcitx5/Module/fcitx-module/dbus/. The earlier
            # guesswork here (installing fcitx5-qt/fcitx5-configtool with
            # || true, on a hunch the header had moved to another
            # package) was looking in the wrong place: the header was
            # present all along and the include path was wrong. The fix
            # is in ime/fcitx5-lisa/CMakeLists.txt.
            cmake -S /src/ime/fcitx5-lisa -B /tmp/build
            cmake --build /tmp/build
            cd /tmp/build && ctest --output-on-failure'

  # ADR-0012: build our forked gnome-control-center (stock 50.3 + the
  # native Intelligence panel) with makepkg in an x86 Arch container —
  # the real build gate the arm64 dev-host compile-check cannot be. Heavy
  # (full g-c-c compile), so path-filtered to the package dir. --nocheck
  # skips upstream's xvfb test suite; --skippgpcheck trusts the pinned
  # tag/commit (no keyring in CI).
  gnome-panel-build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.gnome_panel == 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: makepkg lisa-desktop-control-center in Arch
        run: |
          sudo podman --runtime runc run --rm -v "$PWD":/src docker.io/library/archlinux:latest bash -ec '
            # devtools provides arch-meson (used by the PKGBUILD build()).
            pacman -Syu --noconfirm --needed base-devel git devtools >/dev/null
            useradd -m builder
            printf "builder ALL=(ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/builder
            cp -r /src/os/packages/lisa-desktop-control-center /home/builder/pkg
            chown -R builder:builder /home/builder/pkg
            su builder -c "cd ~/pkg && makepkg -s --nocheck --skippgpcheck --noconfirm"
            # Prove the panel landed: our desktop file must be in the package.
            pkg=$(ls /home/builder/pkg/gnome-control-center-[0-9]*.pkg.tar.*)
            echo "built: $pkg"
            pacman -Qlp "$pkg" | grep -q gnome-lisa-panel.desktop \
              && echo "OK: Intelligence panel .desktop present" \
              || { echo "FAIL: panel .desktop missing from package"; exit 1; }'

  # aarch64 twin of gnome-panel-build (ADR-0021, issue #28). The ARM image
  # ships this fork too, so the ARM compile needs a per-PR gate — the
  # aarch64 image lane runs weekly, far too late to catch a PKGBUILD that
  # only builds on x86. Native arm64 runner + the ALARM container, the same
  # pair the image lane uses; ALARM carries stock gnome-control-center
  # 50.3-1, so every dependency of the pinned version resolves there.
  gnome-panel-build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.gnome_panel == 'true'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: makepkg lisa-desktop-control-center in Arch Linux ARM
        run: |
          sudo podman --runtime runc run --rm -v "$PWD":/src docker.io/menci/archlinuxarm@sha256:7ec87e868f830efc13ad1cf308d11f5f022e54d6f8fa3cfbe1d469f05873af80 bash -ec '
            # pacman >= 7 sandbox cannot apply inside the container.
            sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
            pacman -Syu --noconfirm --needed base-devel git devtools >/dev/null
            useradd -m builder
            printf "builder ALL=(ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/builder
            cp -r /src/os/packages/lisa-desktop-control-center /home/builder/pkg
            chown -R builder:builder /home/builder/pkg
            su builder -c "cd ~/pkg && makepkg -s --nocheck --skippgpcheck --noconfirm"
            pkg=$(ls /home/builder/pkg/gnome-control-center-[0-9]*.pkg.tar.* | grep -v -- -debug- | head -1)
            echo "built: $pkg"
            pacman -Qlp "$pkg" | grep -q gnome-lisa-panel.desktop \
              && echo "OK: Intelligence panel .desktop present (aarch64)" \
              || { echo "FAIL: panel .desktop missing from package"; exit 1; }'

  # PLAN §5.1: build the local inference engine (llama.cpp / llama-server)
  # from source in x86 Arch — it's AUR-only, so this is the build gate.
  # Path-filtered (heavy C++ compile). Asserts the server binary lands.
  llama-build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.llama == 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: makepkg llama.cpp in Arch
        run: |
          sudo podman --runtime runc run --rm -v "$PWD":/src docker.io/library/archlinux:latest bash -ec '
            pacman -Syu --noconfirm --needed base-devel git cmake >/dev/null
            useradd -m builder
            printf "builder ALL=(ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/builder
            cp -r /src/os/packages/llama.cpp /home/builder/pkg
            chown -R builder:builder /home/builder/pkg
            su builder -c "cd ~/pkg && makepkg -s --nocheck --skippgpcheck --noconfirm"
            # makepkg also emits a -debug package; select only the main one.
            pkg=$(ls /home/builder/pkg/llama.cpp-*.pkg.tar.* | grep -v -- -debug- | head -1)
            echo "built: $pkg"
            pacman -Qlp "$pkg" | grep -q usr/bin/llama-server \
              && echo "OK: llama-server present" \
              || { echo "FAIL: llama-server missing from package"; exit 1; }'

  # aarch64 twin of llama-build (ADR-0021, issue #28). The PKGBUILD claims
  # the same cmake invocation works on ARM (GGML_NATIVE=OFF adds no arch
  # flag there); this is the job that has to prove it, per PR, rather than
  # discovering it in the weekly image lane. Also asserts the shipped
  # binary is genuinely aarch64.
  llama-build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.llama == 'true'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: makepkg llama.cpp in Arch Linux ARM
        run: |
          sudo podman --runtime runc run --rm -v "$PWD":/src docker.io/menci/archlinuxarm@sha256:7ec87e868f830efc13ad1cf308d11f5f022e54d6f8fa3cfbe1d469f05873af80 bash -ec '
            sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
            pacman -Syu --noconfirm --needed base-devel git cmake file >/dev/null
            useradd -m builder
            printf "builder ALL=(ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/builder
            cp -r /src/os/packages/llama.cpp /home/builder/pkg
            chown -R builder:builder /home/builder/pkg
            su builder -c "cd ~/pkg && makepkg -s --nocheck --skippgpcheck --noconfirm"
            pkg=$(ls /home/builder/pkg/llama.cpp-*.pkg.tar.* | grep -v -- -debug- | head -1)
            echo "built: $pkg"
            pacman -Qlp "$pkg" | grep -q usr/bin/llama-server \
              && echo "OK: llama-server present" \
              || { echo "FAIL: llama-server missing from package"; exit 1; }
            bsdtar -xOf "$pkg" usr/bin/llama-server > /tmp/llama-server
            desc=$(file -b /tmp/llama-server)
            echo "llama-server: $desc"
            case "$desc" in
              *"ARM aarch64"*|*aarch64*) echo "OK: llama-server is an aarch64 binary" ;;
              *) echo "FAIL: llama-server is not aarch64 — file said: $desc"; exit 1 ;;
            esac'

  # PLAN §5.1 acceptance forerunner: unmodified OpenAI Python client
  # against the OpenAI-compat endpoint.
  openai-compat:
    runs-on: ubuntu-latest
    # A hung job otherwise burns the 6-hour default. Sized from
    # measured runs (the fast CI jobs finish inside a minute).
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p lisa-inferenced
      - name: Start daemon
        run: |
          ./target/debug/lisa-inferenced &
          # The loop needs a failure branch: without one, a daemon that
          # never comes up just lets the loop run out, and the client
          # test then fails with a connection error attributed to the
          # client instead of the daemon that died at startup.
          up=""
          for _ in $(seq 1 50); do
            if curl -sf 127.0.0.1:7777/health >/dev/null; then up=1; break; fi
            sleep 0.2
          done
          [ -n "$up" ] || { echo "FAIL: lisa-inferenced never answered /health — daemon startup failed, not the client"; exit 1; }
      - run: pip install openai
      - run: python tests/e2e/openai_client_test.py

  # PLAN §5.10: egress control is verified, not promised. Two layers,
  # and the split is deliberate (#275):
  #   - check-egress-units.py discovers every shipped unit from the
  #     installers, classifies it by the daemon it runs, and fails on a
  #     daemon nobody classified. Static, but it is the only layer that
  #     notices a defence-in-depth directive going missing from a unit
  #     that is still blocked by another one.
  #   - egress-test.sh takes ITS unit list from that same script, lifts
  #     each unit's sandbox out of the shipped file, and actually tries
  #     to reach the internet from inside it — for all six no-egress
  #     units now, not just lisa-inferenced, and with lisa-remoted's
  #     sandbox as the positive control.
  egress:
    runs-on: ubuntu-latest
    # A hung job otherwise burns the 6-hour default. Sized from
    # measured runs (the fast CI jobs finish inside a minute).
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p lisa-inferenced
      # Static first: it needs no network and its failure message names
      # the unit, so a red run reads as "this unit lost its sandbox"
      # rather than "curl returned 7".
      - name: Every shipped unit declares an egress posture
        run: |
          python3 os/repo-tools/check-egress-units.py --explain
          python3 os/repo-tools/check-egress-units.py
      - name: Egress is blocked at runtime, from inside every shipped sandbox
        run: bash tests/e2e/egress-test.sh target/debug/lisa-inferenced

  # PLAN §10 M0 acceptance: the Track L layer installs and uninstalls
  # cleanly on vanilla Arch (systemd container; Omarchy VM lands later).
  layer-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changes
    if: needs.changes.outputs.layer == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Start Arch container with systemd
        run: |
          # --privileged: the runner's default seccomp/AppArmor confinement
          # kills dbus-broker's launcher child, crashlooping the system bus
          # and wedging PID1 (throwaway CI container; the image job already
          # runs privileged for the same reason).
          sudo podman --runtime runc run -d --name lisa-e2e --privileged --systemd=always -v "$PWD":/src:ro \
            docker.io/library/archlinux:latest /usr/lib/systemd/systemd
          # systemd on runners can take several 90 s job-timeout cycles to
          # settle; require running|degraded before testing — piling work
          # onto an "initializing" PID1 is what produced the endless hangs.
          if ! timeout 300 sudo podman exec lisa-e2e bash -c \
            'until systemctl is-system-running 2>/dev/null | grep -qE "running|degraded"; do sleep 2; done'; then
            echo "::error::systemd never settled; boot journal follows"
            # journalctl reads journal files directly — works even when
            # PID1's bus is unresponsive.
            sudo podman exec lisa-e2e journalctl -b --no-pager | tail -150 || true
            exit 1
          fi
          sudo podman exec lisa-e2e systemctl list-units --failed --no-pager || true
      - name: Run layer e2e
        run: sudo podman exec lisa-e2e bash /src/tests/e2e/layer-test.sh
      - name: Diagnostics on failure
        if: failure()
        run: |
          sudo podman exec lisa-e2e systemctl list-jobs --no-pager || true
          sudo podman exec lisa-e2e systemctl list-units --failed --no-pager || true
          sudo podman exec lisa-e2e systemctl status lisa-inferenced.service --no-pager -l || true
          sudo podman exec lisa-e2e journalctl --no-pager -n 100 || true
      - name: Cleanup
        if: always()
        run: sudo podman rm -f lisa-e2e
