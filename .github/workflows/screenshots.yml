# Self-screenshotting CI (PLAN §3/§6 desktop, ADR-0017 splash). Builds
# the Track I image the same way nightly's image job does, then boots it
# GRAPHICALLY in QEMU (OVMF + systemd-boot — the REAL boot flow, splash
# included) and captures QMP screendumps of the framebuffer: Plymouth
# splash frames early, the desktop (Lisa Desktop — the image installs
# lisa-desktop-shell in place of stock gnome-shell, ADR-0039 step 4)
# once the session is up, and — best-effort — the Assistant app, driven
# over ssh. Output: the
# `lisa-screenshots` artifact (PNGs + index) for the websites and a
# SPLASH: PRESENT/ABSENT verdict (informational, not a gate yet).
#
# WHAT THE SPLASH ACTUALLY LOOKS LIKE (#26). Two forensics rounds
# concluded "the early framebuffer is black" while testing for a VIOLET
# frame. The theme that would have painted violet — a hand-made
# `lisa.plymouth` — was deleted on 2026-07-28 (1fec591) because it loaded
# and failed. What ships now is Arch's stock `bgrt` theme with our
# watermark swapped in, and read off the reference device its background
# is literally `BackgroundStartColor=0x000000`:
#
#     /usr/share/plymouth/themes/bgrt/bgrt.plymouth  -> ModuleName=two-step
#     ImageDir=/usr/share/plymouth/themes//spinner
#     BackgroundStartColor=0x000000 / BackgroundEndColor=0x000000
#
# So a PERFECTLY captured Lisa splash is a black field carrying a small
# white spinner and the 128x37 white Lisa watermark at
# WatermarkVerticalAlignment=.96 — whole-frame mean well under 0.01 and
# r≈g≈b. Both of the old gates (`mean > 0.02`, `b > g*1.15 && r > g`)
# reject it by construction: the run could not have said PRESENT even
# with the splash dead centre in the frame. The detector below therefore
# looks for the WATERMARK — a dark frame whose bottom-centre band is
# bright, confirmed by template-matching the very PNG this repo ships —
# and keeps the violet test only so a future violet theme still trips it.
# #26's acceptance line ("a genuinely r>g frame") describes the deleted
# theme and wants rewording to match.
#
# Rebuilds fresh instead of downloading the nightly artifact: artifact
# download across workflows needs a run id + token plumbing and goes
# stale after 7 days; the rebuild is the same three commands nightly
# runs and always screenshots HEAD. The Assistant is NOT in this image
# (only the release build folds lisa-shell in), but the platform set
# ships gjs/GTK4/libadwaita/libsoup3 — so the interpreted shell tree
# from the checkout is pushed in over ssh and launched with gjs directly.

name: screenshots

on:
  workflow_dispatch:
  # Fresh desktop screenshots after every green nightly image.
  workflow_run:
    workflows: [nightly-image]
    types: [completed]

# The default token is broader than any job here needs — none of them
# call the API or push anything (release.yml is the only writer, and
# declares contents: write for its `gh release create`).
permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    # Image build ~20 min + boot-to-desktop, which under TCG fallback
    # (no /dev/kvm) can take tens of minutes on its own.
    timeout-minutes: 120
    # On workflow_run, only screenshot images that actually built.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
      - name: Expose /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "no KVM; QEMU will fall back to TCG"; fi
      # Identical to nightly.yml's image job: real Arch container so
      # mkosi uses Arch's own pacman (the Debian tools tree lacks the
      # pacman cache dir); sandbox off because pacman >= 7 cannot apply
      # it inside the container.
      - name: Build image in Arch container
        run: |
          sudo podman run --rm --privileged \
            -v "$PWD":/src -w /src docker.io/library/archlinux:latest bash -ec '
              # pacman >= 7 sandbox cannot apply inside the container
              sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              # Trust the [lisa] key in this container AND in the keyring
              # mkosi builds for the image (#270) — the image installs
              # lisa-desktop-shell from the hosted index (ADR-0039 step
              # 4), so a build without the anchor dies on "key … is
              # unknown". This block mirrors nightly.yml, where the full
              # story is told; this lane went red the day step 4 landed
              # because the fix was applied to nightly and release only.
              pacman-key --init
              pacman-key --populate archlinux
              pacman-key --add /src/os/packages/lisa-keyring/lisa-packages.pub
              pacman-key --lsign-key 737240D11D28E109A474A8E5827E27417AF5982B
              KEYS=/src/os/mkosi/mkosi.pkgmngr/usr/share/pacman/keyrings
              mkdir -p "$KEYS"
              gpg --dearmor < /src/os/packages/lisa-keyring/lisa-packages.pub > "$KEYS/lisa.gpg"
              printf "%s:4:\n" 737240D11D28E109A474A8E5827E27417AF5982B > "$KEYS/lisa-trusted"
              : > "$KEYS/lisa-revoked"
              pacman -Syu --noconfirm
              # mkosi pinned from the permanent Arch archive (#271), the
              # same 26-5 every other lane pins — bump together.
              pacman -U --noconfirm https://archive.archlinux.org/packages/m/mkosi/mkosi-26-5-any.pkg.tar.zst
              mkosi --directory os/mkosi summary
              mkosi --directory os/mkosi build
            '
          # Outputs were written by root inside the container.
          sudo chown -R "$USER:" os/mkosi
      - name: Install host tools (QEMU, OVMF, ImageMagick, sshpass)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            qemu-system-x86 ovmf imagemagick sshpass >/dev/null
      # Two small helpers both boot passes share. Kept in their own step
      # so the splash pass can run before the long desktop pass and so
      # ONE definition of "is this frame the splash?" serves the capture
      # loop, the index and the summary — the previous copy-in-two-places
      # is how the verdict drifted away from the theme that ships.
      - name: Write the QMP + frame-classification helpers
        run: |
          set -o pipefail
          # One QMP command per connection: QMP allows a single client,
          # and reconnecting per call keeps every dump independent.
          # QMP_SOCK selects which VM (the splash pass runs its own).
          cat > qmp.py <<'EOF'
          #!/usr/bin/env python3
          """qmp.py <command> [screendump-filename] — one QMP command per run."""
          import json, os, socket, sys

          cmd = sys.argv[1]
          args = {"filename": sys.argv[2]} if cmd == "screendump" else {}
          s = socket.socket(socket.AF_UNIX)
          s.settimeout(60)
          s.connect(os.environ.get("QMP_SOCK", "qmp.sock"))
          f = s.makefile("rw")
          json.loads(f.readline())  # server greeting
          for payload in ({"execute": "qmp_capabilities"},
                          {"execute": cmd,
                           **({"arguments": args} if args else {})}):
              f.write(json.dumps(payload) + "\n")
              f.flush()
              while True:  # skip async events between command and reply
                  try:
                      resp = json.loads(f.readline())
                  except (json.JSONDecodeError, OSError):
                      if cmd == "quit":  # QEMU may close mid-reply
                          sys.exit(0)
                      raise
                  if "return" in resp:
                      break
                  if "error" in resp:
                      sys.exit(f"QMP {cmd} failed: {resp['error']}")
          EOF
          # The watermark the splash draws, flattened onto black exactly
          # as Plymouth composites it (the shipped PNG is white on
          # transparent). This is the template the detector matches, so
          # the test is against the artifact we actually install rather
          # than against a colour somebody remembered.
          convert os/mkosi/mkosi.extra/usr/share/plymouth/themes/spinner/watermark.png \
            -background black -alpha remove -alpha off wm-ref.png
          identify wm-ref.png
          cat > classify.sh <<'EOF'
          #!/usr/bin/env bash
          # classify.sh <frame.ppm|png> [splash-eligible]
          # -> "mean r g b bandmean bandmax rmse note", one line, never fails.
          #
          # Geometry, not colour. The Lisa splash is stock `bgrt`/two-step on
          # a 0x000000 background: a small white spinner at
          # VerticalAlignment=.7 and the 128x37 white watermark at
          # WatermarkVerticalAlignment=.96, HorizontalAlignment=.5. So the
          # signature is "frame is dark AND the bottom-centre band is
          # bright", expressed in PERCENTAGES so it holds at any scanout
          # resolution the firmware happens to pick.
          #
          # The band test alone would also accept centred white boot text,
          # so a candidate is confirmed by template-matching wm-ref.png
          # inside that band (compare -subimage-search). The match runs
          # only on candidates — it is the expensive half — and its
          # normalised RMSE is printed either way, so a frame that looked
          # right and matched badly is visible instead of silently dropped.
          set -uo pipefail
          f=$1; elig=${2:-}
          stats=$(identify -format '%[fx:mean] %[fx:mean.r] %[fx:mean.g] %[fx:mean.b] %w %h' "$f" 2>/dev/null) \
            || { echo "- - - - - - - unreadable"; exit 0; }
          read -r M R G B W H <<<"$stats"
          # Crop in PIXELS derived from the frame's own size. `-crop` takes
          # percentages for width/height but its offsets are always pixels,
          # so a "+30%+82%" geometry silently crops at +30+82 — the top-left
          # corner, i.e. exactly not where the watermark is.
          cw=$(( W * 40 / 100 )); ch=$(( H * 16 / 100 ))
          cx=$(( W * 30 / 100 )); cy=$(( H * 82 / 100 ))
          geom="${cw}x${ch}+${cx}+${cy}"
          band=$(convert "$f" -crop "$geom" +repage \
                   -format '%[fx:mean] %[fx:maxima]' info: 2>/dev/null) || band="- -"
          read -r WM WX <<<"$band"
          RMSE=-
          note=black
          awk -v m="$M" 'BEGIN{exit !(m>0.01)}' && note=content
          if [ -n "$elig" ] && [ "$WM" != - ] \
             && awk -v m="$M" -v w="$WM" -v x="$WX" \
                  'BEGIN{exit !(m<0.15 && w>0.004 && x>0.5)}'; then
            note=bright-bottom-band
            convert "$f" -crop "$geom" +repage band.png 2>/dev/null
            RMSE=$(compare -metric RMSE -subimage-search band.png wm-ref.png \
                     /dev/null 2>&1 | sed -n 's/.*(\([0-9.e-]*\)).*/\1/p' | head -1)
            [ -n "$RMSE" ] || RMSE=-
            if [ "$RMSE" != - ] && awk -v d="$RMSE" 'BEGIN{exit !(d<0.20)}'; then
              note=splash-watermark
            fi
          fi
          # Kept for the day a violet theme comes back: #6D45C9 is r=109,
          # g=69, b=201, so both blue AND red lead green. Nothing ships
          # this today — it is a second, independent way to be right.
          if [ -n "$elig" ] && [ "$note" != splash-watermark ] \
             && awk -v m="$M" -v r="$R" -v g="$G" -v b="$B" \
                  'BEGIN{exit !(m>0.02 && b>g*1.15 && r>g)}'; then
            note=violet-splash
          fi
          printf '%s %s %s %s %s %s %s %s\n' "$M" "$R" "$G" "$B" "$WM" "$WX" "$RMSE" "$note"
          EOF
          chmod +x classify.sh
      # ---------------------------------------------------------------
      # THE SPLASH PASS (#26) — a short, throwaway boot whose only job is
      # the Plymouth window, run BEFORE the long desktop pass so its
      # evidence lands even if the desktop later times out.
      #
      # THE TIMING ASSUMPTION, stated plainly: we do NOT assume we know
      # WHEN the splash appears. Sampling starts the moment QEMU accepts
      # QMP — before the firmware has handed off — and continues at a
      # fixed 1 s cadence until the guest reaches the graphical target or
      # a hard 6-minute cap. What we DO assume is that the splash window
      # is WIDER THAN 1 SECOND: it opens when plymouth-start binds a DRM
      # device and closes when GDM takes the framebuffer, which on the
      # reference device is seconds, and under TCG here is longer still
      # (no KVM on GitHub runners). If that assumption is ever false the
      # index shows a dense unbroken run of black frames with no gap, and
      # the cadence — not the splash — is what to change.
      #
      # It is a SECOND boot, not extra dumps in the first, because the
      # one open question in #26 is the display device: the desktop pass
      # keeps `-device virtio-vga` (which produces the desktop and
      # Assistant frames that already work) and this pass runs plain
      # `-device VGA` (simpledrm binds its framebuffer). That is a
      # controlled A/B rather than the blind swap the issue thread
      # explicitly refused. `snapshot=on` on the disk means this boot
      # writes to a throwaway overlay and the desktop pass still gets a
      # clean image.
      #
      # NOTHING HERE FAILS THE JOB. Every exit path is a warning plus a
      # recorded reason in shots/splash-index.txt: a splash that did not
      # show up is a finding, and a run must not go red over the guest
      # booting faster than a sampling loop.
      - name: Splash pass — dedicated early-boot capture (-device VGA)
        run: |
          set -o pipefail
          mkdir -p shots
          : > shots/splash-index.txt
          record() { printf '%s\n' "$*" >> shots/splash-index.txt; }
          record "# splash pass: -device VGA, snapshot=on, 1s cadence, 360s cap"
          record "frame            t(s)  mean    r       g       b       band    bandmax rmse    note"
          cp /usr/share/OVMF/OVMF_VARS_4M.fd splash-vars.fd
          export QMP_SOCK=splash-qmp.sock
          qemu-system-x86_64 \
            -machine q35 -accel kvm -accel tcg -m 4G \
            -display none -device VGA \
            -serial file:splash-serial.log \
            -qmp unix:splash-qmp.sock,server=on,wait=off \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=splash-vars.fd \
            -drive file=os/mkosi/lisa.raw,format=raw,if=virtio,snapshot=on &
          SPLASH_PID=$!
          for _ in $(seq 1 30); do [ -S splash-qmp.sock ] && break; sleep 1; done
          if [ ! -S splash-qmp.sock ]; then
            echo "::warning::splash pass: QEMU never opened its QMP socket — no splash evidence from this pass"
            record "(QEMU never opened splash-qmp.sock — pass produced no frames)"
            kill "$SPLASH_PID" 2>/dev/null || true
            exit 0
          fi
          t0=$(date +%s); deadline=$((t0 + 360))
          n=0; kept=0; found=0; after=0; dm=0; fails=0; consec=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            frame=$(printf 'shots/splash-%03d.ppm' "$n")
            if python3 qmp.py screendump "$PWD/$frame"; then
              consec=0
              t=$(( $(date +%s) - t0 ))
              read -r M R G B WM WX RM NOTE <<<"$(./classify.sh "$frame" splash-eligible)"
              # Retain anything that is not a black frame, plus every 15th
              # black one — the sparse baseline is what proves the loop was
              # sampling rather than stalled, and it is what makes an
              # ABSENT verdict readable instead of an empty directory.
              if [ "$NOTE" != black ] || [ $((n % 15)) -eq 0 ]; then
                record "$(printf '%-16s %-5s %-7s %-7s %-7s %-7s %-7s %-7s %-7s %s' \
                  "$(basename "$frame")" "$t" "$M" "$R" "$G" "$B" "$WM" "$WX" "$RM" "$NOTE")"
                kept=$((kept+1))
              else
                rm -f "$frame"
              fi
              case "$NOTE" in splash-watermark|violet-splash) found=1 ;; esac
            else
              fails=$((fails+1)); consec=$((consec+1))
              rm -f "$frame"
              # A dead QMP socket spins this loop for the whole cap
              # producing nothing. Twenty consecutive failures is not
              # timing, it is a dead VM — stop and say which it was.
              if [ "$consec" -ge 20 ]; then
                record "(20 consecutive screendump failures — QEMU or QMP died; pass abandoned)"
                break
              fi
            fi
            # Stop conditions, in order of confidence: five more frames
            # after the first hit (so the artifact carries context, not a
            # single lucky sample); ten more after the display manager
            # takes the framebuffer (the splash window is closed by then);
            # otherwise the cap.
            if [ "$found" = 1 ]; then
              after=$((after+1)); [ "$after" -ge 5 ] && break
            fi
            if grep -qE 'Reached target Graphical Interface|Starting GNOME Display Manager' splash-serial.log 2>/dev/null; then
              dm=$((dm+1)); [ "$dm" -ge 10 ] && break
            fi
            n=$((n+1)); sleep 1
          done
          # Always keep a last frame, so the artifact is never empty even
          # when every sample was black.
          python3 qmp.py screendump "$PWD/shots/splash-final.ppm" || true
          if [ -f shots/splash-final.ppm ]; then
            read -r M R G B WM WX RM NOTE <<<"$(./classify.sh shots/splash-final.ppm splash-eligible)"
            record "$(printf '%-16s %-5s %-7s %-7s %-7s %-7s %-7s %-7s %-7s %s' \
              splash-final.ppm "$(( $(date +%s) - t0 ))" "$M" "$R" "$G" "$B" "$WM" "$WX" "$RM" "$NOTE")"
            case "$NOTE" in splash-watermark|violet-splash) found=1 ;; esac
          fi
          record "# sampled $((n+1)) frames in $(( $(date +%s) - t0 ))s; kept $kept; $fails screendump errors; splash found=$found"
          python3 qmp.py quit || true
          wait "$SPLASH_PID" || true
          if [ "$found" = 1 ]; then
            echo "splash pass: watermark found on -device VGA"
          else
            echo "splash pass: no splash frame on -device VGA (see shots/splash-index.txt)"
          fi
      # UEFI boot from disk, exactly like the ab-rollback job — so
      # systemd-boot runs and the baked cmdline (`quiet splash`,
      # ADR-0017) engages Plymouth on the virtio-vga framebuffer.
      # -display none still renders into the device; QMP `screendump`
      # reads the framebuffer headlessly. Serial output goes to a file
      # (the baked console=ttyS0 keeps the framebuffer clean for the
      # splash AND gives us a boot log for the artifact). User-net
      # hostfwd 2222->22 lets the runner ssh in (sshd enabled by the
      # image preset; provisional lisa/lisa password auth per STATUS).
      - name: Boot graphically + capture screendump timeline
        run: |
          set -o pipefail
          mkdir -p shots
          # qmp.py comes from the helpers step; QMP_SOCK defaults to
          # qmp.sock, which is this pass's socket.
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          qemu-system-x86_64 \
            -machine q35 -accel kvm -accel tcg -m 4G \
            -display none -device virtio-vga \
            -serial file:serial.log \
            -qmp unix:qmp.sock,server=on,wait=off \
            -netdev user,id=net0,hostfwd=tcp::2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=os/mkosi/lisa.raw,format=raw,if=virtio &
          QEMU_PID=$!
          for _ in $(seq 1 30); do [ -S qmp.sock ] && break; sleep 1; done
          if [ ! -S qmp.sock ]; then
            echo "::error::QEMU never opened its QMP socket — it likely failed to start; see step output above"
            exit 1
          fi

          # Phase 1 — early boot on virtio-vga, dense cadence (2s for 40s,
          # then 10s to ~100s). Run-1 lesson: under KVM a 10s cadence boots
          # straight past the early phase. Run-2 lesson: even at 2s these
          # frames read as black — though "black" was measured with a
          # detector that could not have passed the shipped theme either
          # (see the header). ADR-0025 put `virtio_gpu` on
          # KernelInitrdModules=, so a real DRM driver drives virtio-vga
          # during the initrd. These frames are now the CONTROL ARM of the
          # display-device A/B: the splash pass above ran the same boot on
          # plain `-device VGA`, and the summary reports both. Issue #26.
          sleep 3
          n=0
          for _ in $(seq 1 20); do
            python3 qmp.py screendump "$PWD/shots/shot-$(printf '%02d' "$n").ppm" \
              || echo "::warning::early frame $n failed (framebuffer not ready?)"
            n=$((n+1)); sleep 2
          done
          for _ in $(seq 1 6); do
            python3 qmp.py screendump "$PWD/shots/shot-$(printf '%02d' "$n").ppm" \
              || echo "::warning::early frame $n failed"
            n=$((n+1)); sleep 10
          done
          # A run where EVERY early dump failed cannot answer the splash
          # question — its primary product. Without this floor such a run
          # sails on and prints SPLASH: ABSENT, indistinguishable from
          # "captured fine, and the frames were black".
          if ! ls shots/shot-*.ppm >/dev/null 2>&1; then
            echo "::error::every early-boot screendump failed — QMP or the display device is dead, the splash verdict would be vacuous"
            python3 qmp.py quit || true
            exit 1
          fi
          echo "early-boot frames captured"

          # Phase 2 — wait for the desktop. First sshd (proves boot +
          # network), then the Wayland socket of the autologin session
          # (proves the shell — Lisa Desktop — is up). Generous budgets: TCG.
          ssh_guest() {
            sshpass -p lisa ssh -p 2222 -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
              -o LogLevel=ERROR lisa@127.0.0.1 "$@"
          }
          up=""
          for _ in $(seq 1 100); do  # <= ~25 min
            if ssh_guest true 2>/dev/null; then up=1; break; fi
            sleep 15
          done
          if [ -z "$up" ]; then
            echo "::error::guest sshd never answered on 2222 — boot or user-net failed; serial.log tail follows"
            tail -50 serial.log || true
            python3 qmp.py screendump "$PWD/shots/timeout.ppm" || true
            python3 qmp.py quit || true
            exit 1
          fi
          echo "sshd is up"

          # Splash forensics from INSIDE the guest (#26). A black frame has
          # two very different causes — nothing painted, or something
          # painted that our detector cannot see — and only the guest can
          # say which theme Plymouth actually resolved. Read-only, and it
          # runs while we are waiting for the session anyway. `|| true`:
          # this is evidence, not a gate.
          ssh_guest 'echo "== plymouth-set-default-theme"; plymouth-set-default-theme 2>&1
            echo "== default.plymouth symlink"; ls -l /usr/share/plymouth/themes/default.plymouth 2>&1
            test -e /usr/share/plymouth/themes/default.plymouth \
              && echo "   -> RESOLVES" || echo "   -> DANGLING"
            echo "== watermark shipped?"; ls -l /usr/share/plymouth/themes/spinner/watermark.png \
              /usr/share/plymouth/themes/spinner/.lisa-branded 2>&1
            echo "== theme background"; grep -E "^(Background|ModuleName|ImageDir|Watermark)" \
              /usr/share/plymouth/themes/bgrt/bgrt.plymouth 2>&1
            echo "== plymouth units"; journalctl -b --no-pager -u plymouth-start -u plymouth-quit 2>&1 | tail -20' \
            > splash-theme.txt 2>&1 || true
          cat splash-theme.txt || true

          session=""
          for _ in $(seq 1 40); do  # <= ~10 min
            if ssh_guest 'test -S /run/user/1000/wayland-0' 2>/dev/null; then session=1; break; fi
            sleep 15
          done
          if [ -z "$session" ]; then
            echo "::error::session Wayland socket (wayland-0) never appeared for the autologin user — Lisa Desktop did not come up"
            python3 qmp.py screendump "$PWD/shots/no-session.ppm" || true
            python3 qmp.py quit || true
            exit 1
          fi
          sleep 45  # let the shell finish drawing (settle, esp. TCG)
          python3 qmp.py screendump "$PWD/shots/desktop.ppm"
          echo "desktop frame captured"

          # Phase 3 — the Assistant, best-effort: push the interpreted
          # shell tree from this checkout (the image itself carries no
          # lisa-shell; see header) and launch it inside the session via
          # the user manager with the session env. Failure warns, never
          # fails the job — splash + desktop are the primary product.
          if tar -C shell -cz --exclude='*/tests' --exclude='testing' . \
               | ssh_guest 'mkdir -p /tmp/lisa-shell && tar -xz -C /tmp/lisa-shell' \
             && ssh_guest 'export XDG_RUNTIME_DIR=/run/user/1000; \
                  systemd-run --user --unit=lisa-assistant-shot \
                    --setenv=WAYLAND_DISPLAY=wayland-0 \
                    --setenv=XDG_RUNTIME_DIR=/run/user/1000 \
                    gjs -m /tmp/lisa-shell/assistant/lisa-assistant.js'
          then
            sleep 60  # window map + first paint (generous for TCG)
            python3 qmp.py screendump "$PWD/shots/assistant.ppm"
            echo "assistant frame captured"
          else
            echo "::warning::Assistant launch failed (daemon-less nightly image; see serial.log / journal) — no assistant.ppm this run"
          fi

          python3 qmp.py quit || true
          wait "$QEMU_PID" || true
      # PPM -> PNG, per-frame index, and the splash verdict for BOTH
      # passes. `if: always()` because the splash evidence is the product
      # this workflow owes #26, and losing it because phase 2 timed out
      # waiting for a desktop is exactly how the last two rounds ended up
      # re-deriving everything by hand.
      - name: Convert frames + splash verdict
        if: always()
        run: |
          set -o pipefail
          shopt -s nullglob
          for f in shots/*.ppm; do
            convert "$f" "${f%.ppm}.png" && rm "$f"
          done
          pngs=(shots/*.png)
          if [ "${#pngs[@]}" -eq 0 ]; then
            echo "::error::no frames were captured at all"
            exit 1
          fi
          # The verdict is decided inside a `{ ... } | tee` pipeline, i.e. a
          # SUBSHELL — a plain SPLASH=PRESENT there is discarded on exit and
          # the summary below always printed ABSENT, however violet the
          # frames were. Carry it out through files instead.
          rm -f splash-vga.verdict splash-virtio.verdict
          {
            echo "frame                mean    r       g       b       band    bandmax rmse    note"
            for f in "${pngs[@]}"; do
              # Only early-boot frames are splash-eligible: the desktop and
              # Assistant frames are bright by design and must never be
              # able to carry the verdict.
              elig=""
              case "$(basename "$f")" in shot-*|splash-*) elig=splash-eligible ;; esac
              read -r M R G B WM WX RM note <<<"$(./classify.sh "$f" $elig)"
              case "$note:$(basename "$f")" in
                splash-watermark:splash-*|violet-splash:splash-*) echo PRESENT > splash-vga.verdict ;;
                splash-watermark:shot-*|violet-splash:shot-*)     echo PRESENT > splash-virtio.verdict ;;
              esac
              printf '%-20s %-7s %-7s %-7s %-7s %-7s %-7s %-7s %s\n' \
                "$(basename "$f")" "$M" "$R" "$G" "$B" "$WM" "$WX" "$RM" "$note"
            done
          } | tee shots/index.txt
          VGA=ABSENT;    [ -f splash-vga.verdict ]    && VGA=PRESENT
          VIRTIO=ABSENT; [ -f splash-virtio.verdict ] && VIRTIO=PRESENT
          SPLASH=ABSENT
          { [ "$VGA" = PRESENT ] || [ "$VIRTIO" = PRESENT ]; } && SPLASH=PRESENT
          echo "SPLASH: $SPLASH  (VGA pass: $VGA, virtio-vga pass: $VIRTIO)"
          # A splash we did not capture is a finding to report, never a
          # reason to go red: the cause is as often boot timing under TCG
          # as it is a real regression, and a flaky gate teaches people to
          # ignore the one signal this workflow exists to produce.
          if [ "$SPLASH" = ABSENT ]; then
            echo "::warning::SPLASH ABSENT on both display devices — see the job summary and shots/splash-index.txt for which of the three causes it is"
          fi

          # WHY THIS IS IN THE SUMMARY AND NOT ONLY THE LOG. #26 has been
          # through two forensics rounds, each of which had to re-derive
          # the same facts by hand from a 14-day artifact. Three separate
          # questions decide it, so the summary answers all three:
          #   1. did a DRM driver bind in the initrd? (serial log)
          #   2. does the display device matter?      (the VGA/virtio A/B)
          #   3. what did Plymouth actually resolve?  (guest forensics)
          {
            echo "## Boot splash (#26)"
            echo
            echo "**SPLASH: $SPLASH** — \`-device VGA\` pass: **$VGA**, \`-device virtio-vga\` pass: **$VIRTIO**"
            echo
            echo "The detector looks for the 128x37 Lisa **watermark** in the"
            echo "bottom-centre of a dark frame (stock \`bgrt\`/two-step paints"
            echo "on \`BackgroundStartColor=0x000000\`), confirmed by matching"
            echo "the shipped \`watermark.png\`. It is NOT a violet test — the"
            echo "violet \`lisa\` theme was deleted in 1fec591, so the old"
            echo "gate could not have passed even a perfect capture."
            echo
            echo "### Which DRM driver bound, and when"
            echo '```'
            # The || must react to grep finding nothing, not to head (head
            # exits 0 on empty input, so `grep | head || echo` can never
            # print the fallback and an empty evidence block looks like a
            # rendering glitch instead of the finding it is).
            for log in serial.log splash-serial.log; do
              [ -f "$log" ] || continue
              echo "--- $log"
              drm=$(grep -iE "virtio_gpu|virtio-gpu|simpledrm|\[drm\]|plymouth" "$log" | head -25)
              if [ -n "$drm" ]; then echo "$drm"; else echo "(no drm/plymouth lines)"; fi
            done
            echo '```'
            echo
            echo "### Splash pass frames (\`-device VGA\`)"
            echo '```'
            if [ -f shots/splash-index.txt ]; then head -25 shots/splash-index.txt
            else echo "(the splash pass produced no index — it did not run)"; fi
            echo '```'
            echo
            echo "### Early frames (\`-device virtio-vga\`)"
            echo '```'
            grep -E '^(frame|shot-)' shots/index.txt | head -12
            echo '```'
            if [ -f splash-theme.txt ]; then
              echo
              echo "### What Plymouth resolved inside the guest"
              echo '```'
              cat splash-theme.txt
              echo '```'
            fi
            if [ "$SPLASH" = ABSENT ]; then
              echo
              echo "> No frame carried the watermark. Read the three blocks above in order:"
              echo "> **no DRM/plymouth lines at all** ⇒ the initrd module list is still"
              echo "> the problem; **one device found it and the other did not** ⇒ the"
              echo "> display device is the lever and the passing one should become the"
              echo "> default; **\`default.plymouth -> DANGLING\` or a theme that is not"
              echo "> \`bgrt\`** ⇒ the image is shipping a broken theme link and the VM is"
              echo "> only the messenger; **all three clean and every frame black** ⇒ the"
              echo "> splash window is narrower than the 1 s cadence, which is the one"
              echo "> assumption this job makes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lisa-screenshots
          path: |
            shots/
            serial.log
            splash-serial.log
            splash-theme.txt
          if-no-files-found: warn
          retention-days: 14
