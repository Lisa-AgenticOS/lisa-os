# Self-screenshotting CI (PLAN §3/§6 desktop, ADR-0017 splash). Builds
# the Track I image the same way nightly's image job does, then boots it
# GRAPHICALLY in QEMU (OVMF + systemd-boot — the REAL boot flow, splash
# included) and captures QMP screendumps of the framebuffer: Plymouth
# splash frames early, the GNOME desktop once the session is up, and —
# best-effort — the Assistant app, driven over ssh. Output: the
# `lisa-screenshots` artifact (PNGs + index) for the websites and a
# SPLASH: PRESENT/ABSENT verdict (informational, not a gate yet).
#
# Rebuilds fresh instead of downloading the nightly artifact: artifact
# download across workflows needs a run id + token plumbing and goes
# stale after 7 days; the rebuild is the same three commands nightly
# runs and always screenshots HEAD. The Assistant is NOT in this image
# (only the release build folds lisa-shell in), but the GNOME set ships
# gjs/GTK4/libadwaita/libsoup3 — so the interpreted shell tree from the
# checkout is pushed in over ssh and launched with gjs directly.

name: screenshots

on:
  workflow_dispatch:
  # Fresh desktop screenshots after every green nightly image.
  workflow_run:
    workflows: [nightly-image]
    types: [completed]

# The default token is broader than any job here needs — none of them
# call the API or push anything (release.yml is the only writer, and
# declares contents: write for its `gh release create`).
permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    # Image build ~20 min + boot-to-desktop, which under TCG fallback
    # (no /dev/kvm) can take tens of minutes on its own.
    timeout-minutes: 120
    # On workflow_run, only screenshot images that actually built.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
      - name: Expose /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "no KVM; QEMU will fall back to TCG"; fi
      # Identical to nightly.yml's image job: real Arch container so
      # mkosi uses Arch's own pacman (the Debian tools tree lacks the
      # pacman cache dir); sandbox off because pacman >= 7 cannot apply
      # it inside the container.
      - name: Build image in Arch container
        run: |
          sudo podman run --rm --privileged \
            -v "$PWD":/src -w /src docker.io/library/archlinux:latest bash -ec '
              # pacman >= 7 sandbox cannot apply inside the container
              sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              pacman -Syu --noconfirm mkosi
              mkosi --directory os/mkosi summary
              mkosi --directory os/mkosi build
            '
          # Outputs were written by root inside the container.
          sudo chown -R "$USER:" os/mkosi
      - name: Install host tools (QEMU, OVMF, ImageMagick, sshpass)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            qemu-system-x86 ovmf imagemagick sshpass >/dev/null
      # UEFI boot from disk, exactly like the ab-rollback job — so
      # systemd-boot runs and the baked cmdline (`quiet splash`,
      # ADR-0017) engages Plymouth on the virtio-vga framebuffer.
      # -display none still renders into the device; QMP `screendump`
      # reads the framebuffer headlessly. Serial output goes to a file
      # (the baked console=ttyS0 keeps the framebuffer clean for the
      # splash AND gives us a boot log for the artifact). User-net
      # hostfwd 2222->22 lets the runner ssh in (sshd enabled by the
      # image preset; provisional lisa/lisa password auth per STATUS).
      - name: Boot graphically + capture screendump timeline
        run: |
          set -o pipefail
          mkdir -p shots
          # One QMP command per connection: QMP allows a single client,
          # and reconnecting per call keeps every dump independent.
          cat > qmp.py <<'EOF'
          #!/usr/bin/env python3
          """qmp.py <command> [screendump-filename] — one QMP command per run."""
          import json, socket, sys

          cmd = sys.argv[1]
          args = {"filename": sys.argv[2]} if cmd == "screendump" else {}
          s = socket.socket(socket.AF_UNIX)
          s.settimeout(60)
          s.connect("qmp.sock")
          f = s.makefile("rw")
          json.loads(f.readline())  # server greeting
          for payload in ({"execute": "qmp_capabilities"},
                          {"execute": cmd,
                           **({"arguments": args} if args else {})}):
              f.write(json.dumps(payload) + "\n")
              f.flush()
              while True:  # skip async events between command and reply
                  try:
                      resp = json.loads(f.readline())
                  except (json.JSONDecodeError, OSError):
                      if cmd == "quit":  # QEMU may close mid-reply
                          sys.exit(0)
                      raise
                  if "return" in resp:
                      break
                  if "error" in resp:
                      sys.exit(f"QMP {cmd} failed: {resp['error']}")
          EOF
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          qemu-system-x86_64 \
            -machine q35 -accel kvm -accel tcg -m 4G \
            -display none -device virtio-vga \
            -serial file:serial.log \
            -qmp unix:qmp.sock,server=on,wait=off \
            -netdev user,id=net0,hostfwd=tcp::2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=os/mkosi/lisa.raw,format=raw,if=virtio &
          QEMU_PID=$!
          for _ in $(seq 1 30); do [ -S qmp.sock ] && break; sleep 1; done
          if [ ! -S qmp.sock ]; then
            echo "::error::QEMU never opened its QMP socket — it likely failed to start; see step output above"
            exit 1
          fi

          # Phase 1 — early boot, dense cadence (2s for 40s, then 10s to
          # ~100s). Run-1 lesson: under KVM a 10s cadence boots straight
          # past the early phase. Run-2 lesson: even at 2s the framebuffer
          # is BLACK through the initrd — Plymouth's units run (serial log)
          # but its painting never reaches the captured scanout in this VM.
          # ADR-0025 landed the first half of the suspected fix: `virtio_gpu`
          # now rides KernelInitrdModules=, so a real DRM driver — not just
          # the builtin simpledrm on the EFI GOP — drives virtio-vga during
          # the initrd. If these frames are still black, the remaining lever
          # is the display device (`-device VGA`). Issue #26.
          sleep 3
          n=0
          for _ in $(seq 1 20); do
            python3 qmp.py screendump "$PWD/shots/shot-$(printf '%02d' "$n").ppm" \
              || echo "::warning::early frame $n failed (framebuffer not ready?)"
            n=$((n+1)); sleep 2
          done
          for _ in $(seq 1 6); do
            python3 qmp.py screendump "$PWD/shots/shot-$(printf '%02d' "$n").ppm" \
              || echo "::warning::early frame $n failed"
            n=$((n+1)); sleep 10
          done
          echo "early-boot frames captured"

          # Phase 2 — wait for the desktop. First sshd (proves boot +
          # network), then the GNOME Wayland socket of the autologin
          # session (proves the shell is up). Generous budgets: TCG.
          ssh_guest() {
            sshpass -p lisa ssh -p 2222 -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
              -o LogLevel=ERROR lisa@127.0.0.1 "$@"
          }
          up=""
          for _ in $(seq 1 100); do  # <= ~25 min
            if ssh_guest true 2>/dev/null; then up=1; break; fi
            sleep 15
          done
          if [ -z "$up" ]; then
            echo "::error::guest sshd never answered on 2222 — boot or user-net failed; serial.log tail follows"
            tail -50 serial.log || true
            python3 qmp.py screendump "$PWD/shots/timeout.ppm" || true
            python3 qmp.py quit || true
            exit 1
          fi
          echo "sshd is up"
          session=""
          for _ in $(seq 1 40); do  # <= ~10 min
            if ssh_guest 'test -S /run/user/1000/wayland-0' 2>/dev/null; then session=1; break; fi
            sleep 15
          done
          if [ -z "$session" ]; then
            echo "::error::GNOME session socket (wayland-0) never appeared for the autologin user"
            python3 qmp.py screendump "$PWD/shots/no-session.ppm" || true
            python3 qmp.py quit || true
            exit 1
          fi
          sleep 45  # let the shell finish drawing (settle, esp. TCG)
          python3 qmp.py screendump "$PWD/shots/desktop.ppm"
          echo "desktop frame captured"

          # Phase 3 — the Assistant, best-effort: push the interpreted
          # shell tree from this checkout (the image itself carries no
          # lisa-shell; see header) and launch it inside the session via
          # the user manager with the session env. Failure warns, never
          # fails the job — splash + desktop are the primary product.
          if tar -C shell -cz --exclude='*/tests' --exclude='testing' . \
               | ssh_guest 'mkdir -p /tmp/lisa-shell && tar -xz -C /tmp/lisa-shell' \
             && ssh_guest 'export XDG_RUNTIME_DIR=/run/user/1000; \
                  systemd-run --user --unit=lisa-assistant-shot \
                    --setenv=WAYLAND_DISPLAY=wayland-0 \
                    --setenv=XDG_RUNTIME_DIR=/run/user/1000 \
                    gjs -m /tmp/lisa-shell/assistant/lisa-assistant.js'
          then
            sleep 60  # window map + first paint (generous for TCG)
            python3 qmp.py screendump "$PWD/shots/assistant.ppm"
            echo "assistant frame captured"
          else
            echo "::warning::Assistant launch failed (daemon-less nightly image; see serial.log / journal) — no assistant.ppm this run"
          fi

          python3 qmp.py quit || true
          wait "$QEMU_PID" || true
      # PPM -> PNG, per-frame brightness index, and the splash verdict.
      # Heuristic: the Plymouth theme is violet (#6D45C9 — blue channel
      # well above green) on a dark background, while firmware/console
      # frames are black or grey (r≈g≈b). An early frame with visible
      # content (mean > 0.02) whose blue mean leads green by >15% reads
      # as the splash. Informational only — printed, never a failure.
      - name: Convert frames + splash verdict
        run: |
          set -o pipefail
          shopt -s nullglob
          for f in shots/*.ppm; do
            convert "$f" "${f%.ppm}.png" && rm "$f"
          done
          pngs=(shots/*.png)
          if [ "${#pngs[@]}" -eq 0 ]; then
            echo "::error::no frames were captured at all"
            exit 1
          fi
          # The verdict is decided inside a `{ ... } | tee` pipeline, i.e. a
          # SUBSHELL — a plain SPLASH=PRESENT there is discarded on exit and
          # the summary below always printed ABSENT, however violet the
          # frames were. Carry it out through a file instead.
          rm -f splash.verdict
          {
            echo "frame                mean    r       g       b       note"
            for f in "${pngs[@]}"; do
              stats=$(identify -format '%[fx:mean] %[fx:mean.r] %[fx:mean.g] %[fx:mean.b]' "$f") \
                || { echo "$(basename "$f")  (identify failed — corrupt frame?)"; continue; }
              read -r M R G B <<<"$stats"
              note=black
              awk -v m="$M" 'BEGIN{exit !(m>0.01)}' && note=content
              case "$f" in shots/shot-*)
                # Lisa's Plymouth theme is #6D45C9: r=109, g=69, b=201.
                # BOTH blue and red exceed green, and #26's acceptance
                # says so in as many words — "a genuinely r>g frame".
                # The test used to check blue alone, which any plain-blue
                # frame passes; a verdict looser than its own acceptance
                # is a verdict that can report PRESENT for the wrong
                # pixels.
                if awk -v m="$M" -v r="$R" -v g="$G" -v b="$B" \
                     'BEGIN{exit !(m>0.02 && b>g*1.15 && r>g)}'; then
                  note=violet-splash; echo PRESENT > splash.verdict
                fi ;;
              esac
              printf '%-20s %-7.4f %-7.4f %-7.4f %-7.4f %s\n' \
                "$(basename "$f")" "$M" "$R" "$G" "$B" "$note"
            done
          } | tee shots/index.txt
          SPLASH=ABSENT
          [ -f splash.verdict ] && SPLASH=$(cat splash.verdict)
          echo "SPLASH: $SPLASH"

          # WHY THIS IS IN THE SUMMARY AND NOT ONLY THE LOG. #26 has been
          # through two forensics rounds, each of which had to re-derive
          # the same facts by hand from a 14-day artifact. The remaining
          # decision — keep `-device virtio-vga` or fall back to plain
          # `-device VGA` so simpledrm binds — turns on ONE question: did
          # a real DRM driver bind during the initrd, now that
          # `virtio_gpu` rides KernelInitrdModules=? The serial log
          # answers it and nothing was reading the answer out.
          {
            echo "## Boot splash (#26)"
            echo
            echo "**SPLASH: $SPLASH** — display device: \`virtio-vga\`"
            echo
            echo "### Which DRM driver bound, and when"
            echo '```'
            grep -iE "virtio_gpu|virtio-gpu|simpledrm|\[drm\]|plymouth" serial.log \
              | head -40 || echo "(no drm/plymouth lines in serial.log)"
            echo '```'
            echo
            echo "### Early frames"
            echo '```'
            head -12 shots/index.txt
            echo '```'
            if [ "$SPLASH" = ABSENT ]; then
              echo
              echo "> Every early frame is black. If the lines above show"
              echo "> \`virtio_gpu\` binding, the module is not the problem and"
              echo "> the next lever is \`-device VGA\` (simpledrm binds its"
              echo "> framebuffer). If they show no DRM driver at all, the"
              echo "> initrd module list is still the problem."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lisa-screenshots
          path: |
            shots/
            serial.log
          if-no-files-found: warn
          retention-days: 14
