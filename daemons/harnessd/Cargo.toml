[package]
name = "lisa-harnessd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
forge-harness = { version = "0.1.0", path = "../../libs/forge-harness" }
bus-tools = { version = "0.1.0", path = "../../libs/bus-tools" }
harness-core = { version = "0.1.0", path = "../../libs/harness-core" }
lisa-ledger = { version = "0.1.0", path = "../../libs/lisa-ledger" }
lisa-peer = { version = "0.1.0", path = "../../libs/lisa-peer" }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.18.0", features = ["p2p", "tokio", "blocking-api"], default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
