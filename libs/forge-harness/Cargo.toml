[package]
name = "forge-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
harness-core = { version = "0.1.0", path = "../harness-core" }
blake3 = "1.8.5"
lisa-guard = { path = "../lisa-guard" }
lisa-ledger = { version = "0.1.0", path = "../lisa-ledger" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
ureq = { version = "3.3.0", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"

# Landlock (ADR-0029 phase 3, #53) — Linux only. An unprivileged kernel
# LSM, so the confinement needs no root and no container; on every other
# host the module reports "unavailable" and the subprocess runs
# unconfined, which the caller is told.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
