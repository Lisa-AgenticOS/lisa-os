<?xml version="1.0" encoding="UTF-8"?>
<!-- Mail app icon. Brand tokens only: violet-700 #4F378B, violet-500
     #6D45C9, violet-300 #9B7BE8, warm-white #FFF1E9, line-200 #E7DED8,
     dark-base #1B1917. -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D45C9"/>
      <stop offset="1" stop-color="#4F378B"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1E9"/>
      <stop offset="1" stop-color="#E7DED8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="squircle">
      <rect x="16" y="16" width="480" height="480" rx="118"/>
    </clipPath>
    <clipPath id="envelope">
      <rect x="96" y="150" width="320" height="222" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="16" y="16" width="480" height="480" fill="url(#bg)"/>
    <path d="M -40 400 Q 256 290 552 410 L 552 512 L -40 512 Z"
          fill="#9B7BE8" opacity="0.10"/>
  </g>

  <!-- envelope shadow -->
  <rect x="102" y="172" width="308" height="210" rx="26"
        fill="#1B1917" opacity="0.35" filter="url(#soft)"/>

  <!-- envelope body -->
  <rect x="96" y="150" width="320" height="222" rx="26"
        fill="url(#paper)" stroke="#4F378B" stroke-width="8"/>

  <g clip-path="url(#envelope)">
    <!-- back flap, folded down -->
    <path d="M 88 150 L 256 292 L 424 150"
          fill="none" stroke="#6D45C9" stroke-width="16"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- bottom fold creases -->
    <path d="M 96 382 L 224 268" fill="none" stroke="#6D45C9"
          stroke-width="10" opacity="0.35" stroke-linecap="round"/>
    <path d="M 416 382 L 288 268" fill="none" stroke="#6D45C9"
          stroke-width="10" opacity="0.35" stroke-linecap="round"/>
  </g>
</svg>
