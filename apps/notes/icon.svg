<?xml version="1.0" encoding="UTF-8"?>
<!-- Notes' app icon, inside the app rather than in hicolor.
     Colours are branding/tokens.json values: violet-500 #6D45C9,
     violet-700 #4F378B, warm-white #FFF1E9, ink-700 #4A423D. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D45C9"/>
      <stop offset="1" stop-color="#4F378B"/>
    </linearGradient>
  </defs>
  <!-- Squircle at the brand corner radius, matching Surfer's mask. -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#g)"/>
  <!-- A sheet of paper, lifted off the ground. -->
  <rect x="32" y="26" width="64" height="80" rx="8" fill="#FFF1E9"/>
  <!-- Ruled lines. The last is short, the way a real note ends. -->
  <g fill="#4A423D" opacity="0.55">
    <rect x="44" y="46" width="40" height="5" rx="2.5"/>
    <rect x="44" y="60" width="40" height="5" rx="2.5"/>
    <rect x="44" y="74" width="40" height="5" rx="2.5"/>
    <rect x="44" y="88" width="22" height="5" rx="2.5"/>
  </g>
</svg>
