# aarch64 lane (ADR-0021): the same Lisa image on an Arch Linux ARM base.
# Matches when the build targets arm64 — natively on an arm64 build host,
# or via `mkosi --architecture=arm64` (the aarch64-image.yml CI job passes
# it explicitly). The x86_64 lane never sees this file.
#
# No Mirror= override: mkosi >= 25 natively targets Arch Linux ARM when
# Distribution=arch resolves to an arm architecture — it defaults the
# mirror to http://mirror.archlinuxarm.org with ALARM's $arch/$repo repo
# layout and appends the `alarm` repo after core/extra (verified from
# the mkosi 25.3/26 source, mkosi/distributions/arch.py `repositories()`,
# and exercised by a full local build in the ALARM container).

[Match]
Architecture=arm64

[Build]
# No bootstrapped tools tree on arm64: mkosi's *default tools tree*
# package list hardcodes dnf5 and edk2-ovmf, neither of which exists on
# ALARM (verified 2026-07-25 — the tools-tree pacman run dies on "target
# not found"). The arm64 build therefore runs with the host's own tools:
# the aarch64-image.yml container installs what the build needs (pacman
# is native there). An empty assignment resets the shared
# ToolsTree=default from mkosi.conf.
ToolsTree=

[Content]
Packages=
        # ALARM's multi-platform AArch64 kernel. There is no `linux`
        # package on ALARM (verified against mirror.archlinuxarm.org
        # 2026-07-25); every other package in mkosi.conf's list exists
        # on ALARM under the same name.
        linux-aarch64
# Append the PL011 serial console for `-machine virt` guests (QEMU/UTM —
# the first aarch64 boot target). KernelCommandLine= is append-only, so
# the shared `console=ttyS0` stays; on hardware without an 8250 UART it
# is inert, and the last console= wins /dev/console. The CI boot-check
# supplies its own -append and never reads this line (same as x86_64).
KernelCommandLine=console=ttyAMA0
