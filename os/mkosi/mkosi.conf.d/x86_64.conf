# x86_64 lane (the default/nightly lane, ADR-0021). Only the kernel
# package lives here: Packages= is append-only across drop-ins, so the
# per-arch kernel name cannot sit in the shared mkosi.conf. The resolved
# x86_64 package set is identical to what mkosi.conf carried before this
# split.

[Match]
Architecture=x86-64

[Content]
Packages=
        linux
        # Lisa Desktop, from the [lisa] index (ADR-0038, ADR-0039 step 4).
        # Here and not in the shared mkosi.conf because the package is
        # arch=(x86_64) — the only architecture the fork has ever been
        # built on. Widening it is a build, not an edit (see the
        # lisa-desktop PKGBUILD's arch= line). It provides=(gnome-shell)
        # and conflicts=(gnome-shell), so stock GNOME Shell is not in
        # this image and every dependency on the name resolves here.
        lisa-desktop-shell
