# x86_64 lane (the default/nightly lane, ADR-0021). Only the kernel
# package lives here: Packages= is append-only across drop-ins, so the
# per-arch kernel name cannot sit in the shared mkosi.conf. The resolved
# x86_64 package set is identical to what mkosi.conf carried before this
# split.

[Match]
Architecture=x86-64

[Content]
Packages=
        linux
