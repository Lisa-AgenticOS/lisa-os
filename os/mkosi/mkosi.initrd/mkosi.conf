# Lisa initrd overlay (ADR-0017). mkosi builds the Track I image's initrd
# from this directory when present, extending the default mkosi-initrd.
#
# Purpose: carry Plymouth *and the lisa theme* in the initrd so the violet
# Lisa splash appears from the earliest boot stage — right after the Mac's
# Apple logo — instead of only at sysinit.target in the rooted system, which
# left a long black window on the field iMac ("looks powered off"). The theme
# ships alongside (mkosi.extra), so this is never the theme-less default flash
# the earlier design avoided. simpledrm (KernelModulesInitrdInclude in the
# parent mkosi.conf) gives Plymouth the EFI framebuffer with no firmware blob;
# amdgpu takes over later in the rooted system.
[Content]
# util-linux: sfdisk for the lisa-loader-disk udev helper (issue #16 —
# it reads the GPT directly to spot the boot loader's disk).
Packages=plymouth
         util-linux
# THE MODULE LIST MUST LIVE HERE, NOT IN THE PARENT mkosi.conf: with this
# custom initrd config present, mkosi builds the initrd from THIS file,
# and the parent's KernelModulesInitrdInclude never applies. v26-v29
# shipped initrds with ZERO storage/HID modules because of exactly that —
# firmware loads the UKI from a USB stick, then Linux cannot see the
# stick (or any USB keyboard at a rescue prompt). Field-found on the
# iMac, 2026-07-25. sd_mod/uas matter: usb_storage without the SCSI disk
# driver never yields /dev/sd*.
KernelModulesInitrdInclude=
        btrfs
        vfat
        usbhid
        hid_generic
        hid_apple
        xhci_pci
        xhci_hcd
        ehci_pci
        uhci_hcd
        usb_storage
        uas
        sd_mod
        nvme
        ahci
        simpledrm
