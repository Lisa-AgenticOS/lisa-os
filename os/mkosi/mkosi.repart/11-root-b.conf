# Root slot B: empty at build, filled by systemd-sysupdate with the next
# version's root image. The "_empty" label is sysupdate's convention for
# an available slot. Unformatted on purpose — the update writes a
# complete filesystem image over it.
# 10G to match 10-root.conf EXACTLY — the update is a byte image of the A
# slot, so a mismatch here is not a size difference, it is a corrupt
# install. check-repart-slots.py enforces that in `just lint`. See that
# file for why 10G and not 7G (ADR-0023 phase 3, tried and reverted).
[Partition]
Type=root
Label=_empty
SizeMinBytes=10G
SizeMaxBytes=10G
