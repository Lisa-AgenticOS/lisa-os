# Root slot A (ADR-0001 A/B layout). Fixed size so the B slot can hold a
# byte-identical partition image; label carries the sysupdate version
# (root_@v pattern in /etc/sysupdate.d). dm-verity hash partitions are
# the next step after the sysupdate flow is proven.
#
# 10G. MUST match 11-root-b.conf — sysupdate writes this slot's byte
# image into the other. Whole layout (1G ESP + 2x10G root + >=2G var) =
# 23 GiB min, inside the smallest field target disk (28,000,002,048
# bytes ~= 26 GiB); needs a 32 GB stick.
#
# ADR-0023 PHASE 3 WAS TRIED AT 7G ON 2026-08-02 AND REVERTED. Keeping
# the whole account here, because the trap is subtle and the next person
# to try will reach for the same wrong number.
#
# The argument for 7G was release.yml's job-summary measurement:
#
#     populated root: 4542 MiB (/opt/zen: 364 MiB)
#
# 4.4 GiB in a 7 GiB slot looks like 2.5 GiB of headroom. The build says
# otherwise (nightly run 30744614158):
#
#     Filesystem size:  8.45GiB
#       Data: single    5.41GiB
#       Metadata: DUP   256.00MiB
#       Shrink:         no
#     Partition 1's contents (8.4G) don't fit in the partition (7G).
#
# TWO DIFFERENT QUANTITIES WEAR THE SAME NAME. `du -sxm` on a mounted
# root reports the bytes of files. repart asks `mkfs.btrfs --rootdir` to
# build the filesystem and then checks whether THAT fits — and btrfs
# without `--shrink` allocates generously: 5.41 GiB of data became an
# 8.45 GiB filesystem. The number that governs the slot size is the
# second one, and it is roughly 1.6x the first.
#
# So the payload is not the constraint and removing more of it will not
# help — Zen leaving the image (#89) freed 363 MiB against a ~3 GiB gap.
# What would actually move this is making btrfs build a tight filesystem
# (`mkfs.btrfs --rootdir --shrink`, which repart does not currently pass)
# or accepting ~9G slots. Either needs its own experiment against BOTH
# lanes, since the release image carries more than this one.
#
# Change this number from a "contents (X)" line in a build log, never
# from a `du` figure. And remember an existing A/B disk cannot shrink in
# place — a shrink forces a re-flash, exactly as the 8->10 bump did.
[Partition]
Type=root
Format=btrfs
CopyFiles=/
Label=root_1
SizeMinBytes=10G
SizeMaxBytes=10G
