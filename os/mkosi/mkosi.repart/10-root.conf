# Root slot A (ADR-0001 A/B layout). Fixed size so the B slot can hold a
# byte-identical partition image; label carries the sysupdate version
# (root_@v pattern in /etc/sysupdate.d). dm-verity hash partitions are
# the next step after the sysupdate flow is proven.
#
# 7G (was 10G, was 8G) — ADR-0023 phase 3, the slot shrink, 2026-08-02.
# MUST match 11-root-b.conf: sysupdate writes this slot's byte image into
# the other one.
#
# THE NUMBER COMES FROM A MEASUREMENT, which is the whole point of this
# phase. release.yml prints the populated root in every release's job
# summary; run 30674396878 said:
#
#     populated root: 4542 MiB (/opt/zen: 364 MiB)
#
# Zen has since left the image (#89, phase 1 complete) and the rootless
# container runtime arrived (#130), so today's payload is roughly 4.3
# GiB. Against a 7 GiB slot that is ~60% full with ~2.7 GiB of headroom
# — proportionally more slack than the 10G slot ever had.
#
# The comment that used to be here said phase 3 "is NOT yet actionable"
# because "the populated root goes ~8.3 -> ~7.9 GiB and the 7G target
# does not fit". Every number in that sentence was inferred from the
# 8->10 GiB bump rather than measured, and the bump was caused by a BUILD
# running out of room mid-write — not the size of a finished root. It is
# deleted here as well as in the ADR: an estimate quoted twice is how it
# becomes a fact.
#
# Whole layout: 1G ESP + 2x7G root + >=2G var = 17 GiB (was 23), now
# comfortably inside the smallest field target disk (28,000,002,048 bytes
# ~= 26 GiB) instead of needing a 32 GB stick.
#
# EXISTING DISKS DO NOT SHRINK. repart sizes apply to fresh installs
# only; a device already carrying 10G slots keeps them, and that
# direction is safe — a 7 GiB root image written into a 10 GiB slot fits,
# and the growfs attribute (GPT bit 59, which every Lisa root partition
# already carries) expands the filesystem to the partition. The reverse
# would NOT be safe, so slots must never grow again without a re-flash,
# exactly as the 8->10 bump forced one.
[Partition]
Type=root
Format=btrfs
CopyFiles=/
Label=root_1
SizeMinBytes=7G
SizeMaxBytes=7G
