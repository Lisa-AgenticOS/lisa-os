# The [lisa] package index, as the image build's pacman sees it
# (ADR-0039 step 4 — "the image consumes [lisa]").
#
# HOW THIS IS REACHED, because "a config file in a directory" is exactly
# the kind of thing that can be inert and look installed (#241):
#
#   mkosi copies mkosi.pkgmngr/ into its package-manager sandbox tree
#   (mkosi/config.py: the sandbox_trees setting, path_suffixes "sandbox"
#   and "pkgmngr"), and mkosi/installer/pacman.py writes
#
#       Include = /etc/pacman.d/*.conf
#
#   into the pacman.conf it generates — but ONLY if that directory
#   contains at least one *.conf. This file is that .conf.
#
# There is no silent failure mode here. If the tree is not picked up,
# this repo is not configured, and `lisa-desktop-shell` in mkosi.conf's
# Packages= is a target pacman cannot find — the build stops. A missing
# desktop is not something the image can ship without noticing.
#
# ORDERING. mkosi writes `Include = /etc/mkosi-local.conf` first, so a
# locally built package (release.yml's PackageDirectories=) still wins
# over this index; then this file; then core/extra. That is the
# precedence os/packages/gnome-control-center-lisa/PKGBUILD relies on
# and it is unchanged.
#
# ADR-0034. The install/update/recovery paths may take no dependency we
# do not control — and this is ours: our packages, our index, our
# signing key, published to the same GitHub release infrastructure
# `lisa update` already downloads images from. What ADR-0034 forbids is
# a third-party package manager in those paths; this is the opposite.
# If GitHub is unreachable the IMAGE BUILD fails, loudly, in CI. No
# installed device is affected: an existing slot keeps working and
# sysupdate simply finds nothing to stage.
#
# SigLevel. The index and its packages ARE signed (key "Lisa OS Package
# Signing", fingerprint 737240D11D28E109A474A8E5827E27417AF5982B), but
# the key is not in this sandbox's pacman keyring, and mkosi's generated
# [options] sets `SigLevel = Required DatabaseOptional` globally. Until
# the trust anchor is in the keyring the build uses, this repo has to
# opt out — the same `Optional TrustAll` line lisa-packages' README
# gives every consumer today. Flipping it to Required is the tail of
# ADR-0039/ADR-0041 and needs lisa-keyring installed in the sandbox, not
# just in the image (where it already ships).
[lisa]
SigLevel = Optional TrustAll
Server = https://github.com/Lisa-AgenticOS/lisa-packages/releases/download/current
