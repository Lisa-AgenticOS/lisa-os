# Lisa OS image profile (Track I, ADR-0001). M0 target: boots in QEMU via
# `just vm` with A/B update + rollback demonstrated (PLAN §10).
#
# Build on Linux only: `mkosi --directory os/mkosi build` (CI's job —
# .github/workflows/nightly.yml). The pinned Arch snapshot mirror
# (os/repo-tools) replaces the default mirrors before beta.

[Distribution]
Distribution=arch

[Build]
# Bootstrap a pacman-capable tools tree so the image builds on any host
# distro (CI runs on Ubuntu runners).
ToolsTree=default

[Output]
Format=disk
ImageId=lisa
# Baked into /usr/lib/os-release as IMAGE_VERSION= (release.yml rewrites the
# "1" to the real YYYYMMDD.run version). systemd-sysupdate reads this to
# determine the installed version; without it, `lisa update --reboot` errors
# with "/etc/os-release lacks IMAGE_VERSION= field" and never reboots.
ImageVersion=1
Output=lisa

[Content]
Bootable=yes
Hostname=lisa
# Bake timezone/locale/keymap so systemd-firstboot has nothing to prompt.
# Without these, first boot stops at an interactive "select timezone"
# question on the console before gdm — a default of the image, not
# something the user set. These are changeable later in GNOME Settings ›
# Date & Time / Region (or edit these lines + rebuild). Timezone follows
# the field device's locale (Europe/Tirane); UTC is the neutral fallback.
Timezone=Europe/Tirane
Locale=en_US.UTF-8
Keymap=us
# Find root deterministically by the GPT partition label repart sets
# (Label=root_1; release builds bump it to root_<ver> and keep this in
# sync). gpt-auto-root is unreliable on real hardware with other disks
# present — an explicit PARTLABEL always resolves. `rw` for btrfs.
# Boot splash (PLAN §3/§6): `quiet splash` engages Plymouth (the `lisa`
# theme, violet + wordmark) and keeps the framebuffer free of kernel/unit
# text — the Mac shows the Apple logo, then the Lisa splash, then GDM. No
# scrolling console. `console=ttyS0` routes ALL kernel/systemd output to
# the serial line instead of tty0, so (a) the framebuffer stays clean for
# Plymouth on the real display, and (b) CI keeps a serial log — though the
# CI boot-check supplies its OWN `-append` (nightly.yml/release.yml) and
# never reads this line, so it is unaffected either way. A boot hang is no
# longer photographable on-screen; it is instead captured by
# lisa-boot-report.service dumping the journal to the ESP (postinst).
# Plymouth degrades to a blank/text screen if it fails — it never blocks
# boot.
# systemd.gpt_auto=no: gpt-auto's fstab-defer races the fstab-generator, and
# when gpt-auto wins it mounts /var by a machine-id-derived UUID no partition
# has → emergency mode on updated slots (ADR-0018 forensics). Everything it
# provided is explicit: root= here, /var + /home + /efi in the baked fstab.
KernelCommandLine=root=PARTLABEL=root_1 rw quiet splash console=ttyS0 systemd.gpt_auto=no
# Initrd must mount btrfs root AND drive input on bare metal — without
# USB HID here, a rescue prompt has no keyboard (Apple wired keyboards
# included). Broad USB/HID + storage set keeps unknown hardware bootable.
# The option name matters: the current mkosi INI name is
# KernelInitrdModules= (CLI --kernel-modules-initrd-include=). The old
# KernelModulesInitrdInclude= spelling produced initrds with ZERO
# modules on v26-v29 — every USB boot dead (issue #46). These modules
# ride the extra kernel-modules initrd mkosi appends at UKI assembly.
KernelInitrdModules=
        btrfs
        usbhid
        hid_generic
        hid_apple
        xhci_pci
        xhci_hcd
        ehci_pci
        uhci_hcd
        usb_storage
        uas
        sd_mod
        vfat
        nvme
        ahci
        # --- Display for the early Plymouth splash (ADR-0017/ADR-0025) ---
        # The native GPU driver + its firmware, in the initrd — the way
        # Ubuntu gets a splash at native resolution the instant the
        # firmware logo goes away. ADR-0017 shipped simpledrm only and the
        # field iMac18,2 (Radeon Pro 560, Polaris11/Baffin) still showed a
        # BLACK screen from the Apple logo to GDM on every boot.
        #
        # mkosi resolves the module *and firmware* dependencies of every
        # module matched here (mkosi/kmod.py resolve_module_dependencies +
        # filter_firmware; mkosi.1 "Firmware dependencies of kernel modules
        # installed in the image are automatically included"), so amdgpu
        # drags in its modinfo depends= set (drm_display_helper, ttm,
        # amdxcp, gpu-sched, drm_exec, drm_buddy, drm_ttm_helper,
        # drm_suballoc_helper, drm_panel_backlight_quirks, cec, video,
        # i2c-algo-bit) and the amdgpu/*.bin blobs it declares. Nothing
        # else needs listing, and FirmwareFiles= is deliberately NOT set:
        # that setting also drives the image-wide firmware pruning in
        # mkosi's run_depmod(), which would delete every firmware file no
        # module declares — e.g. the brcm/*.hcd Bluetooth blobs (btbcm and
        # btusb declare zero MODULE_FIRMWARE), silently breaking the
        # iMac's Bluetooth. Trading ~36 MB of ESP for that is not a trade.
        amdgpu
        # Same job in QEMU, where the display is `-device virtio-vga`
        # (screenshots.yml): give Plymouth a real DRM driver in the VM too.
        # ~50 KB, no firmware. Groundwork for issue #26.
        virtio_gpu
        # simpledrm: a NO-OP on Arch's kernel today — modules.builtin lists
        # kernel/drivers/gpu/drm/sysfb/simpledrm.ko (as it does drm.ko and
        # drm_kms_helper.ko), so this glob matches no .ko and adds nothing;
        # the EFI GOP framebuffer is already there, built in. Kept so that
        # a future kernel which modularizes it still lands it here.
        simpledrm
# --- The default initrd's own content (issue #50, ADR-0028) ---
# mkosi 26 builds the default initrd as an internal sub-image configured
# ONLY from its bundled mkosi-initrd resources plus the settings below
# (mkosi/config.py:finalize_default_initrd). A `mkosi.initrd/` directory
# next to this file is read by NOTHING — the one this repo carried was
# inert from the day it was written, which is why ADR-0017's splash
# config and ADR-0022's rescue resolver never shipped. These are the
# knobs that actually reach that sub-image; extra *files* go through
# mkosi.finalize + initrd-overlay/ (see that script).
#
# InitrdProfiles=plymouth is mkosi's own purpose-built switch for a
# graphical initrd (mkosi/resources/mkosi-initrd/mkosi.profiles/plymouth
# — it adds Packages=plymouth). It replaces the dead
# `mkosi.initrd/mkosi.conf` that meant to do this. The theme,
# plymouthd.conf and the plymouth-start symlink ride in via the overlay,
# so this is never the theme-less flash ADR-0017 set out to avoid.
# `util-linux` (sfdisk, for the lisa-loader-disk udev helper) needs no
# line here: mkosi's own Arch drop-in already installs it in the initrd.
InitrdProfiles=plymouth
# The kernel package is per-architecture (Packages= is append-only across
# drop-ins, so the arch-specific name cannot live here): `linux` on x86_64,
# `linux-aarch64` on Arch Linux ARM — see mkosi.conf.d/ (ADR-0021).
Packages=
        base
        linux-firmware
        # Arch splits linux-firmware into per-vendor subpackages; name the
        # ones field hardware needs so a change in the meta package's
        # dependency set can never silently drop them. First field target
        # is an iMac18,2: Radeon Pro 560 (amdgpu — no blob, no display)
        # and BCM43602 Wi-Fi (brcmfmac).
        linux-firmware-amdgpu
        linux-firmware-broadcom
        systemd
        systemd-ukify
        # The download half of systemd-sysupdate. `systemd-pull` does not
        # link libcurl — it dlopen()s "libcurl.so.4" at runtime and turns
        # ANY dlopen failure into EOPNOTSUPP (systemd
        # src/basic/dlfcn-util.c:dlopen_verbose →
        # src/shared/curl-util.c:curl_glue_new → src/import/pull.c
        # raw_pull_new), which surfaces as exactly
        # "Failed to allocate puller: Operation not supported" — issue #45's
        # signature. Arch ships libcurl only as an OPTIONAL dependency of
        # systemd ("curl: systemd-journal-upload, machinectl pull-tar and
        # pull-raw"), so it lands in the image today purely because
        # networkmanager happens to depend on it. The ability of the OS to
        # update itself must not ride on an unrelated package's dependency
        # list; name it here and let the nightly assert it.
        curl
        # TLS trust store for the HTTPS release channel the shipped
        # /usr/lib/sysupdate.d/*.transfer files pull from. A curl dependency
        # today — declared for the same reason.
        ca-certificates
        # Graphical boot splash (PLAN §3/§6). Ships plymouthd + the
        # plymouth-quit*/read-write units that hand the framebuffer to GDM,
        # and renders the `lisa` theme (mkosi.extra/.../themes/lisa). Present
        # in the rooted system; plymouth-start is wired into sysinit.target
        # via mkosi.extra so the splash comes up even though mkosi's own
        # initrd does not carry Plymouth (see README "Boot splash").
        plymouth
        btrfs-progs
        iwd
        # Bluetooth stack + bluetoothctl for pairing Apple Magic input
        # devices (USB HID needs nothing extra; hid_apple is in-kernel).
        bluez
        bluez-utils
        sudo
        vim
        # SSH server: a headless field device must be reachable without a
        # keyboard-at-the-console. Enabled by the preset; password auth
        # against the provisional lisa/lisa account until the M7 OOBE and
        # key-based access land.
        openssh
        # --- GNOME desktop session (PLAN §3 "Desktop environment
        # strategy": GNOME base, patched not forked; the M4 §5.7
        # surfaces ride on it as Shell extensions). Deliberately NOT
        # the `gnome` group — every name below earns its place.
        # Display manager; autologin config in mkosi.extra/etc/gdm.
        gdm
        # The compositor/shell the §5.7 extensions load into (GNOME 46+
        # ESM). Pulls mutter, gjs, gnome-settings-daemon, gtk4.
        gnome-shell
        gnome-session
        # Terminal in the desktop (§5.8: `lisa` CLI preinstalled needs
        # a terminal to live in; gnome-console is GNOME's minimal one).
        gnome-console
        # Settings app — the field iMac had no way to open Settings
        # (gnome-shell alone ships no control-center). Network, display,
        # sound, and the Intelligence panel (§5.5) will live here.
        gnome-control-center
        # Portals are the trust boundary (§5.5); the GNOME backend +
        # the GTK fallback (file chooser et al.) make portal calls real
        # in the session instead of hanging.
        xdg-desktop-portal-gnome
        xdg-desktop-portal-gtk
        # GL/EGL drivers — mutter needs a renderer: radeonsi for the
        # iMac18,2's Radeon Pro 560, llvmpipe fallback in QEMU/CI.
        mesa
        # X11 apps under the Wayland session (gnome-shell optdepends).
        xorg-xwayland
        # Fonts: GNOME's UI face + broad text coverage (incl. Noto Sans
        # Mono for gnome-console). Without any font the shell renders
        # boxes. CJK variants deferred (size).
        cantarell-fonts
        noto-fonts
        # PipeWire session manager: pulls pipewire and makes it start;
        # mutter/portal ScreenCast (§5.7.4 groundwork) and audio need a
        # running session manager, not just the libraries.
        wireplumber
        # alsa-utils: speaker-test/aplay/amixer — the only way to prove
        # sound at the driver layer, below PipeWire. Issue #44 was
        # precisely a case where every session-level indicator was green
        # and the hardware was mute; without these there is no way to
        # tell those two apart on the device (ADR-0024).
        alsa-utils
        # Wi-Fi from the desktop UI: gnome-shell's network indicator
        # only speaks NetworkManager (libnm is a gnome-shell dep; the
        # daemon is not). Runs with wifi.backend=iwd — iwd stays the
        # supplicant (conf in mkosi.extra); NM owns all interfaces,
        # see mkosi.postinst.chroot.
        networkmanager
        # Dart SDK (official): the Forge/LisaCode harness runs `dart
        # analyze` in its plan→edit→analyze loop (§5.12.1). Full Flutter
        # is fetched to /var on demand by `lisa forge --setup`, never baked
        # (ADR-0023) — dart alone keeps the harness loop working.
        dart
        # git: how `lisa forge --setup` installs the Flutter SDK on
        # aarch64 — Google publishes no arm64 Linux tarball, so the SDK is
        # a commit-pinned checkout of the release tag (ADR-0027). An
        # immutable root cannot pacman it in later, so it is named here.
        git

[Validation]
# Signed UKI + SecureBoot keys wired in once the M0 boot test is green.
SecureBoot=no
