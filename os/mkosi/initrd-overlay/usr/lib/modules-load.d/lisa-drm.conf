# Load the real DRM driver IN THE INITRD, before Plymouth starts
# (issue #138, ADR-0026).
#
# ADR-0026 put amdgpu and its firmware INTO the initrd, and the nightly
# asserts they are there. They are. But present is not loaded, and the
# boot trace on the reference iMac18,2 shows nothing ever loads it:
#
#   1.42s  simpledrm initialised on simple-framebuffer.0
#   1.55s  plymouth-start  <- binds simpledrm, the only DRM device
#   2.83s  switch-root
#   ~6s    amdgpu initialises, in the ROOTED system
#
# Plymouth grabs the one DRM device that exists at 1.55s, amdgpu takes
# the display over four seconds later, and the splash dies in the
# handover. Nothing is misconfigured; the module is simply never
# modprobed while the initrd is running, because no device rule in the
# initrd pulls it in and nothing asks for it by name.
#
# systemd-modules-load.service runs Before=sysinit.target with
# DefaultDependencies=no — earlier than plymouth-start — and modprobe is
# synchronous, so listing amdgpu here means DRM is up before Plymouth
# looks for a device to bind.
#
# The cost is real and deliberate: boot waits for amdgpu to initialise
# (~1s on Polaris11) instead of doing it after switch-root. That is the
# price of a splash on this hardware.
amdgpu
# The same job under QEMU, where the display is virtio-vga
# (screenshots.yml) — so CI exercises this path rather than only
# hardware.
virtio_gpu
