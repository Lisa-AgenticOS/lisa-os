# Plymouth must not start before the real DRM driver is loaded
# (issue #138).
#
# systemd-modules-load.service loads amdgpu (see
# /usr/lib/modules-load.d/lisa-drm.conf) and both units are
# DefaultDependencies=no and ordered Before=sysinit.target — which makes
# them SIBLINGS, free to run in parallel. Without this ordering the race
# is decided by whichever wins on the day, and the failure mode when
# Plymouth wins is exactly the bug being fixed: it binds simpledrm and
# the splash is lost when amdgpu takes the display.
[Unit]
After=systemd-modules-load.service
