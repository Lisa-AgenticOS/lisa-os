# The initrd's copy of the splash configuration.
#
# THIS IS THE ONE THAT DECIDES WHAT YOU SEE. plymouthd starts in the
# initrd (`sysinit.target.wants/plymouth-start.service` beside this
# tree) and survives the switch-root as the same process — measured on
# the reference iMac, v20260805.81:
#
#     18:36:19.533  Starting Show Plymouth Boot Screen...   (initrd)
#     18:36:20.351  Started Show Plymouth Boot Screen.
#     18:36:20.695  Starting Plymouth switch root service...
#     18:36:43.252  Finished Hold until boot process finishes up.
#
# One `plymouthd`, PID 290, from the initrd to GDM. So the theme it
# resolves is the one resolved HERE, out of the initrd's own filesystem,
# and the root's /etc/plymouth/plymouthd.conf is never consulted for the
# splash you actually watch. Until this file existed the initrd relied
# on mkosi-initrd's `plymouth` package happening to ship a
# plymouthd.defaults that says `bgrt` — true today, and stated by
# nobody.
#
# It must agree with mkosi.extra/etc/plymouth/plymouthd.conf, which
# carries the full reasoning (and #283's). Both copies move together,
# the same rule the watermark already lives under; check-plymouth.sh
# fails the build if they diverge.
[Daemon]
Theme=bgrt
ShowDelay=0
DeviceTimeout=8
