# No suspend, ever (with the masked sleep targets and the gschema power
# override): the field iMac's amdgpu cannot resume under Linux, so suspend
# is a hard power-off that strands the machine (no SSH) until a
# power-button cycle. Idle blanks the screen; the box stays up.
[Login]
IdleAction=ignore
HandleSuspendKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
