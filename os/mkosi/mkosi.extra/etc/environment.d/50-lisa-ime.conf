# Route toolkit text input through fcitx5 for the GRAPHICAL session.
#
# /etc/profile.d/lisa-ime.sh sets the same three variables, but only for
# LOGIN SHELLS — a GDM Wayland session is started by the systemd user
# manager and never sources it, so on the reference device gnome-shell
# ran with none of them and every app it launched inherited that gap
# (checked 2026-08-03: /proc/<gnome-shell>/environ had no GTK_IM_MODULE).
# environment.d IS imported by the user manager before the session
# starts, which is the difference between "configured" and "applied".
#
# SCOPE, honestly: this reaches GTK3, Qt and XWayland clients. GTK4
# Wayland apps negotiate text-input-v3 with the compositor and ignore
# GTK_IM_MODULE, and mutter does not hand that protocol to third-party
# input methods — fcitx5's waylandim addon loads and unloads again on
# every start here. So the writing tools and the double-tap-Shift
# summon reach the toolkits below, NOT Wayland-native GTK4 apps or the
# shell itself (#208). The system-wide gesture belongs to the Lisa
# Desktop fork, which owns the compositor; Super+Shift+Space is the
# keybinding that works everywhere today.
GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
