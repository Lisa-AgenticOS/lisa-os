# Lisa's boot splash, stated once, in the file that owns the answer.
#
# WHY THIS FILE AND NOT THE SYMLINK (#283). Plymouth resolves its theme
# in three places, in this order:
#
#   1. /etc/plymouth/plymouthd.conf          <- this file
#   2. /usr/share/plymouth/plymouthd.defaults
#   3. /usr/share/plymouth/themes/default.plymouth   (legacy symlink)
#
# (3) is not a file any distribution ships — it is *state*, and
# `plymouth-set-default-theme` deletes it on its way to writing (1):
#
#     [ -L .../themes/default.plymouth ] && rm -f .../themes/default.plymouth
#     read_or_set_file_ini_value ${PLYMOUTH_CONFDIR}/plymouthd.conf Daemon Theme ...
#
# The image used to ship (3) as a symlink to a bespoke `lisa` theme that
# was deleted on 2026-07-28 (1fec591, "it loaded, FAILED"), so it was
# dangling on every device — verified on the reference iMac running
# v20260805.81. Retargeting it at `bgrt` would have put a fourth,
# hand-maintained copy of one value in the tree, one that the first
# `plymouth-set-default-theme` run on the machine deletes anyway. It is
# gone instead, and the answer lives here.
#
# (2) says `Theme=bgrt` today, but its own first line is "Distribution
# defaults. Changes to this file will get overwritten during upgrades" —
# so an Arch plymouth update is free to change what Lisa boots with.
# This file is the admin layer and is not overwritten.
#
# WHY bgrt AND NOT A THEME OF OUR OWN. bgrt is Arch's stock theme; it
# draws from `ImageDir=/usr/share/plymouth/themes/spinner`, so replacing
# that one `watermark.png` rebrands the splash with no theme to
# maintain (#45). The hand-made `lisa` theme had 26 files where spinner
# has 74, failed to load, and silently fell back to bgrt anyway.
#
# WHAT IT LOOKS LIKE, measured rather than assumed. bgrt's background is
# 0x000000 and its `UseFirmwareBackground=true` paints the ACPI BGRT
# image — the firmware logo — behind the spinner. On QEMU/OVMF there is
# one (the CI frames show TianoCore centred). On the reference iMac18,2
# there is not: /sys/firmware/acpi/bgrt does not exist, so the splash is
# a black field carrying only the spinner and the Lisa watermark at 96%
# height. "Black screen" and "the Lisa splash" are the same picture on
# that hardware, which is worth knowing before diagnosing one as the
# other.
[Daemon]
Theme=bgrt
# Both are already the distribution defaults; they are restated because
# a splash that waits before drawing is indistinguishable from a splash
# that never came up, and this file is where someone will look.
ShowDelay=0
DeviceTimeout=8
