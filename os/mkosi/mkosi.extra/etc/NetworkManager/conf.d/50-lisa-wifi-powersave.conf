# Wi-Fi powersave off (reference hardware reliability).
#
# The reference iMac sits on Wi-Fi (its ethernet port is unplugged), and
# with powersave on, the link drops under idle — three disconnects in one
# boot on 2026-07-29, each one indistinguishable from the machine being
# asleep to anything talking to it over the network. For a machine whose
# assistant is meant to be reachable, a radio that naps is a bug, not a
# saving.
#
# 2 = NM_SETTING_WIRELESS_POWERSAVE_DISABLE.
[connection]
wifi.powersave = 2
