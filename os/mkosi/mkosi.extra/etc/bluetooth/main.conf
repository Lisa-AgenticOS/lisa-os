# Bluetooth: come back to paired devices without being asked.
#
# Stock bluez leaves the controller's power state to whatever it was, and
# gives up on a wandered-off device quickly. On a desktop whose pointer —
# and on Apple hardware often the keyboard too — is Bluetooth, that means
# sitting down and finding nothing responds until you open Settings.
#
# Replacing the whole file rather than dropping a fragment in: bluez has
# no `main.conf.d`. Nothing is lost by it — every value in Arch's shipped
# main.conf is commented out, so the file is documentation plus empty
# section headers, and these are the only settings we actually change.
#
# NOT set here, deliberately:
#   Experimental=true  would add battery levels for Apple Magic devices,
#                      and also turns on every other experimental
#                      interface in the daemon. A battery indicator is
#                      not worth shipping experimental daemon features to
#                      every machine by default.

[Policy]
# Power the controller at boot and after resume. Without it a machine
# whose only input is Bluetooth can come up with no way to type, which
# is not a preference, it is a lockout.
AutoEnable=true

# How hard to chase a paired device that dropped — a keyboard that
# slept, a headset that left the room and came back. Stock gives up
# early; this keeps trying for ~2 minutes with a backoff, which is the
# difference between "it reconnects when I sit down" and "I open
# Settings every morning".
ReconnectAttempts=7
ReconnectIntervals=1,2,4,8,16,32,64

[General]
# Stay connectable so a paired device can initiate the reconnect itself
# instead of waiting to be scanned for. This costs idle power in the
# controller — fine on a mains-powered iMac, worth revisiting if Lisa
# ever ships on a laptop.
FastConnectable=true
