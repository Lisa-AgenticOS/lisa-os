# A person whose machine will not boot gets a shell (ADR-0022 phase 3,
# issue #23 acceptance case (c)).
#
# THIS COPY IS THE ROOT FILESYSTEM'S: it covers a boot that DID pivot
# and then failed later (a broken fstab entry, a failed mount unit).
# The initrd carries its own copy for the case where no slot mounts
# at all — neither covers the other, which is why both exist.
#
# Reproduced in CI before writing it (ab-recovery "Boot 3"): booting
# with a root= PARTLABEL no slot carries reaches
#
#     You are in emergency mode...
#     Cannot open access to console, the root account is locked.
#
# and stops there. The account is locked because Lisa provisions no root
# password — deliberately, and that stays true.
#
# SYSTEMD_SULOGIN_FORCE=1 makes systemd's emergency/rescue units invoke
# `sulogin --force`, which opens a root shell even when the account is
# locked. It is the mechanism systemd documents for images with no root
# password (systemd.exec(5), sulogin(8)).
#
# WHY THIS IS NOT A SECURITY REGRESSION, restated where somebody will
# read it while considering removing it: the root filesystem is not
# encrypted. Anyone at the machine can already read and rewrite every
# byte with a USB stick — which is literally how the reference device
# was recovered. Refusing them a shell protects nothing and converts a
# recoverable fault into a brick. It is also the wrong shape of
# guardrail: one sits between the model and the machine, never between
# a person and their own machine (CLAUDE.md 6a, ADR-0030).
#
# TPM-backed disk encryption inverts this reasoning and is when to
# reconsider — see ADR-0022 "What would change this".
[Service]
Environment=SYSTEMD_SULOGIN_FORCE=1
