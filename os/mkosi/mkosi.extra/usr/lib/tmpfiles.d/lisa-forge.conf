# Forged apps live on the durable /var, never in the image (ADR-0023):
# `lisa forge --build` installs each app's bundle as
# /var/lib/lisa/forge/apps/<app-id>/bundle, staged then renamed, with the
# previous build kept beside it. Group-writable so the desktop user (lisa
# group) can forge and rebuild apps without root; the .desktop entry that
# launches them is written into the user's own ~/.local/share/applications.
# Without this directory `lisa forge --build` falls back to the user's data
# dir, so a plain dev host needs nothing.
d /var/lib/lisa            0755 root root -
d /var/lib/lisa/forge      0755 root root -
d /var/lib/lisa/forge/apps 2775 root lisa -
