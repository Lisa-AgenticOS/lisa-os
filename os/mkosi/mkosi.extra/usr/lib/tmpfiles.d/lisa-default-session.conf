# Make Lisa Desktop the session GDM starts (ADR-0038, ADR-0048).
#
# GDM reads the user's saved session from accountsservice, whose store is
# /var/lib/AccountsService/users/<name>. /var is a SEPARATE, PERSISTENT
# PARTITION on this image (mkosi.repart/20-var.conf), mounted over
# whatever the root slot carries — so a file baked at that path in
# mkosi.extra would be shadowed on every real install and visible only
# in a CI build that never mounts /var. That is precisely the "installed
# where nothing reads it" defect (#241), and it is why the record ships
# under /usr/share/factory and is copied here instead.
#
# Same mechanism, and the same reasoning, as lisa-home-factory.conf.
# `C` copies only when the target is missing, so this seeds a fresh
# install exactly once and never overwrites a choice the user has since
# made at the greeter — GDM writes this same file when somebody picks a
# different session, and that choice must survive the next A/B update.
#
# The parent directories are created explicitly rather than left to
# tmpfiles' implicit parent creation, and THE MODES ARE NOT A STYLE
# CHOICE. accountsservice validates them at startup and refuses to run
# if they are wrong (src/main.c):
#
#     if (!ensure_directory (get_icondir (), 0775, &error) ||
#         !ensure_directory (get_userdir (), 0700, &error) ||
#     ...
#     "Directory %s has wrong mode %o; it should be %o"
#
# A conventional 0755 here would stop accounts-daemon from starting, and
# the visible symptom would be a greeter with no users on it — nothing
# that names this file. Read out of the source, not assumed.
#
# 0644 on the record itself matches what the daemon writes when GDM
# saves a session choice (g_file_set_contents under root's umask), so
# the mode does not flip the first time somebody changes it.
d /var/lib/AccountsService       0755 root root -
d /var/lib/AccountsService/users 0700 root root -
C /var/lib/AccountsService/users/lisa 0644 root root - /usr/share/factory/var/lib/AccountsService/users/lisa
