# Populate a fresh dedicated /home partition (ADR-0019) from the factory
# tree. On first boot with the repart-created home partition mounted, /home
# is an empty btrfs — the baked first-login state (the gnome-initial-setup
# suppression marker, PLAN §3) lives under /usr/share/factory and is copied
# exactly once (C = copy only when the target is missing). Legacy installs
# using the /var/home bind already carry their state; the copy is a no-op.
C /home/lisa - lisa lisa - /usr/share/factory/home/lisa
