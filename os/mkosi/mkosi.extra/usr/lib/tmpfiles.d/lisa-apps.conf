# Out-of-image app payloads (ADR-0020, ADR-0023). The apps channel
# installs trees here — the GJS shell surfaces and apps, the lisa CLI —
# and the LOGIN USER has to be able to execute them: /usr/bin/lisa-app
# resolves .../current and runs the surface as you.
#
# Kept outside /var/lib/lisa for the same reason as lisa-models, and it
# is not a style preference. /var/lib/lisa is lisa-inferenced's
# StateDirectory with DynamicUser=, so systemd relocates it to
# /var/lib/private/lisa, and both /var/lib/private (0700 root) and that
# directory (0700 nobody) are closed to everyone. A payload written
# there is correct, verified, and unusable — which is precisely what was
# happening on the reference iMac, silently, because a baked copy in the
# image masked it.
#
# setgid (2775) so unpacked files inherit group `lisa`, and GROUP-WRITABLE
# so whichever of the two writers gets there second can still install:
# lisa-apps-sync.service runs as root and usually creates these first, and
# `lisa apps update` is then run by the desktop user. On the reference iMac
# that came out as `!! <channel>: Permission denied (os error 13)` with the
# device stuck one payload version behind and no unprivileged way forward
# — ADR-0034 §7b says nothing user-facing needs sudo, and our own guard
# denies `escalate.privilege` unconditionally, so the directory has to be
# right instead (issue #239 defect 4).
#
# EVERY channel directory, including its versions/, and not just the two
# roots: `d` ADJUSTS an existing directory on each boot, which is what
# repairs the devices that already have 0755 root:lisa. A channel with no
# rule here is a channel that stays broken. cli/lisa/src/apps.rs pins this
# list to the channel table — a new channel with no rule fails the build.
#
# On the persistent /var partition, so payloads survive A/B updates.
d /var/lib/lisa-apps 2775 root lisa -
d /var/lib/lisa-apps/payloads 2775 root lisa -
d /var/lib/lisa-apps/payloads/shell 2775 root lisa -
d /var/lib/lisa-apps/payloads/shell/versions 2775 root lisa -
d /var/lib/lisa-apps/payloads/runtime 2775 root lisa -
d /var/lib/lisa-apps/payloads/runtime/versions 2775 root lisa -
