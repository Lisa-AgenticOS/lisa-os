# Out-of-image app payloads (ADR-0020, ADR-0023). The apps channel
# installs trees here — the Zen browser, the GJS shell surfaces, the lisa
# CLI — and the LOGIN USER has to be able to execute them:
# /usr/bin/zen-browser resolves .../current/zen and runs it as you.
#
# Kept outside /var/lib/lisa for the same reason as lisa-models, and it
# is not a style preference. /var/lib/lisa is lisa-inferenced's
# StateDirectory with DynamicUser=, so systemd relocates it to
# /var/lib/private/lisa, and both /var/lib/private (0700 root) and that
# directory (0700 nobody) are closed to everyone. A payload written
# there is correct, verified, and unusable — which is precisely what was
# happening on the reference iMac, silently, because the baked /opt/zen
# masked it.
#
# setgid (2775) so unpacked files inherit group `lisa`. On the
# persistent /var partition, so payloads survive A/B updates.
d /var/lib/lisa-apps 2775 root lisa -
d /var/lib/lisa-apps/payloads 2775 root lisa -
