# First boot on a real disk: grow /var into the disk's free space
# (models, ledger, context live there). Weight-split with the home
# partition 60-home.conf creates on fresh disks (ADR-0019): var 3 : home 1
# — models dominate storage needs. On the 19G image layout this is a
# no-op; on already-grown installs there is no free space left and
# nothing changes.
[Partition]
Type=var
GrowFileSystem=yes
Weight=300
