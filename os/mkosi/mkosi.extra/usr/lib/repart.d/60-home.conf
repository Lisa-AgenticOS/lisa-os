# Dedicated /home partition (ADR-0019) — created at FIRST BOOT on a real
# disk by systemd-repart, from the disk's free space, weight-split with the
# var partition (var 3 : home 1 — models dominate storage needs). The image
# itself ships no home partition (the 32 GB-stick budget has no room for a
# fixed one); fresh installs get a real, update-proof /home here, mounted by
# home.mount (by-partlabel, condition-guarded).
#
# Already-installed disks whose var partition has consumed the free space
# simply never create this partition — systemd-repart finds no room, the
# home.mount condition stays false, and the legacy /var/home bind
# (lisa-home-persist.service) keeps those systems persistent. No shrinking,
# no migration, nothing to break.
[Partition]
Type=home
Format=btrfs
Label=home
SizeMinBytes=1G
Weight=100
