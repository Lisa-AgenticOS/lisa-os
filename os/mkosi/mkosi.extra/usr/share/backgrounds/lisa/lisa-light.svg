<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160">
  <!-- Lisa default wallpaper, light variant (issue #24). A quiet field
       of the brand violet (#6D45C9 family): one diagonal blend, one
       huge off-center arc at ~5% luminance lift. No text, no logo -
       the brand is the color (docs/notes/design-direction.md). -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B54D4"/>
      <stop offset="1" stop-color="#5B36AD"/>
    </linearGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#field)"/>
  <circle cx="2980" cy="2560" r="2050" fill="#FFFFFF" fill-opacity="0.05"/>
</svg>
