# The ports lock (ADR-0051): which prebuilt third-party package files
# the x86_64 image consumes, pinned by sha256. One line per artifact:
#
#   <filename>  <sha256>
#
# The files live on this repo's rolling `ports` release, built by
# .github/workflows/ports.yml whenever a port's PKGBUILD changes.
# Bumping a port is TWO deliberate commits: (1) the PKGBUILD change,
# which makes ports.yml build and upload the new artifact and print
# the new lock lines in its job summary; (2) this file, updated from
# that summary. The release build fetches exactly these files and
# refuses a digest mismatch — so what an image contains is decided by
# the commit that built it, never by whatever a rolling tag holds
# (the #273 principle, applied to the ports).
#
# The aarch64 lane is NOT a consumer: it builds every port from source
# natively (no x86_64 binary is usable there, and upstream ships no
# Linux arm64 binaries to compare against).
#
# Seeded 2026-08-05 from v20260804.77's release assets, after checking
# each PKGBUILD's pkgver-pkgrel still matches the built artifact.
llama.cpp-b10093-2-x86_64.pkg.tar.zst  a439c0332562f4801a2c2bd2b527a2d54fb44c44b36e611f7d8ba1a5bd7e446d
whisper.cpp-v1.9.1-2-x86_64.pkg.tar.zst  359ee12f7c414a310cd78855b35ebe5eba95f62c1d9ac813f7a10d45e1c197fd
