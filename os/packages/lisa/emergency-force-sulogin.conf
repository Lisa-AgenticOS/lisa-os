# Let the owner into a rescue shell on their own machine (issue #23).
#
# THE FAILURE THIS REMOVES
#
# A slot fails to boot, systemd drops to emergency.service, which runs
# sulogin, which says:
#
#     You are in emergency mode... Cannot open access to console, the
#     root account is locked.
#
# and that is the end. The provisioned account cannot help: sulogin
# accepts root and nothing else. What saved the reference iMac after
# field incident #20 was editing `root=` from the boot menu with the `e`
# key — expert-only, and not a recovery path anyone should be expected
# to know.
#
# WHY THIS IS NOT A SECURITY REGRESSION
#
# The root filesystem is not encrypted today. Anyone standing at the
# machine can already read and rewrite every byte of it with a USB
# stick, which is exactly how that device was recovered. Refusing them a
# shell therefore protects nothing; it only converts a recoverable fault
# into a brick.
#
# It is also the wrong shape of guardrail. CLAUDE.md 6a: a guardrail
# sits between the model and the machine, never between a person and
# their own machine. Emergency mode is reached by a human at a console
# after their computer failed to boot — the last place to be enforcing
# policy against them.
#
# WHEN THIS MUST BE REVISITED
#
# TPM-backed disk encryption (PLAN §3, systemd-cryptenroll) changes the
# reasoning completely: a rescue shell on an unlocked rootfs would then
# be a way past the encryption rather than a way around a locked
# account. This drop-in must be reconsidered as part of that work, not
# carried forward by inertia.
[Service]
Environment=SYSTEMD_SULOGIN_FORCE=1
